name: RA Sync Bridge

# Relays RA (Resident Advisor) acquisition payloads that Claude's browser
# session commits under ra-sync/inbox/ to the existing server-side RA sync
# API (api/cron-ra.js / scripts/ra-sync.js), and hands the response back
# via a pushed git tag. See ra-sync/README.md for the full design and why
# a tag -- never a commit -- carries the response.
#
# Transport only (2026-09-26 addendum to the 2026-09-25 RA sync
# architecture): this workflow does not decide what counts as a new RA
# event, does not derive event fields, and does not touch source_runs
# directly -- all of that stays exactly where it already was, in
# scripts/ra-sync.js, called through the same CRON_SECRET-gated
# /api/cron-ra endpoint the device used to call directly. This workflow
# exists only because the device's own shell cannot reach 313.events (org
# egress policy blocks it end to end), while a GitHub Actions runner can.

on:
  # ra-sync-inbox transport (owner-approved 2026-10-19). The device writes
  # the payload to the ra-sync-inbox branch, then sends this dispatch.
  # repository_dispatch and workflow_dispatch always run THIS file as it
  # exists on the default branch, so only reviewed code holds CRON_SECRET.
  repository_dispatch:
    types: [ra-sync-payload]
  # Manual replay of one payload (idempotent: skipped if its response tag
  # already exists). Inputs are validated by the script before use.
  workflow_dispatch:
    inputs:
      action:
        description: start, complete or promote
        required: true
      runToken:
        description: the payload's runToken
        required: true
      sha:
        description: inbox-branch commit holding the payload (blank = branch tip)
        required: false
  # Report-only daily reconcile: fails the job if a payload on the inbox
  # branch has no response tag after a grace period. Relays nothing.
  schedule:
    - cron: '45 14 * * *'
  # LEGACY transport (payload pushed to main). Stays until the owner
  # authorizes the cutover; a follow-up PR removes it. It is what causes a
  # production redeploy per payload, which the inbox branch avoids.
  push:
    branches: [main]
    paths:
      - 'ra-sync/inbox/start-*.json'
      - 'ra-sync/inbox/complete-*.json'
      - 'ra-sync/inbox/promote-*.json'

permissions:
  contents: write   # only to push the response tag(s) -- no other write

# One relay at a time, and never cancel one mid-flight -- an in-progress
# run is mid-API-call against a live sync session; cancelling it partway
# would abandon that call with no response tag ever pushed.
concurrency:
  # The report-only reconcile gets its own group: GitHub keeps one pending run
  # per group, so a queued reconcile must never displace a pending relay.
  group: ra-sync-bridge-${{ github.event_name == 'schedule' && 'reconcile' || 'relay' }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      # token here (not the default GITHUB_TOKEN) matters: this repo's
      # default Actions token turned out to be read-only in practice even
      # with this workflow's own `permissions: contents: write` above
      # (confirmed 2026-09-27 -- the job reported success while silently
      # pushing no tag at all). GH_PUSH_TOKEN is the same fine-grained PAT
      # (Contents: read-and-write, this repo only) already used for the
      # device's own pushes -- reusing it here, rather than provisioning
      # a second token, is what checkout's own `persist-credentials`
      # then uses for every git write this job makes, tag pushes included.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Relay new RA sync payload(s) to /api/cron-ra
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RA_SYNC_API_URL: https://313.events/api/cron-ra
        run: node .github/scripts/ra-sync-bridge.js
