<style>
  :root{
    --bg:#0A0A0A; --panel:#202020; --panel-alt:#161616; --panel-hover:#272727;
    --ink:#F2F0E8; --ink-soft:#A9AAA3; --ink-dim:#5c5d58;
    --line:#2c2c2c; --line-soft:#212121;
    --accent:#D7FF00; --on-accent:#0A0A0A;

    --c-music:#5B3EFF; --c-theatre:#FF6A00; --c-dance:#FF2ECC; --c-visual:#00E5FF;

    --c-film:#2979FF; --c-night:#E100FF; --c-sports:#FF3B3B; --c-community:#3DFF6E;

    --c-training:#FFEA00; /* hazard yellow — classes, certifications, workforce training */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  a{color:inherit;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .wrap{max-width:820px;margin:0 auto;padding:14px 20px 64px;}
  header.site{
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    padding-bottom:10px;margin-bottom:24px;border-bottom:2px solid var(--ink);
  }
  .wordmark{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;font-size:22px;
    text-transform:uppercase;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;
  }
  .wordmark-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);display:inline-block;}
  .back-link{font-size:13px;font-weight:700;color:var(--ink-soft);text-decoration:none;text-transform:uppercase;letter-spacing:.02em;}
  .back-link:hover{color:var(--accent);}
  .back-link::before{content:'← ';}

  #loadingState, #notFoundState{padding:60px 0;text-align:center;color:var(--ink-soft);}
  #notFoundState{display:none;}
  #notFoundState a{color:var(--accent);font-weight:700;text-decoration:none;}
  #notFoundState a:hover{text-decoration:underline;}

  #eventContent{display:none;}
  /* 2026-09-16: was a fixed 16:9 box with object-fit:cover — built for
     landscape hero photography, but most submitted flyers are portrait
     (concert/show flyers, typically taller than wide), and cover-cropping
     a portrait image into a 16:9 frame chopped off the date/lineup text
     that's often at the top or bottom of the graphic. Jody: "can you just
     adjust the flier to fit? why do we have a fixed size?" — sizes to each
     image's own natural aspect ratio now (no cropping at all), just capped
     at a max-height so a very tall portrait doesn't dominate the page. */
  /* 2026-09-16 (Jody, looking at the Lost Legion portrait flyer live: "can
     the area for the flier just adapt to the artwork uploaded automatically?
     and also be responsive?") — the fix above sized the IMAGE to its own
     aspect ratio, but the WRAP was still width:100% with the border/
     background painted on that full-width box, so a portrait flyer (narrower
     than the .wrap's 820px) left a big empty panel beside it. Moving the
     border+background onto the image itself and letting the wrap just
     center it (text-align, no fixed width) means the visible box always
     hugs exactly whatever the uploaded image's real dimensions are —
     portrait, landscape, or square — at any viewport width. */
  .evt-image-wrap{max-height:70vh;margin:0 0 20px;text-align:center;}
  .evt-image-wrap img{
    display:inline-block;max-width:100%;max-height:70vh;width:auto;height:auto;
    background:var(--panel-alt);border:1px solid var(--line);

  .evt-cat-badge{

  /* Redesigned 2026-08-28 per Jody: on the dedicated event page this read

  .evt-editorial{
    display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:10px 14px;
    background:rgba(215,255,0,.07);border-left:3px solid var(--accent);

    padding:2px 0;
  }
  .evt-editorial-also a:hover{color:var(--accent);text-decoration:underline;}
  .evt-editorial-also a .ei-more-src{color:var(--ink-soft);font-weight:600;}

<script>
const SUPABASE_URL = "https://afvyfjfqukptnfmgshzn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NQgem2pH8h_ynP8ikwdmFw_5aoN34Q5"; // publishable key — safe for client code, read-only via RLS

const CATS = {
  music:    {label:"Music",            color:"var(--c-music)"},
  theatre:  {label:"Theatre & Comedy",  color:"var(--c-theatre)"},
  dance:    {label:"Dance & Opera",     color:"var(--c-dance)"},
  visual:   {label:"Visual Arts",       color:"var(--c-visual)"},
  museum:   {label:"Museums & History", color:"var(--c-museum)"},
  family:   {label:"Family",            color:"var(--c-family)"},
  fest:     {label:"Festivals & Parades", color:"var(--c-fest)"},
  food:     {label:"Food & Markets",    color:"var(--c-food)"},
  film:     {label:"Film",              color:"var(--c-film)"},
  nightlife:{label:"Nightlife & Club",  color:"var(--c-night)"},
  sports:   {label:"Sports",            color:"var(--c-sports)"},
  community:{label:"Community",         color:"var(--c-community)"},
  vendor:   {label:"Vendor Markets",    color:"var(--c-vendor)"},
  training: {label:"Classes & Training", color:"var(--c-training)"}
};

function decodeEntities(str) {
  if (!str) return str;
  return str
    .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
    .replace(/&#(\d+);/g, (_, dec) => String.fromCodePoint(parseInt(dec, 10)))
    .replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&nbsp;/g, " ");
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function safeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(url, window.location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  } catch { return ''; }
}
function shouldShowSource(e){
  if(!e.source) return false;
  const norm = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const src = norm(e.source);
  if(!src || src === 'manual') return false;
  if(e.venue && norm(e.venue) === src) return false;
  return true;
}
// Fallback action link (2026-09-13, Jody: a "Venue TBA" event sourced from
// Resident Advisor with no ticket_url/event_url is a dead end — "posts like
// this do not make any sense"). Most of the early Resident Advisor rows
// (see supabase/seed.sql) were hand-transcribed before this project had any
// real RA ingestion and never got a real per-event URL — and per
// api/cron-halo.js's own header, RA scraping stays off entirely ("remains
// off limits per its Terms of Use"), so there's no way to look up or
// generate the real listing URL for any specific one of these. Rather than
// leave the page with nothing clickable, link out to RA's own real,
// general Detroit events index — honestly labeled as a browse link, not
// implied to be this exact event's page. Only covers sources this project
// has actually verified a real, working general-listing URL for; add more
// only when a source is confirmed the same way.
function sourceSearchUrl(source){
  if(!source) return null;
  const s = String(source).toLowerCase();
  if(s.includes('resident advisor')) return 'https://ra.co/events/us/detroit';
  return null;
}

// Resale marketplace search links (2026-09-16, Jody: "see if the event is
// sold out ... to get tickets cheaper on the resale apps"). Deliberately
// just search-by-title deep links, not scraped price data -- verified live
// against each site 2026-09-16 (their search UIs/params change without
// notice, so re-check these three URLs directly if this ever stops
// working rather than assuming the code is wrong):
//   StubHub:    https://www.stubhub.com/secure/search?q=<title>
//   SeatGeek:   https://seatgeek.com/search?search=<title>&f=1
//   Vivid Seats: https://www.vividseats.com/search?searchTerm=<title>
// Title alone (not title+venue) is used as the query -- broader, but the
// three sites' own search results already show venue/city/date per result
// so a visitor can tell a same-named tribute act apart from the real show.
function resaleSearchUrls(title){
  const q = encodeURIComponent(String(title || '').trim());
  if(!q) return null;
  return {
    stubhub: `https://www.stubhub.com/secure/search?q=${q}`,
    seatgeek: `https://seatgeek.com/search?search=${q}&f=1`,
    vividseats: `https://www.vividseats.com/search?searchTerm=${q}`,
  };
}

// Only Ticketmaster's own dates.status.code=="offsale" is used here (see
// migration_030's header comment) -- never shown for any other source or
// status, and the copy itself hedges rather than claiming "SOLD OUT"
// outright, since "offsale" is also what an event shows before its sale
// window opens.
function resaleNoteHtml(e){
  if(e.source !== 'Ticketmaster' || e.ticketStatus !== 'offsale') return null;
  const urls = resaleSearchUrls(e.title);
  if(!urls) return null;
  return `<strong>Not currently on sale through Ticketmaster.</strong> That can mean it's sold out, or that tickets just haven't gone on sale yet -- worth a check either way. If it is sold out, resale prices on these often come down as the date gets closer:` +
    `<div class="evt-resale-links">` +
    `<a href="${escapeHtml(urls.stubhub)}" target="_blank" rel="noopener noreferrer">StubHub</a>` +
    `<a href="${escapeHtml(urls.seatgeek)}" target="_blank" rel="noopener noreferrer">SeatGeek</a>` +
    `<a href="${escapeHtml(urls.vividseats)}" target="_blank" rel="noopener noreferrer">Vivid Seats</a>` +
    `</div>`;
}
function truncateText(str, maxLen){
  if(!str) return '';
  const flat = str.replace(/\s+/g, ' ').trim();
  if(flat.length <= maxLen) return flat;
  const cut = flat.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > maxLen * 0.6 ? cut.slice(0, lastSpace) : cut).trim() + '…';
}

// ---- Add to Calendar (identical logic to index.html's own copy — see that
// file's comments for the full timezone/parsing reasoning; not repeated
// here to keep this page focused). ----
// Rewritten 2026-09-04 — see index.html's own parseTimeRange() for the full
// reasoning (Jody: a bare-start range like "5:30–11:00 PM" or "Noon–11:00
// PM" was silently parsed as starting at the END time, since the old regex
// only recognized a time when AM/PM immediately followed it).
function parseTimeRange(timeStr){
  if(!timeStr) return null;
  const NOON = {h:12, m:0}, MIDNIGHT = {h:0, m:0};
  const tokens = [];
  for(const m of timeStr.matchAll(/(\d{1,2}):(\d{2})\s*(AM|PM)/gi)){
    let hh = parseInt(m[1],10)%12; if(/PM/i.test(m[3])) hh += 12;
    tokens.push({index:m.index, time:{h:hh, m:parseInt(m[2],10)}, hasMeridiem:true});
  }
  for(const m of timeStr.matchAll(/\b(\d{1,2}):(\d{2})\b(?!\s*(?:AM|PM))/gi)){
    tokens.push({index:m.index, h12:parseInt(m[1],10)%12, m:parseInt(m[2],10), hasMeridiem:false});
  }
  for(const m of timeStr.matchAll(/\bnoon\b/gi)) tokens.push({index:m.index, time:NOON, hasMeridiem:true});
  for(const m of timeStr.matchAll(/\bmidnight\b/gi)) tokens.push({index:m.index, time:MIDNIGHT, hasMeridiem:true});
  if(!tokens.length) return null;
  tokens.sort((a,b)=>a.index-b.index);
  tokens.forEach((tok,i)=>{
    if(tok.hasMeridiem) return;
    const next = tokens.slice(i+1).find(t=>t.hasMeridiem);
    if(next){
      let hh = tok.h12; if(next.time.h>=12) hh += 12;
      tok.time = {h:hh, m:tok.m};
      tok.hasMeridiem = true;
    }
  });
  const resolved = tokens.filter(t=>t.hasMeridiem);
  if(!resolved.length) return null;
  return {start: resolved[0].time, end: resolved.length>1 ? resolved[1].time : null};
}
function pad2(n){ return String(n).padStart(2,'0'); }
function eventDateTimeParts(e){
  const [y,m,d] = e.date.split('-').map(Number);
  const range = parseTimeRange(e.time);
  const dateStr = `${y}${pad2(m)}${pad2(d)}`;
  if(!range){
    // All-day: honor the event's real end_date when it spans multiple days
    // (2026-09-02 audit fix — this used to always assume a single day
    // regardless of end_date, so Add to Calendar on a multi-day festival or
    // exhibit silently created a 1-day entry). ICS/Google Calendar's
    // all-day DTEND is EXCLUSIVE (the day after the event's real last day),
    // so a genuine multi-day end_date still needs +1 day, same as the
    // single-day fallback always did.
    let endY = y, endM = m, endD = d + 1;
    if(e.endDate && e.endDate > e.date){
      const [ey, em, ed] = e.endDate.split('-').map(Number);
      endY = ey; endM = em; endD = ed + 1;
    }
    const next = new Date(endY, endM-1, endD);
    const nextStr = `${next.getFullYear()}${pad2(next.getMonth()+1)}${pad2(next.getDate())}`;
    return { allDay:true, startDate:dateStr, endDate:nextStr };
  }
  const startTime = `${pad2(range.start.h)}${pad2(range.start.m)}00`;
  let endDateStr = dateStr, endTime;
  if(range.end){
    endTime = `${pad2(range.end.h)}${pad2(range.end.m)}00`;
    if(range.end.h < range.start.h || (range.end.h === range.start.h && range.end.m < range.start.m)){
      const next = new Date(y, m-1, d+1);
      endDateStr = `${next.getFullYear()}${pad2(next.getMonth()+1)}${pad2(next.getDate())}`;
    }
  } else {
    const endDt = new Date(y, m-1, d, range.start.h, range.start.m + 120);
    endDateStr = `${endDt.getFullYear()}${pad2(endDt.getMonth()+1)}${pad2(endDt.getDate())}`;
    endTime = `${pad2(endDt.getHours())}${pad2(endDt.getMinutes())}00`;
  }
  return { allDay:false, startDate:dateStr, startTime, endDate:endDateStr, endTime };
}
function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function foldICSLine(line){
  if(line.length <= 75) return line;
  let out = line.slice(0,75), rest = line.slice(75);
  while(rest.length){ out += '\r\n ' + rest.slice(0,74); rest = rest.slice(74); }
  return out;
}
function buildEventLocation(e){ return e.city ? `${e.venue}, ${e.city}` : e.venue; }
function buildEventDescription(e){
  const parts = [];
  if(e.description) parts.push(truncateText(e.description, 300));
  if(e.note) parts.push(e.note);
  if(shouldShowSource(e)) parts.push(`Via ${e.source}`);
  if(e.ticketUrl && safeUrl(e.ticketUrl)) parts.push(safeUrl(e.ticketUrl));
  parts.push(`Details: ${window.location.href}`);
  return parts.join('\n');
}
function buildICS(e){
  const parts = eventDateTimeParts(e);
  const uid = `${e.date}-${e.title}-${e.venue}`.replace(/[^a-zA-Z0-9]+/g,'-').slice(0,150) + '@313.events';
  const now = new Date();
  const dtstamp = `${now.getUTCFullYear()}${pad2(now.getUTCMonth()+1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
  const dtstart = parts.allDay ? `DTSTART;VALUE=DATE:${parts.startDate}` : `DTSTART:${parts.startDate}T${parts.startTime}`;
  const dtend = parts.allDay ? `DTEND;VALUE=DATE:${parts.endDate}` : `DTEND:${parts.endDate}T${parts.endTime}`;
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//313.events//Add to Calendar//EN','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', `UID:${uid}`, `DTSTAMP:${dtstamp}`, dtstart, dtend,
    `SUMMARY:${icsEscape(e.title)}`, `LOCATION:${icsEscape(buildEventLocation(e))}`,
    `DESCRIPTION:${icsEscape(buildEventDescription(e))}`, 'END:VEVENT', 'END:VCALENDAR',
  ];
  return lines.map(foldICSLine).join('\r\n');
}
function buildGoogleCalUrl(e){
  const parts = eventDateTimeParts(e);
  const dates = parts.allDay ? `${parts.startDate}/${parts.endDate}` : `${parts.startDate}T${parts.startTime}/${parts.endDate}T${parts.endTime}`;
  const params = new URLSearchParams({
    action: 'TEMPLATE', text: e.title, dates, details: buildEventDescription(e),
    location: buildEventLocation(e), ctz: 'America/Detroit',
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function shareEvent(e){
  const dateLabel = dateRangeLabel(e, 'short');
  const bits = [e.title, e.venue].filter(Boolean).join(' — ');
  const when = [dateLabel, e.time].filter(Boolean).join(' ');
  const text = when ? `${bits} (${when})` : bits;
  const url = window.location.href;
  if(navigator.share){ navigator.share({title: e.title, text, url}).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(`${text}\n${url}`).then(()=>{
      const btn = document.getElementById('evtShareBtn');
      if(!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(()=>{ btn.textContent = original; }, 1600);
    }).catch(()=>{});
  }
}


// SH.N (2026-09-21, EPIC-006) — single canonical precedence rule for
// resolving an event's public-facing venue name/address/city. Canonical
// venues data (embedded here as row.venues via the real venue_id foreign
// key) is authoritative for public display whenever venue_id resolves and
// the canonical field itself is nonblank; the event's own raw text fields
// remain the fallback — used whenever venue_id is null/unresolved, or the
// canonical field is itself blank — and nothing is ever invented beyond
// what one of those two sources actually has. This project has no build
// step (every page duplicates its own small helpers — see radar.html's
// header comment), so this exact function is duplicated verbatim across
// every public page/endpoint that resolves venue metadata: index.html
// relies on events_public's own equivalent SQL coalesce() instead (see
// migration_025), calendar.html/map.html/radar.html each carry this
// identical copy, and api/event-meta.js uses the Node-side twin
// (resolvePublicVenueDisplay) in api/_lib/venue-lookup.js. Keep every copy
// identical if this logic ever changes.
function resolveVenueDisplay(row) {
  const isBlank = (s) => s === null || s === undefined || (typeof s === "string" && s.trim() === "");
  const v = (row && row.venues) || null; // embedded canonical venue via venue_id — null when unresolved
  const rawName = row ? row.venue_name_raw : null;
  const rawAddress = row ? row.venue_address_raw : null;
  const rawCity = row ? row.venue_city_raw : null;
  return {
    name: !isBlank(v && v.name) ? v.name : (isBlank(rawName) ? null : rawName),
    address: !isBlank(v && v.address) ? v.address : (isBlank(rawAddress) ? null : rawAddress),
    city: !isBlank(v && v.city) ? v.city : (isBlank(rawCity) ? null : rawCity),
    lat: (v && typeof v.lat === "number") ? v.lat : null,
    lng: (v && typeof v.lng === "number") ? v.lng : null,
  };
}

function mapRow(row) {
  const vd = resolveVenueDisplay(row); // SH.N — canonical-first venue name/address/city
  return {
    id: row.id,
    date: row.start_date,
    // end_date (2026-09-02 audit fix) — see index.html's mapSupabaseRow()
    // comment for the multi-day bug this closes; on this page specifically
    // it also fixes Add to Calendar (eventDateTimeParts()) always creating
    // a 1-day entry for a multi-day event regardless of its real span.
    endDate: row.end_date || row.start_date,
    title: decodeEntities(row.title),
    description: row.description ? decodeEntities(row.description) : undefined,
    imageUrl: row.image_url || undefined,
    venue: decodeEntities(vd.name) || "Venue TBA",
    venueId: row.venue_id || null,
    // SH.N: sourced through resolveVenueDisplay() — canonical venues.address
    // when venue_id resolves and is nonblank, raw venue_address_raw
    // otherwise, blank/undefined (no invented address) if neither has one.
    address: vd.address ? decodeEntities(vd.address) : undefined,
    city: (vd.city && vd.city.toLowerCase() !== "detroit") ? decodeEntities(vd.city) : undefined,
    cat: row.category,
    time: row.time_display || "",
    free: !!row.is_free,
    // See migration_034_clothing_optional.sql.
    clothingOptional: !!row.is_clothing_optional,
    source: row.source || "Manual",
    note: row.note ? decodeEntities(row.note) : undefined,
    ticketUrl: row.ticket_url || undefined,
    // Named eventPageUrl, not eventUrl — index.html/calendar.html/map.html
    // each already have a function called eventUrl(e) (the internal
    // event.html permalink); keeping this field's name distinct everywhere
    // avoids colliding with that. See migration_022_event_url.sql.
    eventPageUrl: row.event_url || undefined,
    priceFrom: row.price_from ?? undefined,
    ticketStatus: row.ticket_status || undefined,
  };
}

// Range-aware date label (2026-09-02 audit fix) — a plain single-date label
// was the only option anywhere on this page even for an event with a real,
// later end_date, which read as flatly wrong for a multi-day festival or
// exhibit ("Aug 21" on something that's actually Aug 21-24). weekdayStyle
// picks the same two formats already used on this page: 'long' for the
// prominent evtWhen heading, 'short' for the share-sheet text.
function dateRangeLabel(e, weekdayStyle){
  const opts = {weekday: weekdayStyle, month: weekdayStyle === 'long' ? 'long' : 'short', day: 'numeric'};
  const start = new Date(e.date+"T12:00:00").toLocaleDateString('en-US', opts);
  if(!e.endDate || e.endDate <= e.date) return start;
  const end = new Date(e.endDate+"T12:00:00").toLocaleDateString('en-US', opts);
  return `${start} – ${end}`;
}

function priceHtml(e){
  const el = document.getElementById('evtPrice');
  if(e.free){ el.textContent = 'Free'; el.classList.add('free'); el.style.display = 'block'; return; }
  if(typeof e.priceFrom === 'number' && isFinite(e.priceFrom) && e.priceFrom > 0){
    el.textContent = `From $${e.priceFrom.toFixed(2).replace(/\.00$/,'')}`;
    el.style.display = 'block';
  }
}

function renderEvent(e){
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('eventContent').style.display = 'block';

  // ---- meta / SEO (client-side only — this is a static SPA with no
  // server-side per-page rendering, so a crawler that doesn't execute JS
  // won't see these; still worth setting for the browser tab, for sharing
  // tools that do run JS, and for the JSON-LD block below). ----
  const dateLabel = dateRangeLabel(e, 'long');
  const pageTitle = `${e.title} — ${dateLabel} — 313.events`;
  const metaDesc = truncateText(e.description || `${e.title} at ${e.venue}${e.city ? ', '+e.city : ''} on ${dateLabel}.`, 155);
  document.getElementById('pageTitle').textContent = pageTitle;
  document.getElementById('metaDescription').setAttribute('content', metaDesc);
  document.getElementById('ogTitle').setAttribute('content', pageTitle);
  document.getElementById('ogDescription').setAttribute('content', metaDesc);
  document.getElementById('ogUrl').setAttribute('content', window.location.href);
  document.getElementById('twitterTitle').setAttribute('content', pageTitle);
  document.getElementById('twitterDescription').setAttribute('content', metaDesc);
  document.getElementById('canonicalLink').setAttribute('href', window.location.href);
  const ogImg = safeUrl(e.imageUrl) || 'https://313.events/assets/social/og-default.png';
  document.getElementById('ogImage').setAttribute('content', ogImg);
  document.getElementById('twitterImage').setAttribute('content', ogImg);

  // ---- image ----
  // onerror hides the box entirely rather than leaving a bare border/
  // background with a broken-image icon and alt text poking out of the
  // corner — a submitted link that isn't a direct image URL (a Google
  // Drive/Photos share link, an Instagram or Facebook post URL, anything
  // that serves an HTML page instead of raw image bytes) will always fail
  // to load as an <img> src, and that's more common than a truly broken
  // link, so failing invisibly beats failing loudly here.
  if(e.imageUrl && safeUrl(e.imageUrl)){
    const wrap = document.getElementById('evtImageWrap');
    const img = document.getElementById('evtImage');
    img.onerror = () => { wrap.style.display = 'none'; };
    wrap.style.display = 'block';
    img.src = safeUrl(e.imageUrl);
    img.alt = e.title;
  }

  // ---- badge / title / meta ----
  const cat = CATS[e.cat] || {label: e.cat || 'Event', color: 'var(--accent)'};
  const badge = document.getElementById('evtCatBadge');
  badge.textContent = cat.label;
  badge.style.background = cat.color;
  document.getElementById('evtTitle').textContent = e.title;
  document.getElementById('evtWhen').innerHTML = `<strong>${escapeHtml(dateLabel)}</strong>${e.time?` · ${escapeHtml(e.time)}`:''}`;
  // 2026-09-13: link the venue name to its own permalink page when this
  // event resolved to a real venues row (venue_id) — stays plain text for
  // the "Venue TBA"/unmatched cases rather than linking to a guessed page.
  const venueHref = e.venueId != null ? `venue.html?id=${encodeURIComponent(e.venueId)}` : null;
  document.getElementById('evtWhere').innerHTML = `${venueHref?`<a class="evt-venue-link" href="${escapeHtml(venueHref)}">${escapeHtml(e.venue)}</a>`:escapeHtml(e.venue)}${e.city?` — ${escapeHtml(e.city)}`:''}`;

  const addrEl = document.getElementById('evtAddress');
  if(e.address){
    addrEl.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.address)}`;
    addrEl.textContent = `📍 ${e.address} — Get directions`;
    addrEl.style.display = 'block';
  } else {
    addrEl.style.display = 'none';
  }
  priceHtml(e);

  // ---- actions ----
  const actions = document.getElementById('evtActions');
  let actionsHtml = '';
  if(e.ticketUrl && safeUrl(e.ticketUrl)){
    actionsHtml += `<a class="btn-primary" href="${escapeHtml(safeUrl(e.ticketUrl))}" target="_blank" rel="noopener noreferrer">${e.free?'More info':'Tickets & info'}</a>`;
  }
  if(e.eventPageUrl && safeUrl(e.eventPageUrl) && e.eventPageUrl !== e.ticketUrl){
    actionsHtml += `<a class="btn-secondary" href="${escapeHtml(safeUrl(e.eventPageUrl))}" target="_blank" rel="noopener noreferrer">Event page</a>`;
  }
  // Fallback when neither a real ticket link nor an event page link exists
  // — see sourceSearchUrl()'s comment above. Never shown alongside a real
  // link; only fills the gap when there'd otherwise be nothing to click
  // through to at all.
  if(!(e.ticketUrl && safeUrl(e.ticketUrl)) && !(e.eventPageUrl && safeUrl(e.eventPageUrl))){
    const fallbackUrl = sourceSearchUrl(e.source);
    if(fallbackUrl){
      actionsHtml += `<a class="btn-secondary" href="${escapeHtml(fallbackUrl)}" target="_blank" rel="noopener noreferrer">Browse on Resident Advisor &rarr;</a>`;
    }
  }
  actionsHtml += `<a class="btn-secondary" href="${escapeHtml(buildGoogleCalUrl(e))}" target="_blank" rel="noopener noreferrer">Add to Google Cal</a>`;
  // Blob + download, not a bare `data:` URI — see index.html's identical
  // addToCalendarHtml() comment for why (2026-09-04: broken on Mac Safari
  // and iPhone with the old data: URI approach).
  const icsBlobUrl = URL.createObjectURL(new Blob([buildICS(e)], {type:'text/calendar;charset=utf-8'}));
  const icsFilename = `${(e.title||'event').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80) || 'event'}.ics`;
  actionsHtml += `<a class="btn-secondary" href="${escapeHtml(icsBlobUrl)}" download="${escapeHtml(icsFilename)}">Apple/Outlook</a>`;
  actionsHtml += `<button type="button" class="btn-secondary" id="evtShareBtn" onclick="shareEvent(currentEvent)">Share</button>`;
  actions.innerHTML = actionsHtml;

  // ---- description / note / source ----
  if(e.description){
    const d = document.getElementById('evtDesc');
    d.textContent = e.description;
    d.style.display = 'block';
  }
  if(e.clothingOptional){
    document.getElementById('evtClothingOptional').style.display = 'inline-block';
  }
  if(e.note){
    const n = document.getElementById('evtNote');
    n.textContent = e.note;
    n.style.display = 'block';
  }
  const resaleHtml = resaleNoteHtml(e);
  if(resaleHtml){
    const r = document.getElementById('evtResale');
    r.innerHTML = resaleHtml;
    r.style.display = 'block';
  }
  if(shouldShowSource(e)){
    const s = document.getElementById('evtSource');
    s.textContent = `via ${e.source}`;
    s.style.display = 'block';
  }

  // ---- JSON-LD Event schema (helps this page get picked up as a rich
  // result / event listing in search — one of the concrete organic-traffic
  // levers discussed earlier: individual shareable, structured event URLs). ----
  const ld = {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": e.title,
    "startDate": e.date,
    // endDate (2026-09-02 audit fix): only set when genuinely later than
    // startDate — schema.org treats a present-but-equal endDate as fine
    // either way, but omitting it for the common single-day case keeps this
    // block matching what it always emitted before for those events.
    ...(e.endDate && e.endDate > e.date ? { "endDate": e.endDate } : {}),
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "eventStatus": "https://schema.org/EventScheduled",
    "location": { "@type": "Place", "name": e.venue, "address": e.city || "Detroit, MI" },
    "description": e.description || metaDesc,
    "url": window.location.href,
  };
  if(e.imageUrl && safeUrl(e.imageUrl)) ld.image = [safeUrl(e.imageUrl)];
  if(e.ticketUrl && safeUrl(e.ticketUrl)) ld.offers = { "@type": "Offer", "url": safeUrl(e.ticketUrl), "price": e.free ? "0" : (e.priceFrom || undefined), "priceCurrency": "USD" };
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(ld);
  document.head.appendChild(ldScript);
}

// "As seen in" — same source of truth as index.html's editorialByEvent,
// just a lookup scoped to this one event id instead of loading the whole
// table. Reads through editorial_article_events (migration_021, 2026-09-04)
// rather than editorial_articles.matched_event_id directly, so this shows up
// even when this event was one of SEVERAL a roundup article covered, not
// just when it was that article's first/only match — see that migration's
// header comment. limit=5 rather than 1 since ordering by an embedded
// resource's column isn't reliable over PostgREST — freshest is picked
// client-side instead; a single event realistically has at most a handful
// of press mentions, so this is never actually fetching much.
async function loadEditorialLink(id){
  try {
    const url = `${SUPABASE_URL}/rest/v1/editorial_article_events?event_id=eq.${encodeURIComponent(id)}&select=editorial_articles(title,url,source,published_at)&limit=5`;
    const resp = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    if(!resp.ok) return;
    const rows = await resp.json();
    if(!Array.isArray(rows) || !rows.length) return;
    const articles = rows.map(r => r.editorial_articles).filter(Boolean);
    if(!articles.length) return;
    articles.sort((a, b) => (b.published_at || '').localeCompare(a.published_at || ''));
    const article = articles[0];
    if(!safeUrl(article.url)) return;
    const el = document.getElementById('evtEditorial');
    el.href = safeUrl(article.url);
    el.innerHTML = `<span class="ei-tag">As seen in</span><span class="ei-title">${escapeHtml(decodeEntities(article.title))}</span>${article.source?`<span class="ei-src">— ${escapeHtml(article.source)}</span>`:''}`;
    el.style.display = 'flex';
    // 2026-09-05 (Jody: "I want all articles about an event accessible from
    // the dedicated event page") — every additional article past the first
    // is now a real link, not just a hover-tooltip count (see the CSS
    // comment above for why that changed). Same safeUrl() gate as the
    // primary link above — an article whose url fails that check is simply
    // skipped rather than rendered unclickable-but-visible.
    const others = articles.slice(1).filter(a => safeUrl(a.url));
    if(others.length){
      const alsoEl = document.getElementById('evtEditorialAlso');
      const links = others.map(a => `<a href="${safeUrl(a.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(decodeEntities(a.title))}${a.source?` <span class="ei-more-src">— ${escapeHtml(a.source)}</span>`:''}</a>`).join('');
      alsoEl.innerHTML = `<span class="ei-more-label">Also covered by</span>${links}`;
      alsoEl.style.display = 'block';
    }
  } catch (err) {
    // Silent by design, same convention as index.html's own editorial fetch.
  }
}

// Generated the first time it's opened, not on page load — see the CSS
// comment above for why loading it eagerly for every visitor isn't worth it.
function toggleQrCode(){
  const box = document.getElementById('evtQrBox');
  const btn = document.getElementById('evtQrToggleBtn');
  const opening = box.style.display === 'none';
  if(opening){
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(window.location.href)}`;
    document.getElementById('evtQrImage').src = qrUrl;
    document.getElementById('evtQrOpenLink').href = qrUrl;
    box.style.display = 'block';
    btn.textContent = 'Hide QR code';
  } else {
    box.style.display = 'none';
    btn.textContent = 'Get QR code';
  }
}

let currentEvent = null;

async function init(){
  const id = new URLSearchParams(window.location.search).get('id');
  if(!id){
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
    return;
  }
  try {
    const url = `${SUPABASE_URL}/rest/v1/events?id=eq.${encodeURIComponent(id)}&status=eq.approved&select=id,title,description,image_url,start_date,end_date,venue_name_raw,venue_address_raw,venue_city_raw,venue_id,venues(name,address,city,lat,lng),category,time_display,is_free,source,note,ticket_url,event_url,price_from,ticket_status,is_clothing_optional`;
    const resp = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    if(!resp.ok) throw new Error('fetch failed');
    const rows = await resp.json();
    if(!Array.isArray(rows) || !rows.length) throw new Error('not found');
    currentEvent = mapRow(rows[0]);
    renderEvent(currentEvent);
    loadEditorialLink(currentEvent.id);
  } catch (err) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
  }
}
init();
</script>
