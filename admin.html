<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — 313.events</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="shortcut icon" href="/assets/icons/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --panel:#202020; --panel-alt:#161616; --panel-hover:#272727;
    --ink:#F2F0E8; --ink-soft:#A9AAA3; --ink-dim:#5c5d58;
    --line:#2c2c2c; --line-soft:#212121;
    --accent:#D7FF00; --on-accent:#0A0A0A;
    --ok:#3fbf6a; --ok-ink:#06210f; --bad:#e07a72; --bad-ink:#3a1f1f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--panel-alt);color:var(--ink);padding:18px 24px;border-bottom:2px solid var(--line);}
  header h1{margin:0;font-size:18px;font-family:'Archivo Narrow',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;}
  header .sub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  main{max-width:960px;margin:0 auto;padding:24px;}
  .gate{max-width:420px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center;}
  .gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin:14px 0;background:var(--panel-alt);color:var(--ink);}
  .gate button, .card button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;}
  .gate button{background:var(--ink);color:var(--bg);width:100%;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .card h3{margin:0 0 4px;font-size:16px;}
  .meta{color:var(--ink-soft);font-size:13px;line-height:1.6;margin:8px 0;}
  .meta b{color:var(--ink);}
  .meta a{color:var(--accent);}
  .actions{display:flex;gap:8px;margin-top:12px;}
  .btn-approve{background:var(--ok);color:var(--ok-ink);}
  .btn-reject{background:var(--bad);color:var(--bad-ink);}
  .empty{color:var(--ink-soft);text-align:center;padding:60px 0;}
  .err{color:var(--bad);font-size:13.5px;margin-top:8px;}
  .refresh{margin-bottom:16px;}
  .refresh button{background:var(--panel-alt);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>313 Events — Admin</h1>
  <div class="sub">Moderation queue for venue/organizer submissions</div>
</header>

<main>
  <div id="gate" class="gate">
    <div style="font-weight:600;margin-bottom:4px;">Admin access</div>
    <div style="color:var(--ink-soft);font-size:13.5px;">Enter the admin secret configured in Vercel (ADMIN_SECRET).</div>
    <input type="password" id="secretInput" placeholder="Admin secret">
    <button onclick="unlock()">Enter</button>
    <div class="err" id="gateErr" style="display:none;"></div>
  </div>

  <div id="queue" style="display:none;">
    <div class="refresh"><button onclick="loadQueue()">↻ Refresh</button></div>
    <div id="list"></div>
  </div>
</main>

<script>
let SECRET = "";

function unlock() {
  SECRET = document.getElementById('secretInput').value.trim();
  if (!SECRET) return;
  loadQueue();
}

async function loadQueue() {
  const gateErr = document.getElementById('gateErr');
  gateErr.style.display = 'none';
  try {
    const resp = await fetch('/api/admin-events', { headers: { 'x-admin-secret': SECRET } });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed to load queue');

    document.getElementById('gate').style.display = 'none';
    document.getElementById('queue').style.display = 'block';
    renderList(data.events || []);
  } catch (err) {
    gateErr.textContent = err.message;
    gateErr.style.display = 'block';
  }
}

function renderList(events) {
  const list = document.getElementById('list');
  if (!events.length) {
    list.innerHTML = '<div class="empty">No pending submissions. 🎉</div>';
    return;
  }
  list.innerHTML = events.map(e => `
    <div class="card" id="card-${e.id}">
      <h3>${escapeHtml(e.title)}</h3>
      <div class="meta">
        <b>${escapeHtml(e.category)}</b> · ${escapeHtml(e.start_date)}${e.time_display ? ' · ' + escapeHtml(e.time_display) : ''}<br>
        Venue: <b>${escapeHtml(e.venue_name_raw || 'TBA')}</b><br>
        ${e.is_free ? 'Free' : (e.price_from ? 'From $' + e.price_from : 'Paid')}
        ${e.ticket_url ? ' · <a href="' + escapeHtml(e.ticket_url) + '" target="_blank" rel="noopener">tickets</a>' : ''}<br>
        Submitted by: <b>${escapeHtml(e.submitter_org_name || '—')}</b> (${escapeHtml(e.submitter_email || '—')})
        ${e.description ? '<br><br>' + escapeHtml(e.description) : ''}
      </div>
      <div class="actions">
        <button class="btn-approve" onclick="review('${e.id}','approve')">Approve</button>
        <button class="btn-reject" onclick="review('${e.id}','reject')">Reject</button>
      </div>
    </div>
  `).join('');
}

async function review(id, action) {
  const card = document.getElementById('card-' + id);
  card.style.opacity = '0.5';
  try {
    const resp = await fetch('/api/admin-events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': SECRET },
      body: JSON.stringify({ id, action }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Action failed');
    card.remove();
  } catch (err) {
    card.style.opacity = '1';
    alert(err.message);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>

</body>
</html>
