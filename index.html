// ---- Mobile WHEN/WHERE/FILTER sheets (Phase 1 Chunk 4) ----
// Below 720px, the discovery bar / location bar / filter bar collapse into
// three trigger buttons, each opening the SAME underlying bar (same IDs,
// same JS, same state) as a fixed bottom sheet rather than a squeezed row.
// Above 720px this whole block is inert — the triggers are display:none via
// CSS, so openSheet()/closeSheet() are simply never called.
let openSheetName = null; // 'when' | 'where' | 'filter' | null
const SHEETS = {
  when:   {barId: 'discoveryBar', triggerId: 'whenTriggerBtn'},
  where:  {barId: 'locationBar',  triggerId: 'whereTriggerBtn'},
  filter: {barId: 'filterBar',    triggerId: 'filterTriggerBtn'},
};

// Below 720px the bar opens as a fixed bottom sheet with a dimming backdrop
// and the page locked from scrolling behind it. At 720px and up the same
// bar instead expands inline right under the trigger row (see .sheet-active
// in the non-mobile branch of the CSS) — there's no overlay to dim and
// nothing behind it needs to stop scrolling, so those two behaviors are
// gated on viewport width rather than applied unconditionally.
function isMobileViewport(){
  return window.matchMedia('(max-width:720px)').matches;
}

function openSheet(name){
  if(openSheetName === name){ closeSheet(); return; }
  Object.entries(SHEETS).forEach(([key, {barId, triggerId}])=>{
    const active = key === name;
    document.getElementById(barId).classList.toggle('sheet-active', active);
    document.getElementById(triggerId).setAttribute('aria-expanded', String(active));
  });
  if(isMobileViewport()){
    document.getElementById('sheetBackdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  openSheetName = name;
  // Move focus into the sheet for keyboard/screen-reader users rather than
  // leaving it stranded on a now-background trigger button.
  const bar = document.getElementById(SHEETS[name].barId);
  const focusable = bar.querySelector('button, input, [tabindex]');
  if(focusable) focusable.focus();
}

function closeSheet(){
  if(!openSheetName) return;
  const prevName = openSheetName;
  Object.values(SHEETS).forEach(({barId, triggerId})=>{
    document.getElementById(barId).classList.remove('sheet-active');
    document.getElementById(triggerId).setAttribute('aria-expanded', 'false');
  });
  document.getElementById('sheetBackdrop').classList.remove('show');
  document.body.style.overflow = '';
  openSheetName = null;
  const trigger = document.getElementById(SHEETS[prevName].triggerId);
  if(trigger) trigger.focus();
}

document.getElementById('whenTriggerBtn').onclick = ()=> openSheet('when');
document.getElementById('whereTriggerBtn').onclick = ()=> openSheet('where');
document.getElementById('filterTriggerBtn').onclick = ()=> openSheet('filter');
document.getElementById('sheetBackdrop').onclick = closeSheet;
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && openSheetName) closeSheet(); });
// Delegated — #filterBar's sheet-close button is rebuilt fresh on every
// buildFilterBar() call, so a directly-bound listener would go stale.
document.addEventListener('click', (e)=>{
  if(e.target.closest && e.target.closest('.sheet-close')) closeSheet();
});
// Desktop/tablet only: clicking anywhere outside the discovery-shell (the
// trigger row + whichever bar is open) closes the open panel, same job the
// backdrop does on mobile. Below 720px this is a no-op — the backdrop
// already owns outside-click there, and the shell's own click (e.g.
// switching to a different trigger) is handled by openSheet() itself.
document.addEventListener('click', (e)=>{
  if(!openSheetName || isMobileViewport()) return;
  const shell = document.getElementById('discoveryShell');
  if(shell && !shell.contains(e.target)) closeSheet();
});
// #search now lives inside #discoveryShell (moved 2026-08-27, end of the
// When/Where/Category trigger row), so the outside-click handler above no
// longer catches a click into it. Focusing search still closes whichever
// sheet was open, same as before the move — typing a query and an open
// When/Where/Category panel shouldn't sit on screen at the same time.
document.getElementById('search').addEventListener('focus', ()=>{

// Guards against a stuck-open sheet if the window is resized/rotated across
// the 720px breakpoint while one is open (e.g. a tablet rotation) — the
// mobile fixed-sheet and desktop inline-panel styles aren't meant to mix.
let _wasMobileViewport = isMobileViewport();
window.addEventListener('resize', ()=>{
  const nowMobile = isMobileViewport();
  if(nowMobile !== _wasMobileViewport && openSheetName) closeSheet();
  _wasMobileViewport = nowMobile;
});

// Keeps each trigger's subtitle in sync with actual filter state, so
// collapsing WHEN/WHERE/FILTER into three buttons never hides what's
// currently active from someone who hasn't opened a sheet.
function updateMobileTriggers(){

// ---- URL state ----
// Reflects date/view/categories/search/when in the URL so a state can be
// bookmarked, shared, or reloaded — per the brief's "filter state + URLs"
// requirement. Uses replaceState (not pushState) on every change so normal
// browsing doesn't spam browser history with one entry per keystroke/click;
// the URL still updates live and reloading/sharing it reproduces the view.
function syncURL(){
  const params = new URLSearchParams();
  // Always today — the homepage's default view no longer has a separately
  // browsable "current month" to encode (month paging was removed
  // 2026-08-27), so there's nothing else meaningful to put here.
  params.set('date', getTodayISO());
  if(whenMode) params.set('when', whenMode);
  if(whenMode === 'date' && pickedDate) params.set('picked', pickedDate);
  if(whenMode === 'range' && rangeStart && rangeEnd){
    params.set('rangeStart', rangeStart);
    params.set('rangeEnd', rangeEnd);
  }
  if(activeCats.size < Object.keys(CATS).length) params.set('cats', Array.from(activeCats).join(','));
  if(freeOnly) params.set('free', '1');
  if(activeFeatures.size) params.set('features', Array.from(activeFeatures).join(','));
  if(query) params.set('q', query);
  // A geolocation-derived origin (type:'here') has no stable name to
  // round-trip through a URL — omitted rather than encoding raw coordinates,
  // which would put the visitor's location in a shareable link.
  if(originLocation && originLocation.type !== 'here'){
    params.set('loc', originLocation.name);
    if(radiusMiles !== null) params.set('radius', String(radiusMiles));
  }
  if(neighborhoodFilter) params.set('neighborhood', neighborhoodFilter);
  const qs = params.toString();
  // Wrapped defensively: history.replaceState throws a SecurityError in a
  // sandboxed about:srcdoc context (e.g. an embedded preview iframe, which
  // has no real address of its own to rewrite) — URL bookmarking is a
  // nice-to-have, so a failure here should never break the rest of render().
  try {
    history.replaceState(null, '', qs ? `${location.pathname}?${qs}` : location.pathname);
  } catch (err) {
    // Silently skip — nothing else depends on this succeeding.
  }
}

// Reads the above back out on initial load, so a shared/bookmarked link
// reproduces the same view. Applied once, before the first render() — every
// later interaction just goes through the normal state variables + syncURL().
function readStateFromURL(){
  const params = new URLSearchParams(location.search);

  const catsParam = params.get('cats');
  if(catsParam !== null){
    // An empty/invalid list intentionally means "show nothing" — matching
    // whatever state was actually shared, rather than silently falling back
    // to "show everything" and misrepresenting the link.
    activeCats = new Set(catsParam.split(',').filter(k=>CATS[k]));
  }

  if(params.get('free') === '1') freeOnly = true;

  const featuresParam = params.get('features');
  if(featuresParam){
    const validKeys = new Set(FEATURE_CHIPS.map(f=>f.key));
    activeFeatures = new Set(featuresParam.split(',').filter(k=>validKeys.has(k)));
  }

  const qParam = params.get('q');
  if(qParam){ query = qParam; document.getElementById('search').value = qParam; }

  // Note: an old bookmarked link with ?view=month has nothing to restore to
  // anymore — the homepage is List-only now, so that param is simply ignored.
  // Same (2026-08-27) for ?when=now / ?when=today — both shortcuts were
  // removed as redundant once the default view already opens on today, so
  // an old link using either is just ignored. ?when=tonight, briefly in the
  // same "ignored" category after Tonight was removed 2026-08-27, is back
  // to being a real, restorable value again as of 2026-08-28 (Tonight was
  // restored — see WHEN_LABELS above) — same for the new ?when=all.
  const whenParam = params.get('when');
  if(whenParam === 'date'){
    const pickedParam = params.get('picked');
    if(pickedParam && /^\d{4}-\d{2}-\d{2}$/.test(pickedParam) && pickedParam >= getTodayISO()){
      whenMode = 'date';
      pickedDate = pickedParam;
      document.getElementById('whenDateInput').value = pickedParam;
    }
  } else if(whenParam === 'range'){
    const rs = params.get('rangeStart'), re = params.get('rangeEnd');
    if(rs && re && /^\d{4}-\d{2}-\d{2}$/.test(rs) && /^\d{4}-\d{2}-\d{2}$/.test(re) && rs <= re && rs >= getTodayISO()){
      whenMode = 'range';
      rangeStart = rs;
      rangeEnd = re;
      document.getElementById('whenDateInput').value = rs;
      document.getElementById('whenDateEndInput').value = re;
    }
  } else if(whenParam && ['tomorrow','tonight','weekend','thisweek','all'].includes(whenParam)){
    whenMode = whenParam;
    if(whenParam === 'weekend'){
      cachedWeekendDates = getWeekendDates();
    }
  }

  // A shared link only restores a NAMED location (a real match in
  // LOCATIONS) — a one-off geolocation origin was never put in the URL to
  // begin with (see syncURL), so there's nothing to restore for those.
  const locParam = params.get('loc');
  if(locParam){
    const found = LOCATIONS.find(l => l.name.toLowerCase() === locParam.toLowerCase());
    if(found){
      originLocation = found;
      const radiusParam = params.get('radius');
      if(radiusParam === 'all') radiusMiles = 'all';
      else {
        const n = parseInt(radiusParam, 10);
        radiusMiles = (!isNaN(n) && [5,10,25,50].includes(n)) ? n : 'all';
      }
    }
  }
  updateLocationControlUI();

  // Restored the same way as `loc` above — a real, human-readable name in
  // the URL, resolved against live data once it loads rather than trusted
  // blindly (an old link naming a neighborhood that's since been renamed —
  // see the Fitzgerald/Rivertown renames — just won't match anything and
  // quietly falls back to unfiltered, same failure mode as `cats`/`loc`).
  const neighborhoodParam = params.get('neighborhood');
  if(neighborhoodParam) neighborhoodFilter = neighborhoodParam;
}

readStateFromURL();
buildFilterBar();
render();

// ---- Live database (Supabase) ----
// This is the real, always-current data source: hand-curated events, venue
// submissions once approved by an admin, and Ticketmaster events written by
// the Vercel Cron job (see api/cron-ticketmaster.js) all live in one
// `events` table with status='approved'. The anon key below is meant to be
// public — Row Level Security (see supabase/schema.sql) restricts it to
// read-only access on approved rows only, nothing else.
//
// Fill these in once you've created your Supabase project (Project Settings
// → API). Left blank, the calendar just keeps running on FALLBACK_EVENTS.
const SUPABASE_URL = "https://afvyfjfqukptnfmgshzn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NQgem2pH8h_ynP8ikwdmFw_5aoN34Q5"; // publishable key — safe for client code, read-only via RLS

// Decodes HTML entities (e.g. a raw "&#038;" left over from a WordPress-
// sourced scraper) into their real characters, so text displays correctly
// instead of showing literal entity codes. Safe from XSS: a <textarea>'s
// content is always parsed as plain text and never executed, no matter what
// it contains — this only ever decodes characters, it doesn't introduce
// markup. Applied here (before escapeHtml() at render time) as a
// defense-in-depth cleanup covering any source, not just the specific crons
// that have since been fixed to decode entities before they're stored.
function decodeEntities(str){
  if(!str) return str;
  const ta = document.createElement('textarea');
  ta.innerHTML = str;
  return ta.value;
}

// venue name (trimmed, lowercased) -> neighborhood name. Populated once by
// loadNeighborhoodData() before events are mapped, so mapSupabaseRow() can
// resolve each event's neighborhood the same way Jody's own review
// spreadsheet did — via the venues table's neighborhood_id, not a guess.
// Events whose venue never got a neighborhood assignment (still the
// majority — see the venues/neighborhoods review, 2026-08-27) simply get
// neighborhood: null and drop out of the Explore Neighborhoods rail, rather
// than being force-assigned to something nobody confirmed.
const VENUE_NEIGHBORHOOD_MAP = new Map();

async function loadNeighborhoodData() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try {
    const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
    const [venuesResp, neighResp] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/venues?select=name,neighborhood_id&neighborhood_id=not.is.null&limit=1000`, { headers }),
      fetch(`${SUPABASE_URL}/rest/v1/neighborhoods?select=id,name&limit=200`, { headers }),
    ]);
    if (!venuesResp.ok || !neighResp.ok) return;
    const venues = await venuesResp.json();
    const neighborhoods = await neighResp.json();
    const idToName = new Map(neighborhoods.map(n => [n.id, n.name]));
    venues.forEach(v => {
      const nName = idToName.get(v.neighborhood_id);
      if (nName && v.name) VENUE_NEIGHBORHOOD_MAP.set(v.name.trim().toLowerCase(), nName);
    });
  } catch (err) {
    // Silent by design — the rail just stays hidden without this data.
  }
}

function mapSupabaseRow(row) {
  const venueKey = (row.venue_name_raw || "").trim().toLowerCase();
  return {
    id: row.id, // 2026-08-27: needed to join editorial_articles.matched_event_id (see loadEditorialArticles()) — nothing on the client referenced an event's own DB identity before this, only field values.
    date: row.start_date,
    // end_date (2026-09-02 audit fix): submit.html/api/submit.js have
    // accepted and stored this since day one, but no page ever selected it
    // back out, so a multi-day event (a festival, an exhibit "running
    // through" a date) only ever appeared on its first day and vanished
    // from every later day's list even while it was still happening — and
    // nothing distinguished it as multi-day even on that first day. Falls
    // back to start_date (i.e. "just one day") when unset, so every other
    // reference to endDate below can skip a null check.
    endDate: row.end_date || row.start_date,
    title: decodeEntities(row.title),
    // 2026-08-28 (Jody: "i just submit an event and the description is
    // nowhere to be seen"): description/image_url were always accepted by
    // submit.html/api/submit.js and stored in the database — they just
    // never made it into the client's event objects, so nothing on the
    // page could ever have shown them. See event.html for the full
    // description + image; the list view below only gets a short excerpt.
    description: row.description ? decodeEntities(row.description) : undefined,
    imageUrl: row.image_url || undefined,
    venue: decodeEntities(row.venue_name_raw) || "Venue TBA",
    // Suppress "Detroit" specifically — it's the implicit default everywhere
    // else on the site, so showing it on every card would just be noise.
    // Any other city (Rochester Hills, Sterling Heights, Windsor ON, etc.)
    // shows, since that's exactly the info that was silently missing before.
    city: (row.venue_city_raw && row.venue_city_raw.toLowerCase() !== "detroit") ? decodeEntities(row.venue_city_raw) : undefined,
    cat: row.category,
    time: row.time_display || "",
    free: !!row.is_free,
    source: row.source || "Manual",
    note: row.note ? decodeEntities(row.note) : undefined,
    ticketUrl: row.ticket_url || undefined,
    priceFrom: row.price_from ?? undefined,
    neighborhood: VENUE_NEIGHBORHOOD_MAP.get(venueKey) || null,
  };
}

// A small back-buffer (not just "today") so the View Calendar week strip
// always has data for the whole Mon-Sun week even when today is, say,
// Saturday — it needs Monday's count too. 8 days covers any day-of-week /
// timezone edge case with a day to spare.
function loadFloorISO(){
  const d = new Date(getTodayISO()+"T12:00:00");
  d.setDate(d.getDate()-8);
  return toISO(d.getFullYear(), d.getMonth(), d.getDate());
}

async function loadSupabaseEvents() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return; // not configured yet — stay on fallback data
  try {
    await loadNeighborhoodData(); // must resolve before mapSupabaseRow() runs below
    // start_date=gte floor added 2026-08-27: PostgREST defaults to capping a
    // response at 1000 rows when no `limit=` is set, and this query had
    // neither a limit nor a date floor — so once total approved rows
    // (including ones from long-past events that were never pruned) passed
    // 1000, this `order=start_date.asc` query would silently fill its entire
    // 1000-row budget with the OLDEST rows first, at risk of pushing
    // today/upcoming events out of the loaded set entirely. No page of this
    // site ever needs anything older than "the Monday of the current week"
    // (see loadFloorISO() above), so flooring the query there spends the
    // row budget on relevant dates instead of unbounded history.
    // Explicit limit= (2026-09-02 audit fix): without one, PostgREST silently
    // applies its own default row cap, and this query — same risk this
    // file's own comment above already flags for the date floor — could get
    // silently truncated as the table grows past that cap with no error and
    // no visible sign anything was cut off. 2000 matches map.html's query.
    const url = `${SUPABASE_URL}/rest/v1/events?status=eq.approved&start_date=gte.${loadFloorISO()}&select=id,title,description,image_url,start_date,end_date,venue_name_raw,venue_city_raw,category,time_display,is_free,source,note,ticket_url,price_from&order=start_date.asc&limit=2000`;
    const resp = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!resp.ok) return; // fails silently — fallback data stays on screen
    const rows = await resp.json();
    if (!Array.isArray(rows) || !rows.length) return;

    EVENTS = rows.map(mapSupabaseRow);
    byDate = {};
    EVENTS.forEach(e => { addToByDate(byDate, e); });
    Object.values(byDate).forEach(list => list.sort((a,b) => timeSortMinutes(a.time) - timeSortMinutes(b.time)));

    buildFilterBar();
    render();
    renderNeighborhoodsRail();
  } catch (err) {
    // Silent by design — FALLBACK_EVENTS keeps the calendar usable regardless.
  }
}
loadSupabaseEvents();

// Dedicated exact count for the Detroit Orbit widget's "events loaded"
// teaser (Jody, 2026-08-27: "the total number of current and upcoming
// events... communicates the value of this site to users, partners, and
// advertisers"). Deliberately NOT EVENTS.length — that array is capped by
// whatever the main list query's row budget is (see loadFloorISO() above),
// so it's the wrong source for a number meant to represent the site's real
// scale. This instead asks Postgres for its own exact row count via
// `Prefer: count=exact`, reading the total straight off the response's
// Content-Range header (e.g. "0-0/1423") — `Range: 0-0` keeps the actual
// transferred payload to a single row's worth of data, so getting an
// accurate count doesn't mean downloading 1000+ rows twice.
async function loadOrbitEventTotal(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try {
    const url = `${SUPABASE_URL}/rest/v1/events?status=eq.approved&start_date=gte.${getTodayISO()}&select=id`;
    const resp = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        Prefer: 'count=exact',
        Range: '0-0',
      },
    });
    if (!resp.ok) return;
    const contentRange = resp.headers.get('content-range'); // "0-0/1423"
    if (!contentRange) return;
    const total = parseInt(contentRange.split('/')[1], 10);
    if (isNaN(total)) return;
    orbitEventTotal = total;
    renderNearYouCard();
  } catch (err) {
    // Silent by design — renderNearYouCard()'s own EVENTS-based fallback
    // count stays on screen if this dedicated request fails.
  }
}
loadOrbitEventTotal();

// "As seen in" inline press links (2026-08-27, Jody: associate editorial
// coverage with the specific event it's about). All the actual work —
// pulling RSS from local outlets, and matching an article to an event by
// venue/title text — happens server-side in api/cron-editorial.js on a
// schedule; this just reads the already-matched results. Only rows that
// already have a matched_event_id are requested (see the RLS policy in
// migration_011_editorial_articles.sql), and only title/url/source ever
// leave the server — never full article text — so every "As seen in" link
// drives the click back to the original outlet instead of reproducing its
// work. Keyed by event.id (see mapSupabaseRow()'s new id field) rather than
// by title/venue text, so a coincidental title match elsewhere on the site
// can't accidentally borrow another event's press mention.
// (editorialByEvent itself is declared up near `let EVENTS` — see the
// comment there for why it can't live down here.)
async function loadEditorialArticles(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try {
    // thumbnail_url/published_at added 2026-08-28 for the "On the Radar"
    // sidebar widget (see renderOnRadarCard()) — title/url/source alone,
    // already selected here for the inline "As seen in" links, weren't
    // enough to build that widget's thumbnail + freshness-ordering without
    // a second request, so it rides along on this same one instead.
    const url = `${SUPABASE_URL}/rest/v1/editorial_articles?matched_event_id=not.is.null&select=title,url,source,matched_event_id,thumbnail_url,published_at&order=published_at.desc`;
    const resp = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!resp.ok) return;
    const rows = await resp.json();
    if (!Array.isArray(rows)) return;
    const byEvent = {};
    rows.forEach(r=>{
      // order=published_at.desc means the first row seen per event id is
      // its most recent coverage — a second, older mention of the same
      // event is intentionally dropped rather than shown as a second link.
      if(!byEvent[r.matched_event_id]){
        byEvent[r.matched_event_id] = {
          title: decodeEntities(r.title), url: r.url, source: r.source,
          thumbnailUrl: r.thumbnail_url || null, publishedAt: r.published_at || null,
        };
      }
    });
    editorialByEvent = byEvent;
    render();
  } catch (err) {
    // Silent by design, same convention as loadOrbitEventTotal() — a failed
    // fetch here just means no "As seen in" links show up, never breaks the
    // rest of the list.
  }
}
loadEditorialArticles();

// "On the Radar" sidebar widget (2026-08-28, Jody: "percolate to the user
// events that the press has covered... how can we make this add value to
// the user better?"). Built from the same editorialByEvent data the inline
// "As seen in" links already loaded — no extra request — but this is a
// dedicated discovery surface, not just a per-event footnote:
//   - Upcoming events ONLY. A press mention for an event that already
//     happened isn't a "go do this" signal to anyone browsing the sidebar —
//     it'd just be dead weight next to View Calendar/Orbit/Free Today,
//     which are all forward-looking.
//   - Freshest coverage first (publishedAt desc) — reads as a live pulse of
//     what the local press is covering RIGHT NOW, not a static archive.
//   - Capped at ON_RADAR_LIMIT so it stays a curated highlight reel, not a
//     dumping ground that pushes the other three cards below the fold.
//   - Links straight to this site's own event.html, not out to the article
//     (the inline "As seen in" link on that same page covers "read the
//     actual piece") — the point of THIS widget is surfacing which events
//     to go to, using press coverage as the trust signal that got them
//     noticed, same framing as e.g. Eater's "as seen on" tags.
//   - Hides the whole card rather than rendering an empty list when
//     nothing qualifies yet (a quiet week for press pickup shouldn't leave
//     an awkward blank box in the sidebar) — same convention already used
//     by renderNeighborhoodsRail().
// (ON_RADAR_LIMIT itself is declared up near `let EVENTS` — see the comment
// there for why it can't live down here.)
function renderOnRadarCard(){
  const el = document.getElementById('onRadarCard');
  if(!el) return;
  const todayIso = getTodayISO();

  const candidates = Object.keys(editorialByEvent)
    .map(eventId => {
      const event = EVENTS.find(e => String(e.id) === String(eventId));
      return event ? { event, article: editorialByEvent[eventId] } : null;
    })
    .filter(c => c && c.event.date >= todayIso && !isBlockedEvent(c.event))
    .sort((a, b) => (b.article.publishedAt || '').localeCompare(a.article.publishedAt || ''))
    .slice(0, ON_RADAR_LIMIT);

  if(!candidates.length){
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = '';

  el.innerHTML = `
    <div class="side-card-head"><h2>On the Radar</h2><a class="side-card-link" href="radar.html">See all &rarr;</a></div>
    <p class="side-card-sub">Upcoming events the local press is already covering.</p>
    <div class="radar-list">
      ${candidates.map(({event, article}) => {
        const dateLabel = new Date(event.date+"T12:00:00").toLocaleDateString('en-US',{month:'short', day:'numeric'});
        const metaBits = [dateLabel, event.venue].filter(Boolean).join(' · ');
        const thumbHtml = article.thumbnailUrl && safeUrl(article.thumbnailUrl)
          ? `<img class="radar-thumb" src="${escapeHtml(safeUrl(article.thumbnailUrl))}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;radar-thumb radar-thumb-fallback&quot;>${escapeHtml((article.source||'?').charAt(0))}</div>';">`
          : `<div class="radar-thumb radar-thumb-fallback">${escapeHtml((article.source||'?').charAt(0))}</div>`;
        const href = eventUrl(event);
        const body = `
          ${thumbHtml}
          <div class="radar-item-body">
            <div class="radar-item-title">${escapeHtml(event.title)}</div>
            <div class="radar-item-meta">${escapeHtml(metaBits)}</div>
            <div class="radar-item-src">${escapeHtml(article.source || 'Local press')}</div>
          </div>
        `;
        return href
          ? `<a class="radar-item" href="${escapeHtml(href)}">${body}</a>`
          : `<div class="radar-item">${body}</div>`;
      }).join('')}
    </div>
  `;
}
</script>
</body>
</html>
