// ---- Location + radius (Phase 1 Chunk 3) ----

function updateRadiusButtons(){
  document.querySelectorAll('.radius-chip').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.radius === String(radiusMiles));
  });
}

// Keeps the location combobox's visible state (input text, clear button,
// radius group visibility) in sync with originLocation — needed both after
// a manual selection and after restoring state from the URL on load.
function updateLocationControlUI(){
  const input = document.getElementById('locInput');
  const clearBtn = document.getElementById('locClearBtn');
  const radiusGroup = document.getElementById('radiusGroup');
  if(originLocation){
    input.value = originLocation.name;
    clearBtn.style.display = 'flex';
    radiusGroup.style.display = 'flex';
  } else {
    clearBtn.style.display = 'none';
    radiusGroup.style.display = 'none';
  }
  updateRadiusButtons();
}

// Tracks which suggestion (if any) is currently arrow-key-highlighted —
// part of the Chunk 4 accessibility pass so this combobox is fully
// keyboard-operable, not just clickable.
let locHighlightIndex = -1;

function renderLocationSuggestions(q){
  const box = document.getElementById('locSuggestions');
  const input = document.getElementById('locInput');
  box.innerHTML = '';
  locHighlightIndex = -1;
  input.removeAttribute('aria-activedescendant');
  if(!q || !q.trim()){
    box.style.display = 'none';
    input.setAttribute('aria-expanded', 'false');
    return;
  }
  const ql = q.trim().toLowerCase();
  const matches = LOCATIONS.filter(l => l.name.toLowerCase().includes(ql)).slice(0, 8);
  if(!matches.length){
    box.innerHTML = `<div class="loc-empty">No matches in the service area</div>`;
  } else {
    matches.forEach((loc, i)=>{
      const item = document.createElement('div');
      item.className = 'loc-item';
      item.id = `locItem${i}`;
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', 'false');
      item.tabIndex = -1;
      const nameEl = document.createElement('span');
      nameEl.className = 'loc-item-name';
      nameEl.textContent = loc.name;
      const typeEl = document.createElement('span');
      typeEl.className = 'loc-item-type';
      typeEl.textContent = `${loc.type.toUpperCase()} · ${loc.region.toUpperCase()}`;
      item.appendChild(nameEl);
      item.appendChild(typeEl);
      item.onclick = ()=> selectLocation(loc);
      item.onmouseenter = ()=> setLocHighlight(i);
      box.appendChild(item);
    });
  }
  box.style.display = 'block';
  input.setAttribute('aria-expanded', 'true');
}

// Moves the arrow-key highlight to suggestion index i (or clears it for -1),
// keeping the visible .hl style, aria-selected, and aria-activedescendant
// all in sync with each other.
function setLocHighlight(i){
  const items = document.querySelectorAll('#locSuggestions .loc-item');
  const input = document.getElementById('locInput');
  items.forEach(el => { el.classList.remove('hl'); el.setAttribute('aria-selected', 'false'); });
  if(i >= 0 && i < items.length){
    items[i].classList.add('hl');
    items[i].setAttribute('aria-selected', 'true');
    items[i].scrollIntoView({block: 'nearest'});
    input.setAttribute('aria-activedescendant', items[i].id);
    locHighlightIndex = i;
  } else {
    input.removeAttribute('aria-activedescendant');
    locHighlightIndex = -1;
  }
}

// Sets the active search-radius origin, defaulting radius to 'all' (visible,
// non-narrowing) so choosing a location alone never silently hides events —
// the user has to deliberately pick a mile ring to actually narrow anything.
function selectLocation(loc){
  originLocation = loc;
  if(radiusMiles === null) radiusMiles = 'all';
  document.getElementById('locSuggestions').style.display = 'none';
  document.getElementById('locSuggestions').innerHTML = '';
  updateLocationControlUI();
  render();
}

// opts.skipRender lets clearAllFilters() reset location state without
// triggering a second render() right before its own render() call.
function clearLocation(opts){
  originLocation = null;
  radiusMiles = null;
  document.getElementById('locInput').value = '';
  document.getElementById('locSuggestions').style.display = 'none';
  updateLocationControlUI();
  if(!(opts && opts.skipRender)) render();
}

function expandRadius(){
  const steps = [5, 10, 25, 50, 'all'];
  const idx = steps.indexOf(radiusMiles);
  radiusMiles = steps[idx === -1 ? steps.length - 1 : Math.min(idx + 1, steps.length - 1)];
  updateRadiusButtons();
  render();
}

// Requests the browser's geolocation only on this explicit click — never on
// page load — per the brief's requirement to ask before using device
// location. Fails soft on denial/timeout: the text search box stays usable
// either way, nothing else on the page depends on this succeeding.
function useMyLocation(){
  const btn = document.getElementById('useMyLocationBtn');
  const original = btn.textContent;
  if(!navigator.geolocation){
    btn.textContent = 'Not supported';
    setTimeout(()=>{ btn.textContent = original; }, 2500);
    return;
  }
  btn.textContent = 'Locating…';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      selectLocation({name: 'Your location', type: 'here', region: '', lat: pos.coords.latitude, lng: pos.coords.longitude});
      btn.textContent = original;
      btn.disabled = false;
    },
    ()=>{
      btn.textContent = 'Location unavailable';
      btn.disabled = false;
      setTimeout(()=>{ btn.textContent = original; }, 2500);
    },
    {timeout: 8000}
  );
}

const locInputEl = document.getElementById('locInput');
locInputEl.addEventListener('input', (e)=> renderLocationSuggestions(e.target.value));
locInputEl.addEventListener('focus', (e)=>{ if(e.target.value) renderLocationSuggestions(e.target.value); });
locInputEl.addEventListener('keydown', (e)=>{
  const items = document.querySelectorAll('#locSuggestions .loc-item');
  if(e.key === 'Escape'){
    document.getElementById('locSuggestions').style.display = 'none';
  } else if(e.key === 'ArrowDown'){
    if(items.length){ e.preventDefault(); setLocHighlight((locHighlightIndex + 1) % items.length); }
  } else if(e.key === 'ArrowUp'){
    if(items.length){ e.preventDefault(); setLocHighlight((locHighlightIndex - 1 + items.length) % items.length); }
  } else if(e.key === 'Enter'){
    e.preventDefault();
    const target = items[locHighlightIndex] || items[0];
    if(target) target.click();
  }
});
document.addEventListener('click', (e)=>{
  const combo = document.querySelector('.loc-combo');
  if(combo && !combo.contains(e.target)) document.getElementById('locSuggestions').style.display = 'none';
});
document.getElementById('locClearBtn').onclick = ()=> clearLocation();
document.getElementById('useMyLocationBtn').onclick = useMyLocation;
document.querySelectorAll('.radius-chip').forEach(btn=>{
  btn.onclick = ()=>{
    radiusMiles = btn.dataset.radius === 'all' ? 'all' : parseInt(btn.dataset.radius, 10);
    updateRadiusButtons();
    render();
  };
});

// ---- Mobile WHEN/WHERE/FILTER sheets (Phase 1 Chunk 4) ----
// Below 720px, the discovery bar / location bar / filter bar collapse into
// three trigger buttons, each opening the SAME underlying bar (same IDs,
// same JS, same state) as a fixed bottom sheet rather than a squeezed row.
// Above 720px this whole block is inert — the triggers are display:none via
// CSS, so openSheet()/closeSheet() are simply never called.
let openSheetName = null; // 'when' | 'where' | 'filter' | null
const SHEETS = {
  when:   {barId: 'discoveryBar', triggerId: 'whenTriggerBtn'},
  where:  {barId: 'locationBar',  triggerId: 'whereTriggerBtn'},
  filter: {barId: 'filterBar',    triggerId: 'filterTriggerBtn'},
};

// Below 720px the bar opens as a fixed bottom sheet with a dimming backdrop
// and the page locked from scrolling behind it. At 720px and up the same
// bar instead expands inline right under the trigger row (see .sheet-active
// in the non-mobile branch of the CSS) — there's no overlay to dim and
// nothing behind it needs to stop scrolling, so those two behaviors are
// gated on viewport width rather than applied unconditionally.
function isMobileViewport(){
  return window.matchMedia('(max-width:720px)').matches;
}

function openSheet(name){
  if(openSheetName === name){ closeSheet(); return; }
  Object.entries(SHEETS).forEach(([key, {barId, triggerId}])=>{
    const active = key === name;
    document.getElementById(barId).classList.toggle('sheet-active', active);
    document.getElementById(triggerId).setAttribute('aria-expanded', String(active));
  });
  if(isMobileViewport()){
    document.getElementById('sheetBackdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  openSheetName = name;
  // Move focus into the sheet for keyboard/screen-reader users rather than
  // leaving it stranded on a now-background trigger button.
  const bar = document.getElementById(SHEETS[name].barId);
  const focusable = bar.querySelector('button, input, [tabindex]');
  if(focusable) focusable.focus();
}

function closeSheet(){
  if(!openSheetName) return;
  const prevName = openSheetName;
  Object.values(SHEETS).forEach(({barId, triggerId})=>{
    document.getElementById(barId).classList.remove('sheet-active');
    document.getElementById(triggerId).setAttribute('aria-expanded', 'false');
  });
  document.getElementById('sheetBackdrop').classList.remove('show');
  document.body.style.overflow = '';
  openSheetName = null;
  const trigger = document.getElementById(SHEETS[prevName].triggerId);
  if(trigger) trigger.focus();
}

document.getElementById('whenTriggerBtn').onclick = ()=> openSheet('when');
document.getElementById('whereTriggerBtn').onclick = ()=> openSheet('where');
document.getElementById('filterTriggerBtn').onclick = ()=> openSheet('filter');
document.getElementById('sheetBackdrop').onclick = closeSheet;
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && openSheetName) closeSheet(); });
// Delegated — #filterBar's sheet-close button is rebuilt fresh on every
// buildFilterBar() call, so a directly-bound listener would go stale.
document.addEventListener('click', (e)=>{
  if(e.target.closest && e.target.closest('.sheet-close')) closeSheet();
});
// Desktop/tablet only: clicking anywhere outside the discovery-shell (the
// trigger row + whichever bar is open) closes the open panel, same job the
// backdrop does on mobile. Below 720px this is a no-op — the backdrop
// already owns outside-click there, and the shell's own click (e.g.
// switching to a different trigger) is handled by openSheet() itself.
document.addEventListener('click', (e)=>{
  if(!openSheetName || isMobileViewport()) return;
  const shell = document.getElementById('discoveryShell');
  if(shell && !shell.contains(e.target)) closeSheet();
});
// Guards against a stuck-open sheet if the window is resized/rotated across
// the 720px breakpoint while one is open (e.g. a tablet rotation) — the
// mobile fixed-sheet and desktop inline-panel styles aren't meant to mix.
let _wasMobileViewport = isMobileViewport();
window.addEventListener('resize', ()=>{
  const nowMobile = isMobileViewport();
  if(nowMobile !== _wasMobileViewport && openSheetName) closeSheet();
  _wasMobileViewport = nowMobile;
});

// Keeps each trigger's subtitle in sync with actual filter state, so
// collapsing WHEN/WHERE/FILTER into three buttons never hides what's
// currently active from someone who hasn't opened a sheet.
function updateMobileTriggers(){
  const WHEN_LABELS = {now:'Now', today:'Today', tonight:'Tonight', weekend:'This Weekend'};
  const whenSub = document.getElementById('whenTriggerSub');
  whenSub.textContent = (whenMode && WHEN_LABELS[whenMode]) ? WHEN_LABELS[whenMode] : 'Anytime';
  document.getElementById('whenTriggerBtn').classList.toggle('has-value', !!whenMode);

  const whereSub = document.getElementById('whereTriggerSub');
  if(originLocation){
    const radiusLabel = (radiusMiles === 'all' || radiusMiles === null) ? 'Detroit Orbit' : `${radiusMiles} mi`;
    whereSub.textContent = `${radiusLabel} · ${originLocation.name}`;
  } else {
    whereSub.textContent = 'Everywhere';
  }
  document.getElementById('whereTriggerBtn').classList.toggle('has-value', !!originLocation);

  const filterSub = document.getElementById('filterTriggerSub');
  const totalCats = Object.keys(CATS).length;
  const parts = [];
  if(activeCats.size < totalCats) parts.push(`${activeCats.size}/${totalCats} cats`);
  if(freeOnly) parts.push('Free');
  filterSub.textContent = parts.length ? parts.join(' · ') : 'All types';
  document.getElementById('filterTriggerBtn').classList.toggle('has-value', parts.length > 0);
}

// ---- URL state ----
// Reflects date/view/categories/search/when in the URL so a state can be
// bookmarked, shared, or reloaded — per the brief's "filter state + URLs"
// requirement. Uses replaceState (not pushState) on every change so normal
// browsing doesn't spam browser history with one entry per keystroke/click;
// the URL still updates live and reloading/sharing it reproduces the view.
function syncURL(){
  const params = new URLSearchParams();
  // The restore logic below only ever reads the month/year back out of this
  // param (see dateParam handling), so which exact day gets encoded here is
  // purely cosmetic — it doesn't change what a reloaded/shared URL shows.
  // Still, showing an arbitrary "01" when the real default is today reads as
  // wrong at a glance. Prefer, in order: the actually-selected day, else
  // today's real date (while browsing the current month, which is the
  // homepage default), else just the 1st of whatever other month is showing.
  const todayIso = getTodayISO();
  const isCurrentMonth = current.getFullYear() === Number(todayIso.slice(0,4)) && current.getMonth() === Number(todayIso.slice(5,7)) - 1;
  const dateForUrl = selectedDate || (isCurrentMonth ? todayIso : toISO(current.getFullYear(), current.getMonth(), 1));
  params.set('date', dateForUrl);
  if(mode !== 'month') params.set('view', mode);
  if(whenMode) params.set('when', whenMode);
  if(activeCats.size < Object.keys(CATS).length) params.set('cats', Array.from(activeCats).join(','));
  if(freeOnly) params.set('free', '1');
  if(query) params.set('q', query);
  // A geolocation-derived origin (type:'here') has no stable name to
  // round-trip through a URL — omitted rather than encoding raw coordinates,
  // which would put the visitor's location in a shareable link.
  if(originLocation && originLocation.type !== 'here'){
    params.set('loc', originLocation.name);
    if(radiusMiles !== null) params.set('radius', String(radiusMiles));
  }
  const qs = params.toString();
  // Wrapped defensively: history.replaceState throws a SecurityError in a
  // sandboxed about:srcdoc context (e.g. an embedded preview iframe, which
  // has no real address of its own to rewrite) — URL bookmarking is a
  // nice-to-have, so a failure here should never break the rest of render().
  try {
    history.replaceState(null, '', qs ? `${location.pathname}?${qs}` : location.pathname);
  } catch (err) {
    // Silently skip — nothing else depends on this succeeding.
  }
}

// Reads the above back out on initial load, so a shared/bookmarked link
// reproduces the same view. Applied once, before the first render() — every
// later interaction just goes through the normal state variables + syncURL().
function readStateFromURL(){
  const params = new URLSearchParams(location.search);

  const dateParam = params.get('date');
  if(dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam)){
    const d = new Date(dateParam+"T12:00:00");
    const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
    if(monthStart >= MIN_MONTH && monthStart <= MAX_MONTH) current = monthStart;
  }

  const catsParam = params.get('cats');
  if(catsParam !== null){
    // An empty/invalid list intentionally means "show nothing" — matching
    // whatever state was actually shared, rather than silently falling back
    // to "show everything" and misrepresenting the link.
    activeCats = new Set(catsParam.split(',').filter(k=>CATS[k]));
  }

  if(params.get('free') === '1') freeOnly = true;

  const qParam = params.get('q');
  if(qParam){ query = qParam; document.getElementById('search').value = qParam; }

  const viewParam = params.get('view');
  const explicitView = viewParam === 'list' || viewParam === 'month';
  if(viewParam === 'list') mode = 'list';

  const whenParam = params.get('when');
  if(whenParam && ['now','today','tonight','weekend'].includes(whenParam)){
    whenMode = whenParam;
    if(whenParam === 'weekend'){
      cachedWeekendDates = getWeekendDates();
      if(!explicitView) mode = 'list';
    } else {
      selectedDate = getTodayISO();
    }
  }

  if(mode === 'list'){
    document.getElementById('listViewBtn').classList.add('active');
    document.getElementById('monthViewBtn').classList.remove('active');
    document.getElementById('calWrap').style.display = 'none';
    document.getElementById('listView').classList.add('show');
  }

  // A shared link only restores a NAMED location (a real match in
  // LOCATIONS) — a one-off geolocation origin was never put in the URL to
  // begin with (see syncURL), so there's nothing to restore for those.
  const locParam = params.get('loc');
  if(locParam){
    const found = LOCATIONS.find(l => l.name.toLowerCase() === locParam.toLowerCase());
    if(found){
      originLocation = found;
      const radiusParam = params.get('radius');
      if(radiusParam === 'all') radiusMiles = 'all';
      else {
        const n = parseInt(radiusParam, 10);
        radiusMiles = (!isNaN(n) && [5,10,25,50].includes(n)) ? n : 'all';
      }
    }
  }
  updateLocationControlUI();
}

readStateFromURL();
buildFilterBar();
render();

// ---- Live database (Supabase) ----
// This is the real, always-current data source: hand-curated events, venue
// submissions once approved by an admin, and Ticketmaster events written by
// the Vercel Cron job (see api/cron-ticketmaster.js) all live in one
// `events` table with status='approved'. The anon key below is meant to be
// public — Row Level Security (see supabase/schema.sql) restricts it to
// read-only access on approved rows only, nothing else.
//
// Fill these in once you've created your Supabase project (Project Settings
// → API). Left blank, the calendar just keeps running on FALLBACK_EVENTS.
const SUPABASE_URL = "https://afvyfjfqukptnfmgshzn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NQgem2pH8h_ynP8ikwdmFw_5aoN34Q5"; // publishable key — safe for client code, read-only via RLS

// Decodes HTML entities (e.g. a raw "&#038;" left over from a WordPress-
// sourced scraper) into their real characters, so text displays correctly
// instead of showing literal entity codes. Safe from XSS: a <textarea>'s
// content is always parsed as plain text and never executed, no matter what
// it contains — this only ever decodes characters, it doesn't introduce
// markup. Applied here (before escapeHtml() at render time) as a
// defense-in-depth cleanup covering any source, not just the specific crons
// that have since been fixed to decode entities before they're stored.
function decodeEntities(str){
  if(!str) return str;
  const ta = document.createElement('textarea');
  ta.innerHTML = str;
  return ta.value;
}

function mapSupabaseRow(row) {
  return {
    date: row.start_date,
    title: decodeEntities(row.title),
    venue: decodeEntities(row.venue_name_raw) || "Venue TBA",
    // Suppress "Detroit" specifically — it's the implicit default everywhere
    // else on the site, so showing it on every card would just be noise.
    // Any other city (Rochester Hills, Sterling Heights, Windsor ON, etc.)
    // shows, since that's exactly the info that was silently missing before.
    city: (row.venue_city_raw && row.venue_city_raw.toLowerCase() !== "detroit") ? decodeEntities(row.venue_city_raw) : undefined,
    cat: row.category,
    time: row.time_display || "",
    free: !!row.is_free,
    source: row.source || "Manual",
    note: row.note ? decodeEntities(row.note) : undefined,
    ticketUrl: row.ticket_url || undefined,
    priceFrom: row.price_from ?? undefined,
  };
}

async function loadSupabaseEvents() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return; // not configured yet — stay on fallback data
  try {
    const url = `${SUPABASE_URL}/rest/v1/events?status=eq.approved&select=title,start_date,venue_name_raw,venue_city_raw,category,time_display,is_free,source,note,ticket_url,price_from&order=start_date.asc`;
    const resp = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!resp.ok) return; // fails silently — fallback data stays on screen
    const rows = await resp.json();
    if (!Array.isArray(rows) || !rows.length) return;

    EVENTS = rows.map(mapSupabaseRow);
    byDate = {};
    EVENTS.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
    Object.values(byDate).forEach(list => list.sort((a,b) => (a.time||"").localeCompare(b.time||"")));

    buildFilterBar();
    render();
  } catch (err) {
    // Silent by design — FALLBACK_EVENTS keeps the calendar usable regardless.
  }
}
loadSupabaseEvents();
</script>
