<style>
  :root{
    /* Detroit Signal V2 — locked color architecture */
    --bg:#0A0A0A;          /* asphalt — primary dark environment */
    --panel:#202020;       /* charcoal — raised surface: cards, panels */
    --panel-alt:#161616;   /* slightly recessed surface: strip headers, muted rows */
    --panel-hover:#272727;
    --ink:#F2F0E8;         /* warm white — primary text */
    --ink-soft:#A9AAA3;    /* concrete — secondary/metadata text */
    --ink-dim:#5c5d58;     /* dim concrete — otherMonth / disabled text */
    --line:#2c2c2c;
    --line-soft:#212121;
    --accent:#D7FF00;      /* signal chartreuse — state only: live, selected, active */
    --on-accent:#0A0A0A;   /* required dark text/icon color on chartreuse fills */
    --today:rgba(215,255,0,.09);
    --today-ring:#D7FF00;
    /* Structural containers use a hard edge (0) rather than a soft rounded
       corner — a direct, deliberately conservative move toward the Detroit
       Signal concept board's rectilinear, editorial-broadcast language.
       Scoped to this single token: every var(--radius) consumer is a
       structural chrome container (.notice, .controls, .cal, #dayPanel,
       #listView), not an interactive pill/chip/badge, so this doesn't touch
       any control's tap-target shape or affordance. */
    --radius:0px;

    /* Event Type palette — "UV signal" set (2026-08-26): Jody asked to keep
       per-category color for scanability, restyled as a cohesive family of
       saturated blacklight-poster neons rather than the old grab-bag of
       hues, so it reads as on-brand next to the chartreuse accent instead of
       competing with it. Kept clear of chartreuse's own yellow-green band. */
    --c-music:#5B3EFF;    /* electric indigo */
    --c-theatre:#FF6A00;  /* neon orange */
    --c-dance:#FF2ECC;    /* neon magenta */
    --c-visual:#00E5FF;   /* electric cyan */
    --c-museum:#00FFA6;   /* UV spring-teal */
    --c-family:#FFC400;   /* neon amber */
    --c-fest:#FF2D55;     /* neon crimson */
    --c-food:#9D00FF;     /* UV violet */
    --c-film:#2979FF;     /* electric blue */
    --c-night:#E100FF;    /* UV fuchsia */
    --c-sports:#FF3B3B;   /* neon scarlet */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button{font-family:inherit;}
  /* Visible keyboard-only focus ring (not shown on mouse click) across every
     interactive control added/converted for the Chunk 4 accessibility pass —
     chartreuse matches the brand's existing "state" usage (today ring,
     live badge), not decoration. */
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.4;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:14px 20px 48px;}

  header.site{
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;flex-wrap:wrap;
    padding-bottom:10px;margin-bottom:10px;border-bottom:2px solid var(--ink);
  }
  /* Primary nav (Now/Tonight/This Weekend/Calendar/Browse) — plain uppercase
     text links, not the bordered-chip look .when-btn has elsewhere on the
     page. The class is still .when-btn for the 3 time-range items (so they
     ride the existing activateWhen()/updateWhenButtons() wiring); this
     scoped override just restyles them to match the nav bar visually. */
  .site-nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap;row-gap:8px;}
  .site-nav .when-btn, .site-nav-link{
    border:none;background:none;padding:0 0 4px;border-radius:0;
    font-family:'Inter',-apple-system,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;color:var(--ink-soft);text-decoration:none;cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  .site-nav .when-btn:hover, .site-nav-link:hover{color:var(--ink);}
  .site-nav .when-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  /* Marks whichever nav link is the current page (e.g. Calendar, on
     calendar.html) — same visual treatment as an active time-range chip. */
  .site-nav-link.current{color:var(--accent);border-bottom-color:var(--accent);}
  /* Search icon (mockup parity) — opens/focuses the real search input that
     already lives in .controls, rather than duplicating a second search
     field up here. No new search logic, just a shortcut to the existing one. */
  .nav-search-btn{
    border:none;background:none;padding:0;color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;
  }
  .nav-search-btn:hover{color:var(--ink);}
  .nav-search-btn svg{display:block;width:18px;height:18px;}
  @media (max-width:900px){
    .site-nav{gap:14px;order:3;flex-basis:100%;}
  }
  header.site h1{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:30px;margin:0 0 4px;letter-spacing:-0.01em;text-transform:uppercase;
  }
  /* The locked tagline ("THE CITY IS ON.") gets its own oversized display
     treatment — same approved condensed grotesk already used for the
     wordmark/headings, no new font. This is a typographic-hierarchy change
     only: the words are unchanged (previously run into the description
     sentence in lowercase), just presented at the scale/weight the tagline
     is meant to carry as a locked brand asset, per the Detroit Signal
     concept board's typographic energy. */
  /* (No separate brand-dot here — the wordmark SVG itself already has a
     built-in chartreuse dot; adding another produced a visible double-dot.) */

  /* ---- Hero: photography + real TODAY data (replaces the removed
     prototype "What this is" notice — brand + live current-day activity,
     not explanatory copy). ---- */
  .hero{
    display:grid;grid-template-columns:.85fr 1.3fr 1fr;gap:0;
    background:var(--panel);border:1px solid var(--line);margin-bottom:10px;
    min-height:320px;
  }
  .hero-headline{padding:22px 20px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .hl-line{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:clamp(34px,4.6vw,58px);line-height:.92;letter-spacing:-0.01em;
    text-transform:uppercase;color:var(--ink);
  }
  /* A real period, not a design flourish — sized and set on the baseline at
     the same scale as the letters around it (em-based, so it still tracks
     the headline's own responsive font-size). Not enlarged. */
  .hl-dot{
    display:inline-block;width:.16em;height:.16em;border-radius:50%;
    background:var(--accent);margin-left:.06em;vertical-align:baseline;
  }
  .hero-photo{position:relative;overflow:hidden;background:var(--panel-alt);}
  .hero-photo picture, .hero-photo img{display:block;width:100%;height:100%;object-fit:cover;}
  .hero-today{padding:20px 20px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
  /* "N things happening today in the Detroit Orbit" stat panel — a constant,
     site-wide pulse number (see isInDetroitOrbit()), distinct from the
     filtered calendar/list below it. Real count, never fabricated. */
  .hero-stat-number{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:clamp(46px,6vw,72px);line-height:.88;color:var(--accent);margin-bottom:2px;
  }
  .hero-stat-caption{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;font-size:16.5px;
    text-transform:uppercase;line-height:1.18;letter-spacing:-.005em;color:var(--ink);margin-bottom:14px;
  }
  .hero-stat-cta{
    display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:none;
    border:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:14px;
  }
  .hero-stat-cta:hover{text-decoration:underline;}
  .hero-stat-orbit{font-size:12px;color:var(--ink-soft);line-height:1.45;}
  @media (max-width:980px){
    .hero{grid-template-columns:1fr 1.2fr;}
    .hero-headline{grid-column:1 / -1;order:1;padding-bottom:6px;}
    .hero-photo{order:2;}
    .hero-today{order:3;}
  }
  @media (max-width:720px){
    .hero{grid-template-columns:1fr;min-height:0;}
    .hero-photo{aspect-ratio:16/9;}
    .hero-headline{padding:18px 18px 4px;}
    .hero-today{padding:14px 18px 20px;}
  }

  .controls{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;
  }
  .nav-group{display:flex;align-items:center;gap:10px;}
  .nav-group button.navbtn{
    border:1px solid var(--line);background:var(--panel-alt);border-radius:var(--radius);width:34px;height:34px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .nav-group button.navbtn:hover:not(:disabled){background:var(--panel-hover);}
  .nav-group button.navbtn:disabled{opacity:.35;cursor:not-allowed;}
  #monthLabel{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;min-width:170px;text-align:center;}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .view-toggle button{
    border:none;background:var(--panel-alt);padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--accent);color:var(--on-accent);font-weight:700;}
  #search{
    border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-size:13.5px;min-width:200px;
    background:var(--panel-alt);color:var(--ink);
  }
  #search::placeholder{color:var(--ink-dim);}

  /* Discovery bar — time-range shortcuts. Deliberately styled like the
     existing view-toggle/chip controls (ink-on-active, not chartreuse) —
     the brief is explicit that Signal stays scarce and controls need
     conventional usability, not brand theatrics. */
  .discovery-bar{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
  }
  .when-btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    border-radius:var(--radius);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .when-btn:hover{background:var(--panel-hover);}
  .when-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* Active-filter tray — one visible summary of whatever is currently
     narrowing the event universe (time-range shortcut, free-only, search
     text, a narrowed category set), each independently removable, per the
     brief's "filter state must never be invisible" requirement. */
  .active-filters{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;
  }
  .af-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .af-chip{
    display:flex;align-items:center;gap:6px;background:var(--panel-alt);border:1px solid var(--line);
    border-radius:var(--radius);padding:5px 8px 5px 12px;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .af-chip button{
    border:none;background:var(--panel-hover);color:var(--ink-soft);border-radius:50%;
    width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .af-chip button:hover{background:var(--ink);color:var(--bg);}
  .af-clear{
    border:1px solid #4a2a28;background:none;color:#e07a72;border-radius:var(--radius);padding:5px 12px;
    font-size:12.5px;font-weight:600;cursor:pointer;
  }

  .filters{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
  }
  .chip{
    border:1px solid var(--line);background:var(--panel-alt);border-radius:var(--radius);padding:6px 12px;
    font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink-soft);
    user-select:none;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  /* Selected/active state on every chip (Event Type dots included) is Signal
     Chartreuse — the one color that always means "this is on," independent
     of whichever per-category dot color the chip also carries. freeChip
     below keeps its own distinct green for the same reason "Free only"
     already had one before this pass. */
  .chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;}
  .chip.active .dot{outline:1.5px solid var(--on-accent);}
  .chip#freeChip.active{background:#3fbf6a;border-color:#3fbf6a;color:#06210f;}
  .chip#clearChip{color:#e07a72;border-color:#4a2a28;}

  /* Location + radius bar — Phase 1 Chunk 3. Same restrained styling as the
     discovery bar (ink-on-active, chartreuse reserved for state, not chrome). */
  .location-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;
  }
  .loc-control{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .loc-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .loc-combo{position:relative;min-width:200px;}
  #locInput{
    border:1px solid var(--line);border-radius:var(--radius);padding:8px 30px 8px 12px;font-size:13.5px;width:100%;min-width:200px;
    background:var(--panel-alt);color:var(--ink);
  }
  #locInput::placeholder{color:var(--ink-dim);}
  .loc-clear-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:none;background:var(--panel-hover);color:var(--ink-soft);border-radius:50%;
    width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;align-items:center;justify-content:center;display:flex;
  }
  .loc-clear-btn:hover{background:var(--ink);color:var(--bg);}
  .loc-suggestions{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;max-height:280px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .loc-item{
    padding:8px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .loc-item:last-child{border-bottom:none;}
  .loc-item:hover, .loc-item.hl{background:var(--panel-hover);}
  .loc-item-name{color:var(--ink);font-weight:600;}
  .loc-item-type{color:var(--ink-dim);font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
  .loc-empty{padding:10px 12px;font-size:12.5px;color:var(--ink-dim);}
  .loc-geo-btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:var(--radius);
    padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .loc-geo-btn:hover:not(:disabled){background:var(--panel-hover);}
  .loc-geo-btn:disabled{opacity:.6;cursor:default;}
  .radius-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .radius-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-right:2px;}
  .radius-chip{
    border:1px solid var(--line);background:var(--panel-alt);color:var(--ink-soft);border-radius:var(--radius);
    padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .radius-chip:hover{background:var(--panel-hover);}
  .radius-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* Calendar grid */
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
  .cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:0;background:var(--panel-alt);border-bottom:1px solid var(--line);}
  .cal-head div{padding:9px 0;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:0;}
  .day-cell{
    min-height:122px;min-width:0;overflow:hidden;
    border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    padding:6px 6px 8px;position:relative;cursor:pointer;background:var(--panel);
  }
  .day-cell:nth-child(7n){border-right:none;}
  .day-cell.otherMonth{background:var(--panel-alt);color:var(--ink-dim);}
  .day-cell.today{background:var(--today);box-shadow:inset 0 0 0 2px var(--today-ring);}
  .day-cell:hover{background:var(--panel-hover);}
  .day-cell.today:hover{background:var(--today);}
  .daynum{
    font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;margin-bottom:4px;color:var(--ink-soft);
    display:flex;align-items:baseline;gap:6px;
  }
  .day-cell.today .daynum{color:var(--accent);}
  /* Past dates stay fully clickable/legible — only the day number itself
     dims slightly as a temporal cue. Events, pills, and counts stay at full
     opacity so nothing reads as "disabled". Doesn't apply to .today, which
     has its own treatment, or otherMonth cells (already dimmed via panel-alt). */
  .day-cell.past:not(.today):not(.otherMonth) .daynum{opacity:.55;}
  .today-label{
    font-family:'Inter',sans-serif;font-size:9px;font-weight:800;letter-spacing:.05em;
    color:var(--accent);text-transform:uppercase;
  }
  .day-count{
    font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);
    margin-bottom:4px;display:flex;align-items:center;gap:4px;text-transform:uppercase;
  }
  .day-count .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;}

  /* ---- Homepage body layout: calendar/list + right-rail highlights ----
     The sidebar reverses an earlier-session "no right rail" call, but only
     for the three modules explicitly approved per-module (View Calendar,
     Near You, Free Today) — bookmark/save stays out per that same
     decision. Every number in these cards is real, computed the same way
     the month grid / hero stat already compute theirs — never fabricated
     counts like the mockup's placeholder figures. */
  .home-body{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;margin-bottom:10px;}
  .home-main{min-width:0;}
  .home-sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:14px;}
  .side-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .side-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .side-card-head h2{
    font-family:'Inter',-apple-system,sans-serif;font-size:12px;font-weight:800;
    text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:0;
  }
  .side-card-link{font-size:11.5px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;}
  .side-card-link:hover{text-decoration:underline;}
  .side-card-sub{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .side-card-number{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:34px;line-height:1;color:var(--accent);margin-bottom:2px;
  }
  .side-card-caption{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .side-card-cta{
    display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);
    background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  }
  .side-card-cta:hover{text-decoration:underline;}

  /* View Calendar card: one real week row, not a full month — see the
     "same amount of calendar as in the mock" spec. Links out to the
     dedicated calendar page rather than duplicating month navigation. */
  .vc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .vc-day{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;
    border-radius:var(--radius);background:var(--panel-alt);text-decoration:none;
    color:var(--ink);border:1px solid transparent;
  }
  .vc-day:hover{background:var(--panel-hover);}
  .vc-day.today{border-color:var(--accent);background:var(--today);}
  .vc-dow{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);}
  .vc-num{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
  .vc-count{font-size:10px;font-weight:700;color:var(--accent);}

  /* Near You: decorative-only radar — this project has zero real per-event
     coordinates (0% of venues/events have lat/lng), so this never plots
     real event positions. The count above/below it is real, city-level
     radius math (haversineMiles against CITY_LOOKUP), same method the
     Where/radius filter already uses. */
  .ny-radar{position:relative;width:100%;height:84px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;}
  .ny-ring{position:absolute;border:1px solid var(--line);border-radius:50%;}
  .ny-ring-1{width:38%;height:38%;}
  .ny-ring-2{width:68%;height:68%;}
  .ny-ring-3{width:100%;height:100%;}
  .ny-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px rgba(215,255,0,.15);}

  @media (max-width:980px){
    .home-body{grid-template-columns:1fr;}
    .home-sidebar{position:static;}
  }
  .pill{
    font-size:10.8px;background:var(--panel-hover);color:var(--ink);border-radius:5px;padding:2px 5px;margin-bottom:3px;
    display:flex;align-items:center;gap:4px;min-width:0;max-width:100%;
  }
  .pill .sw{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .pill .t{min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .more-link{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:1px;}

  /* Day detail panel */
  #dayPanel{
    margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;display:none;
  }
  #dayPanel.show{display:block;}
  #dayPanel h2{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center;}
  #dayPanel h2 button{border:none;background:none;font-size:14px;color:var(--ink-soft);cursor:pointer;}

  /* Event rows — matches the approved mockup's list treatment directly:
     oversized chartreuse time, plain right-aligned category/price column
     (no pill chips here — those stay in the filter bar/calendar dots),
     hairline dividers rather than boxed cards. No bookmark/save icon
     (stays rejected — see FINAL IMPLEMENTATION DIRECTIVE). One real
     deviation from the mock: no street address line under the venue name
     — venue_name_raw/venue_city_raw is all the data model actually has,
     no per-venue street address, so nothing is fabricated to fill that
     line. Shared by both the List view (renderList()) and the month
     view's day panel (showDayPanel()), so both get this treatment. */
  .evt-row{
    display:grid;grid-template-columns:98px 1fr auto;gap:18px;align-items:start;
    padding:16px 0;border-top:1px solid var(--line-soft);
  }
  .evt-row:first-of-type{border-top:none;}
  /* Chartreuse + oversized, per the mock — a deliberate reversal of this
     project's earlier "accent is state-only" rule, made because Jody asked
     directly to match the mock's row treatment. Plain text rather than a
     split number/AM-PM (the mock's single "5:00 PM"): real event times
     here are often ranges ("11:00 AM–3:00 PM") or non-numeric ("Evening",
     "Varies"), which a stylized split can't safely parse. */
  .evt-time{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:16.5px;line-height:1.3;color:var(--accent);padding-top:1px;
  }
  .evt-time:empty{display:none;}
  .evt-main{min-width:0;}
  .evt-title{font-size:18px;font-weight:800;margin-bottom:4px;line-height:1.25;}
  .evt-venue{font-size:13px;color:var(--ink-soft);line-height:1.4;}
  .note{font-size:12px;color:#d1b34a;margin-top:6px;font-style:italic;}
  .src{font-size:11px;color:var(--ink-dim);font-style:italic;}
  .evt-link{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;
  }
  .evt-link:hover{text-decoration:underline;}
  .evt-link::after{content:'→';}
  /* Right column: category (its own site-wide color, kept from the
     chip/dot system — the mock's plain gray text was tied to its own
     placeholder taxonomy, not this project's locked, color-coded one) and
     price/free stacked underneath, right-aligned. */
  .evt-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;text-align:right;}
  .evt-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .evt-price{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .evt-price.free{color:#3fbf6a;}

  @media (max-width:640px){
    /* Time + category/price move above the title instead of framing it on
       either side — a three-column grid gets cramped fast on a narrow
       phone width. */
    .evt-row{grid-template-columns:1fr;gap:4px;padding:14px 0;}
    .evt-time{order:1;}
    .evt-side{order:2;flex-direction:row;align-items:baseline;gap:8px;text-align:left;}
    .evt-main{order:3;}
  }

  /* List view */
  #listView{display:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px 20px;}
  #listView.show{display:block;}
  .list-day-group{padding:14px 0;border-top:1px solid var(--line-soft);}
  .list-day-group:first-child{padding-top:0;border-top:none;}
  .list-day-heading{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .es-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .es-action{
    border:1px solid var(--line);background:var(--panel-alt);color:var(--ink);border-radius:var(--radius);
    padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .es-action:hover{background:var(--panel-hover);}

  footer.site{margin-top:26px;font-size:12px;color:var(--ink-soft);line-height:1.6;}
  footer.site a{color:var(--ink-soft);}
  footer.site p{margin:0 0 6px;}
  footer.site p:last-child{margin-bottom:0;}
  /* Footer + data-transparency amendment: a quiet, editorial link out to the
     full methodology/status page, styled as a small uppercase label rather
     than an inline sentence — the homepage stays slick, sources.html stays
     the transparent one. */
  footer.site .footer-sources a{
    text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700;
    color:var(--ink-dim);text-decoration:none;
  }
  footer.site .footer-sources a:hover{color:var(--ink-soft);text-decoration:underline;}
  footer.site .footer-credit{font-size:11px;color:var(--ink-dim);}
  footer.site .footer-credit a{color:var(--ink-dim);text-decoration:underline;}

  @media (max-width:720px){
    .day-cell{min-height:78px;}
    .pill{display:none;}
    .more-link{display:none;} /* redundant once .day-count shows the total */
    #monthLabel{min-width:0;}
  }

  /* ---- Unified discovery row (Homepage Redesign pass) ----
     WHEN / WHERE / CATEGORY now render as one compact row of boxed
     triggers at every breakpoint — each shows its current value and, when
     clicked, expands the same underlying bar (same DOM/IDs/JS state that
     powered the old always-open three-row layout) rather than replacing it
     with new controls. Below 720px that expansion is the original fixed
     bottom sheet (unchanged, proven mobile pattern). At 721px+ it expands
     inline, directly under the trigger row, styled like a dropdown panel —
     no new filtering logic anywhere, purely a presentation change. */
  .discovery-shell{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;
  }
  .mobile-triggers{display:flex;gap:8px;}
  .mobile-trigger{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-alt);color:var(--ink);
    border-radius:var(--radius);padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  }
  .mobile-trigger:hover{background:var(--panel-hover);}
  .mobile-trigger .mt-label{
    font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-dim);text-transform:uppercase;
  }
  .mobile-trigger .mt-sub{
    font-size:13px;font-weight:700;color:var(--ink-soft);max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .mobile-trigger .mt-sub::after{content:' \25be';font-size:10px;color:var(--ink-dim);} /* ▾ */
  .mobile-trigger.has-value{border-color:var(--accent);}
  .mobile-trigger.has-value .mt-sub{color:var(--ink);}
  .mobile-trigger[aria-expanded="true"]{background:var(--panel-hover);border-color:var(--ink);}

  .sheet-backdrop{display:none;}

  /* Panels are hidden until their trigger opens them, at every breakpoint —
     the always-open three-row layout they used to be is gone for good. */
  .discovery-bar, .location-bar, .filters{display:none;}
  .sheet-header{display:none;}
  .discovery-bar.sheet-active, .location-bar.sheet-active, .filters.sheet-active{
    display:flex;flex-direction:column;flex-wrap:nowrap;
    background:var(--panel-alt);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-top:10px;
  }
  .discovery-bar.sheet-active .sheet-header,
  .location-bar.sheet-active .sheet-header,
  .filters.sheet-active .sheet-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  }
  /* Once inside an open panel, the discovery/location/filter bars go back to
     being a normal wrapping row of chips — same look they always had. */
  .discovery-bar.sheet-active, .filters.sheet-active{flex-direction:row;flex-wrap:wrap;gap:8px;}
  .location-bar.sheet-active{flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center;}
  .sheet-close{
    border:none;background:var(--panel-hover);color:var(--ink);border-radius:50%;
    width:26px;height:26px;font-size:12px;cursor:pointer;line-height:1;
  }
  .sheet-close:hover{background:var(--ink);color:var(--bg);}

  @media (max-width:720px){
    .discovery-shell{padding:10px 10px 0;background:none;border:none;}
    .mobile-trigger{align-items:center;text-align:center;}
    .mobile-trigger .mt-label{display:none;} /* label redundant at this width — "Today"/"Detroit Orbit" already reads as the answer */

    .sheet-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;
    }
    .sheet-backdrop.show{display:block;}

    .discovery-bar.sheet-active, .location-bar.sheet-active, .filters.sheet-active{
      flex-direction:column;flex-wrap:nowrap;
      position:fixed;left:0;right:0;bottom:0;z-index:40;
      border-bottom:none;
      border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);
      padding:16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height:75vh;overflow-y:auto;margin:10px 0 0;
    }
    /* Radius/location controls stack full-width inside the sheet rather
       than trying to fit the desktop's side-by-side row. */
    .location-bar.sheet-active .loc-control{flex-direction:column;align-items:stretch;}
    .location-bar.sheet-active .loc-combo{min-width:0;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <div>
      <h1><a href="/" aria-label="313.events — back to today" style="display:flex;align-items:center;text-decoration:none;">
        <img src="/assets/wordmark.svg" alt="313.events" height="26" style="display:block;">
      </a></h1>
    </div>
    <nav class="site-nav" aria-label="Time range and browse">
      <!-- Reuses the existing .when-btn/data-when/activateWhen() machinery
           (see the discovery bar's own Now/Today/Tonight/This Weekend/Date
           buttons below) — clicking these keeps them in sync via the shared
           updateWhenButtons(), since both sets share the .when-btn class.
           "NOW" here maps to whenMode 'today' (all of today, unnarrowed) per
           Jody's definition — distinct from the sheet's own "Now" button,
           which still narrows to the remaining hours today. -->
      <button type="button" class="when-btn" data-when="today">Now</button>
      <button type="button" class="when-btn" data-when="tonight">Tonight</button>
      <button type="button" class="when-btn" data-when="weekend">This Weekend</button>
      <a class="site-nav-link" href="calendar.html">Calendar</a>
      <button type="button" class="site-nav-link" id="browseBtn">Browse</button>
    </nav>
    <div style="display:flex;align-items:center;gap:18px;">
      <button type="button" class="nav-search-btn" id="navSearchBtn" aria-label="Search events and venues">

// Great-circle distance in miles — matches the method used to derive
// SERVICE_AREA.md's own boundary table, so radius math stays consistent
// with the reasoning that document already documents.
function haversineMiles(lat1, lng1, lat2, lng2){
  const R = 3958.8;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

Object.values(byDate).forEach(list=>list.sort((a,b)=> (a.time||"").localeCompare(b.time||"")));

// Navigable range is relative to today's real date, not a hardcoded month —
// otherwise "back" dead-ends the moment today falls on the earliest allowed
// month, and the default view goes stale as soon as the calendar page turns.
// Uses local date components (not toISOString(), which is UTC) for the same
// reason the "today" highlight below does.
const _navToday = new Date();
const _navTodayMonthStart = new Date(_navToday.getFullYear(), _navToday.getMonth(), 1);
const MIN_MONTH = new Date(_navTodayMonthStart.getFullYear(), _navTodayMonthStart.getMonth() - 12, 1);
const MAX_MONTH = new Date(_navTodayMonthStart.getFullYear(), _navTodayMonthStart.getMonth() + 12, 1);
let current = new Date(_navTodayMonthStart);

// Hard content block: events matching any name on this list are excluded
// from every view (calendar, list, Today strip) regardless of source —
// checked against the event title and note/description, case-insensitively.
// This is a manual, always-on suppression list independent of the normal
// category/free/search/when filters. Add additional blocked names as
// simple strings.
const BLOCKED_NAMES = ["Augustus Williams"];
function isBlockedEvent(e){
  return BLOCKED_NAMES.some(name => {
    const n = name.toLowerCase();
    return (e.title && e.title.toLowerCase().includes(n)) ||
           (e.note && e.note.toLowerCase().includes(n));
  });
}

let activeCats = new Set(Object.keys(CATS));
let freeOnly = false;
let query = "";
let mode = "month"; // month | list
// Active time-range shortcut from the discovery bar: null | 'now' | 'today' |
// 'tonight' | 'weekend'. Independent of category/free/search filters — see
// matchesFilters() below, which combines all of them.
let whenMode = null;
// Populated only while whenMode === 'weekend' — the 3 ISO dates (Fri/Sat/Sun)
// currently in scope. Recomputed each time weekend mode is (re)activated,
// not on every render, since "this weekend" only changes at midnight.
let cachedWeekendDates = [];
let selectedDate = null;
// originLocation: the chosen search-radius origin — {name, type, region,
// lat, lng} from LOCATIONS, or a geolocation-derived point (type:'here').
// null means no location filter is active at all.
let originLocation = null;
// radiusMiles: 5/10/25/50 (number) or 'all' — labeled "Detroit Orbit" in the
// UI, this is the widest tier and the default. It is NOT narrowed by
// whatever origin the user searched (that's what makes it the widest tier),
// but matchesFilters() still hard-caps it at 75 miles from Detroit's own
// city center specifically — the fixed definition of the Detroit Orbit
// boundary, per SERVICE_AREA.md — so results can never drift outside the
// site's real coverage area regardless of the chosen origin. A separate
// literal "75 mi" option (measured from the user's origin, like the other
// numeric tiers) used to exist alongside it, which was a redundant way of
// saying almost the same boundary twice; removed 2026-08-26 in favor of
// "Detroit Orbit" being the one Detroit-anchored 75-mile option. Only
// meaningful while originLocation is set.
let radiusMiles = null;

function fmtMonth(d){ return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function toISO(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

// Uses local date components (not toISOString(), which is UTC) — same
// reasoning as renderMonth()'s own todayISO: Detroit is UTC-4/-5, so late
// evening through midnight local time would otherwise read as tomorrow.
function getTodayISO(){
  const d = new Date();
  return toISO(d.getFullYear(), d.getMonth(), d.getDate());
}

// Best-effort parse of the free-text time_display field ("7:30 PM",
// "12:00–3:00 PM", "Evening", "3:00 & 7:00 PM"...) into a 24h hour number.
// This is a soft convenience signal for the NOW/TONIGHT shortcuts, not
// authoritative scheduling data — see DISCOVERY_PHASE1_AUDIT.md. For a
// range like "12:00–3:00 PM" this returns whichever time the regex finds
// first (often the end of the range, since the start half usually has no
// AM/PM of its own) — good enough to classify "roughly when", not precise
// enough for anything that needs a real start time. Returns null when
// nothing parseable is found; callers decide how to treat that.
function parseHour(timeStr){
  if(!timeStr) return null;
  if(/evening/i.test(timeStr)) return 19;
  const m = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return null;
  let hour = parseInt(m[1],10) % 12;
  if(/PM/i.test(m[3])) hour += 12;
  return hour;
}

// "This weekend" = the Friday/Saturday/Sunday currently in progress or the
// next upcoming one — never a weekend that's already fully over. Returns 3
// ISO date strings.
function getWeekendDates(){
  const d = new Date();
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const deltaToFriday = dow === 0 ? -2 : 5 - dow;
  const fri = new Date(d); fri.setDate(d.getDate() + deltaToFriday);
  return [0,1,2].map(off=>{
    const x = new Date(fri); x.setDate(fri.getDate()+off);
    return toISO(x.getFullYear(), x.getMonth(), x.getDate());
  });
}

// The current Monday-Sunday calendar week (per Jody: the week runs
// Monday-Sunday, not Sun-Sat and not a rolling 7-day-from-today window) —
// backs the hero's "N things happening this week" stat. Widened from a
// single-day count (2026-08-26) because on lighter data days "today" alone
// reads as too thin a number; a full week gives a steadier, still-real count
// while more sources get added. Revisit narrowing this back to today once
// daily volume no longer needs the wider window.
function getCalendarWeekDates(){
  const todayIso = getTodayISO();
  const t = new Date(todayIso+"T12:00:00");
  const dow = t.getDay(); // 0=Sun..6=Sat
  const deltaToMonday = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(t); mon.setDate(t.getDate() + deltaToMonday);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    return toISO(d.getFullYear(), d.getMonth(), d.getDate());
  });
}

function matchesFilters(e){
  if(isBlockedEvent(e)) return false;
  if(!activeCats.has(e.cat)) return false;
  if(freeOnly && !e.free) return false;
  if(query){
    const q = query.toLowerCase();
    if(!(e.title.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q))) return false;
  }
  if(whenMode){
    const todayIso = getTodayISO();
    if(whenMode === 'weekend'){
      if(!cachedWeekendDates.includes(e.date)) return false;
    } else {
      // now / today / tonight are all "today", narrowed further below
      if(e.date !== todayIso) return false;
      if(whenMode === 'now'){
        const hr = parseHour(e.time);
        const nowHour = new Date().getHours();
        // Unparseable times stay included — NOW is a safety net ("what's
        // still ahead"), not a deliberate narrowing, so an unknown time
        // should never silently disappear from it.
        if(hr !== null && hr < nowHour) return false;
      } else if(whenMode === 'tonight'){
        // Unlike NOW, TONIGHT *is* a deliberate narrowing — an event with no
        // parseable time isn't confidently "tonight", so it's excluded here
        // rather than guessed at.
        const hr = parseHour(e.time);
        if(hr === null || hr < 17) return false;
      }
    }
  }
  if(originLocation && radiusMiles !== null){
    const loc = CITY_LOOKUP.get((e.city || "Detroit").toLowerCase());
    // An event whose city isn't in the reference table has no resolvable
    // distance from the chosen origin — excluded rather than guessed at,
    // the same "deliberate narrowing over silent inclusion" call made for
    // TONIGHT above (this is an active, opt-in radius filter, not a safety
    // net like NOW).
    if(!loc) return false;
    if(radiusMiles === 'all'){
      // Detroit Orbit: not narrowed by the chosen origin location itself
      // (that's what makes it the widest tier), but still hard-capped at 75
      // miles from Detroit's own city center — the fixed definition of the
      // Detroit Orbit boundary — so results never drift outside the site's
      // real coverage area no matter where the user searched from.
      const detroit = CITY_LOOKUP.get('detroit');
      if(haversineMiles(detroit.lat, detroit.lng, loc.lat, loc.lng) > 75) return false;
    } else if(haversineMiles(originLocation.lat, originLocation.lng, loc.lat, loc.lng) > radiusMiles){
      return false;
    }
  }
  return true;
}

// Is this event within 75 miles of Detroit's own center — the fixed
// definition of "the Detroit Orbit"? Unlike the Detroit-Orbit branch inside
// matchesFilters() above, this is NOT gated on the visitor having picked an
// origin location or radius; it backs the homepage hero's "N things
// happening today in the Detroit Orbit" stat, which is meant to be a
// constant, site-wide count, not something that changes as someone filters
// the calendar below it.
function isInDetroitOrbit(e){
  const loc = CITY_LOOKUP.get((e.city || "Detroit").toLowerCase());
  if(!loc) return false;
  const detroit = CITY_LOOKUP.get('detroit');
  return haversineMiles(detroit.lat, detroit.lng, loc.lat, loc.lng) <= 75;
}

// Generic version of the above, parameterized on an arbitrary origin/radius
// — backs the "Near You" sidebar card, which needs the user's own chosen
// location (once set) rather than the fixed Detroit-center/75mi orbit.
function isWithinRadius(e, lat, lng, miles){
  const loc = CITY_LOOKUP.get((e.city || "Detroit").toLowerCase());
  if(!loc) return false;
  return haversineMiles(lat, lng, loc.lat, loc.lng) <= miles;
}

function buildFilterBar(){
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';

  // #filterBar doubles as the mobile FILTER sheet's content (see Chunk 4's
  // .sheet-active rules) — its innerHTML is fully rebuilt on every call, so
  // the sheet header has to be re-added here rather than living statically
  // in the HTML the way discoveryBar/locationBar's headers do.
  const header = document.createElement('div');
  header.className = 'sheet-header';
  const headerLabel = document.createElement('span');
  headerLabel.textContent = 'Filter';
  const headerClose = document.createElement('button');
  headerClose.type = 'button';
  headerClose.className = 'sheet-close';
  headerClose.setAttribute('aria-label', 'Close');
  headerClose.innerHTML = '&#10005;';
  header.appendChild(headerLabel);
  header.appendChild(headerClose);
  bar.appendChild(header);

  // "All types" — a single, explicit way back to the unfiltered Event Type
  // state, distinct from "Reset filters" below (which also clears When,
  // Where, and search). Active whenever every category is currently
  // selected, i.e. nothing has actually been narrowed yet.
  const allChip = document.createElement('button');
  allChip.type = 'button';
  const allActive = activeCats.size === Object.keys(CATS).length;
  allChip.className = 'chip' + (allActive ? ' active' : '');
  allChip.id = 'allTypesChip';
  allChip.setAttribute('aria-pressed', allActive ? 'true' : 'false');
  // Taxonomy-lock amendment (2026-08-26 clarification): the preserved list is
  // "All types" (sentence case) plus the 11 categories below, unchanged and
  // unreordered. The amendment is explicit that it locks the taxonomy only,
  // not presentation — so this text can still be restyled, just not renamed.
  allChip.textContent = 'All types';
  allChip.onclick = ()=>{
    activeCats = new Set(Object.keys(CATS));
    buildFilterBar();
    render();
  };
  bar.appendChild(allChip);

  Object.entries(CATS).forEach(([key,c])=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    // Reflects actual activeCats state (not hardcoded active) — matters once
    // state can also arrive from the URL or a "Clear All" that only clears
    // some dimensions, not just from clicking chips one at a time.
    chip.className = 'chip' + (activeCats.has(key) ? ' active' : '');
    chip.dataset.cat = key;
    chip.setAttribute('aria-pressed', activeCats.has(key) ? 'true' : 'false');
    // Per-category dot restored per Jody's 2026-08-26 note: keep the color
    // variety for scanability, just made cohesive (see the --c-* "UV signal"
    // palette above). Active/selected state is still Signal Chartreuse only.
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = ()=>{
      if(activeCats.has(key)){ activeCats.delete(key); chip.classList.remove('active'); }
      else { activeCats.add(key); chip.classList.add('active'); }
      chip.setAttribute('aria-pressed', activeCats.has(key) ? 'true' : 'false');
      render();
    };
    bar.appendChild(chip);
  });
  const freeChip = document.createElement('button');
  freeChip.type = 'button';
  freeChip.className = 'chip' + (freeOnly ? ' active' : '');
  freeChip.id = 'freeChip';
  freeChip.setAttribute('aria-pressed', freeOnly ? 'true' : 'false');
  freeChip.innerHTML = `<span class="dot" style="background:#16713a"></span>Free only`;
  freeChip.onclick = ()=>{
    freeOnly = !freeOnly;
    freeChip.classList.toggle('active');
    freeChip.setAttribute('aria-pressed', freeOnly ? 'true' : 'false');
    render();
  };
  bar.appendChild(freeChip);

  const clearChip = document.createElement('button');
  clearChip.type = 'button';
  clearChip.className = 'chip';
  clearChip.id = 'clearChip';
  clearChip.textContent = 'Reset filters';
  clearChip.onclick = ()=>{ clearAllFilters(); };
  bar.appendChild(clearChip);
}

// Resets every discovery dimension at once: categories, free-only, search
// text, and the when-shortcut. Used by both the category bar's "Reset
// filters" chip and the active-filter tray's "Clear All", so there's exactly
// one reset behavior instead of two subtly different ones. Also returns the
// calendar to the current month (today) rather than leaving it wherever the
// user had navigated to — a reset should feel like coming back to "now",
// not just clearing filters on whatever month happens to be on screen.
function clearAllFilters(){
  activeCats = new Set(Object.keys(CATS));
  freeOnly = false;
  document.getElementById('search').value = '';
  query = '';
  whenMode = null;
  selectedDate = null;
  const t = new Date(getTodayISO()+"T12:00:00");
  current = new Date(t.getFullYear(), t.getMonth(), 1);
  clearLocation({skipRender: true});
  buildFilterBar();
  render();
}

// Renders the "what am I looking at" summary tray above the calendar/list —
// each active dimension shown as its own removable chip, per the brief's
// "filter state must be visible" requirement. Categories only show up here
// when narrowed below the full set (showing all 11 active chips twice, once
// in the category bar and again here, would just be noise).
function renderActiveFilters(){
  const tray = document.getElementById('activeFilters');
  const chips = [];

  const WHEN_LABELS = {now:'Now', today:'Today', tonight:'Tonight', weekend:'This Weekend'};
  if(whenMode && WHEN_LABELS[whenMode]){
    chips.push({label: WHEN_LABELS[whenMode], onRemove: ()=>{ whenMode = null; updateWhenButtons(); render(); }});
  }
  if(freeOnly){
    chips.push({label: 'Free only', onRemove: ()=>{
      freeOnly = false;
      document.getElementById('freeChip').classList.remove('active');
      render();
    }});
  }
  if(query){
    chips.push({label: `"${query}"`, onRemove: ()=>{
      query = '';
      document.getElementById('search').value = '';
      render();
    }});
  }
  if(activeCats.size < Object.keys(CATS).length){
    chips.push({label: `${activeCats.size} of ${Object.keys(CATS).length} categories`, onRemove: ()=>{
      activeCats = new Set(Object.keys(CATS));
      buildFilterBar();
      render();
    }});
  }
  if(originLocation){
    const radiusLabel = (radiusMiles === 'all' || radiusMiles === null) ? 'Detroit Orbit' : `${radiusMiles} mi`;
    chips.push({label: `${radiusLabel} · ${originLocation.name}`, onRemove: ()=> clearLocation()});
  }

  if(!chips.length){ tray.style.display = 'none'; tray.innerHTML = ''; return; }

  tray.style.display = 'flex';
  tray.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'af-label';
  label.textContent = 'Showing:';
  tray.appendChild(label);
  chips.forEach(({label: text, onRemove})=>{
    const chip = document.createElement('div');
    chip.className = 'af-chip';
    const span = document.createElement('span');
    span.textContent = text;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', `Remove ${text} filter`);
    btn.textContent = '✕';
    btn.onclick = onRemove;
    chip.appendChild(span);
    chip.appendChild(btn);
    tray.appendChild(chip);
  });
  const clearAll = document.createElement('button');
  clearAll.type = 'button';
  clearAll.className = 'af-clear';
  clearAll.textContent = 'Clear all';
  clearAll.onclick = ()=>{ clearAllFilters(); };
  tray.appendChild(clearAll);
}

// Keeps the month label and prev/next disabled state in sync with `current`
// regardless of which view (month grid or list) is currently rendered.
// Previously this only ran inside renderMonth(), so switching to List view
// and paging with next/prev silently left the header showing a stale month
// while the list content underneath had actually moved on — same events,
// wrong label. Called once per render() so both views always agree.
function updateMonthHeader(){
  const y = current.getFullYear(), m = current.getMonth();
  document.getElementById('monthLabel').textContent = fmtMonth(current);
  document.getElementById('prevBtn').disabled = (y===MIN_MONTH.getFullYear() && m===MIN_MONTH.getMonth());
  document.getElementById('nextBtn').disabled = (y===MAX_MONTH.getFullYear() && m===MAX_MONTH.getMonth());
}

function renderMonth(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const y = current.getFullYear(), m = current.getMonth();

  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev = new Date(y,m,0).getDate();
  const totalCells = Math.ceil((firstDow + daysInMonth)/7)*7;

  // Use local date components, not toISOString() (which is UTC) — Detroit is
  // UTC-4/-5, so from evening through midnight local time, the UTC date has
  // already rolled to the next day while it's still "today" here. This
  // matches whatever timezone the visitor's own browser/device is set to.
  const _now = new Date();
  const todayISO = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;

  for(let i=0;i<totalCells;i++){
    const cell = document.createElement('div');
    let dayNum, cellMonth = m, cellYear = y, iso;
    if(i < firstDow){
      dayNum = daysInPrev - firstDow + 1 + i;
      cellMonth = m-1; if(cellMonth<0){cellMonth=11;cellYear--;}
      cell.className = 'day-cell otherMonth';
    } else if(i >= firstDow + daysInMonth){
      dayNum = i - (firstDow+daysInMonth) + 1;
      cellMonth = m+1; if(cellMonth>11){cellMonth=0;cellYear++;}
      cell.className = 'day-cell otherMonth';
    } else {
      dayNum = i - firstDow + 1;
      cell.className = 'day-cell';
    }
    iso = toISO(cellYear, cellMonth, dayNum);
    if(iso === todayISO) cell.classList.add('today');
    // Subtle-only cue (see .day-cell.past CSS) — past dates stay fully
    // navigable and their events stay fully visible, nothing is disabled.
    if(iso < todayISO) cell.classList.add('past');

    const events = (byDate[iso]||[]).filter(e=>matchesFilters(e));
    if(events.length) cell.classList.add('hasEvents');

    const num = document.createElement('div');
    num.className = 'daynum';
    num.append(document.createTextNode(dayNum));
    if(iso === todayISO){
      const todayLabel = document.createElement('span');
      todayLabel.className = 'today-label';
      todayLabel.textContent = '● TODAY';
      num.appendChild(todayLabel);
    }
    cell.appendChild(num);

    if(events.length){
      const count = document.createElement('div');
      count.className = 'day-count';
      count.innerHTML = `<span class="dot"></span>${events.length} EVENT${events.length===1?'':'S'}`;
      cell.appendChild(count);
    }

    const showMax = 3;
    events.slice(0,showMax).forEach(e=>{
      const pill = document.createElement('div');
      pill.className = 'pill';
      pill.innerHTML = `<span class="sw" style="background:${CATS[e.cat].color}"></span><span class="t">${escapeHtml(e.title)}</span>`;
      cell.appendChild(pill);
    });
    if(events.length > showMax){
      const more = document.createElement('div');
      more.className = 'more-link';
      more.textContent = `+${events.length - showMax} more`;
      cell.appendChild(more);
    }

    // Keyboard/screen-reader access — previously a plain unfocusable <div>
    // with only a click handler, so the whole calendar grid was unreachable
    // by keyboard. Each cell is now a real interactive control: focusable,
    // labeled with its date + event count, and Enter/Space-operable.
    cell.tabIndex = 0;
    cell.setAttribute('role', 'button');
    const dayLabel = new Date(iso+"T12:00:00").toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    const countLabel = events.length ? `, ${events.length} event${events.length===1?'':'s'}` : ', no events';
    cell.setAttribute('aria-label', dayLabel + countLabel + (iso===todayISO ? ' (today)' : ''));
    const openDay = ()=>{ selectedDate = iso; showDayPanel(iso); };
    cell.onclick = openDay;
    cell.onkeydown = (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDay(); }
    };
    grid.appendChild(cell);
  }
}

// Escapes text before it's interpolated into innerHTML. Needed because some
// event fields (title, venue, city, note, source, ticketUrl) can originate
// from venue/organizer submissions via submit.html — untrusted input that
// reaches this page after admin approval. Without this, a submitted title
// like "<img src=x onerror=alert(1)>" would execute in every visitor's
// browser once approved. Same pattern already used in admin.html.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Only allow http(s) links into href attributes. Blocks javascript: URLs and
// similar schemes that would otherwise let a submitted "ticket link" execute
// code on click instead of just navigating.
function safeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(url, window.location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  } catch {
    return '';
  }
}

// Real pricing only — never fabricated or inferred (approved: existing
// price_from data may now be surfaced). FREE keeps rendering exactly as
// before, from the database's own is_free flag. A price only renders when
// the event isn't free AND price_from is a genuine positive number —
// null/undefined/zero-with-not-free is treated as unavailable or
// ambiguous and simply omitted, never shown as "$0".
function fmtPrice(n){
  const rounded = Math.round(n*100)/100;
  const str = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2);
  return `$${str}+`;
}
// Plain right-aligned label (not a colored pill) — matches the mockup's
// clean category/price column. Category keeps its own site-wide color
// (see CATS), price/free stays plain ink so it doesn't visually compete.
function priceTag(e){
  if(e.free) return '<div class="evt-price free">Free</div>';
  if(typeof e.priceFrom === 'number' && isFinite(e.priceFrom) && e.priceFrom > 0){
    return `<div class="evt-price">${escapeHtml(fmtPrice(e.priceFrom))}</div>`;
  }
  return '';
}

function showDayPanel(iso){
  const panel = document.getElementById('dayPanel');
  const events = (byDate[iso]||[]).filter(e=>matchesFilters(e));
  const dateObj = new Date(iso+"T12:00:00");
  const label = dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  if(!events.length){
    panel.innerHTML = `<h2>${label} <button onclick="closeDayPanel()">Close ✕</button></h2><div class="empty-state">${emptyStateMessage()}</div>`;
  } else {
    panel.innerHTML = `<h2>${label} <button onclick="closeDayPanel()">Close ✕</button></h2>` +
      events.map(e=>`
        <div class="evt-row">
          <div class="evt-time">${escapeHtml(e.time)||''}</div>
          <div class="evt-main">
            <div class="evt-title">${escapeHtml(e.title)}</div>
            <div class="evt-venue">${escapeHtml(e.venue)}${e.city?` — ${escapeHtml(e.city)}`:''}${e.source?` <span class="src">via ${escapeHtml(e.source)}</span>`:''}</div>
            ${e.note?`<div class="note">${escapeHtml(e.note)}</div>`:''}
            ${e.ticketUrl && safeUrl(e.ticketUrl)?`<a class="evt-link" href="${escapeHtml(safeUrl(e.ticketUrl))}" target="_blank" rel="noopener noreferrer">${e.free?'More info':'Tickets &amp; info'}</a>`:''}
          </div>
          <div class="evt-side">
            <div class="evt-cat" style="color:${CATS[e.cat].color}">${CATS[e.cat].label}</div>
            ${priceTag(e)}
          </div>
        </div>
      `).join('');
  }
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function closeDayPanel(){ document.getElementById('dayPanel').classList.remove('show'); selectedDate=null; }

// dateList, if provided, is an explicit array of ISO date strings to render
// instead of every day in current's month — needed for "This Weekend", which
// can span a month boundary (e.g. Fri Jan 30 → Sun Feb 1) that a plain
// daysInMonth loop over `current` alone wouldn't catch.
function renderList(dateList){
  const el = document.getElementById('listView');
  const y = current.getFullYear(), m = current.getMonth();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const isos = dateList && dateList.length
    ? dateList
    : Array.from({length: daysInMonth}, (_,i)=> toISO(y,m,i+1));
  let html = '';
  let any = false;
  for(const iso of isos){
    const events = (byDate[iso]||[]).filter(e=>matchesFilters(e));
    if(!events.length) continue;
    any = true;
    const label = new Date(iso+"T12:00:00").toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    html += `<div class="list-day-group"><div class="list-day-heading">${label}</div>` +
      events.map(e=>`
        <div class="evt-row">
          <div class="evt-time">${escapeHtml(e.time)||''}</div>
          <div class="evt-main">
            <div class="evt-title">${escapeHtml(e.title)}</div>
            <div class="evt-venue">${escapeHtml(e.venue)}${e.city?` — ${escapeHtml(e.city)}`:''}${e.source?` <span class="src">via ${escapeHtml(e.source)}</span>`:''}</div>
            ${e.note?`<div class="note">${escapeHtml(e.note)}</div>`:''}
            ${e.ticketUrl && safeUrl(e.ticketUrl)?`<a class="evt-link" href="${escapeHtml(safeUrl(e.ticketUrl))}" target="_blank" rel="noopener noreferrer">${e.free?'More info':'Tickets &amp; info'}</a>`:''}
          </div>
          <div class="evt-side">
            <div class="evt-cat" style="color:${CATS[e.cat].color}">${CATS[e.cat].label}</div>
            ${priceTag(e)}
          </div>
        </div>
      `).join('') + `</div>`;
  }
  el.innerHTML = any ? html : `<div class="empty-state">${emptyStateMessage(dateList ? null : fmtMonth(current))}</div>`;
}

// The homepage's real, always-on stat (approved: homepage defaults to
// TODAY). Per the mockup, this is a fixed "N things happening this week in
// the Detroit Orbit" count rather than an inline preview of individual
// events — deliberately independent of whenMode/selectedDate AND of
// activeCats/freeOnly/query, so it reads as a constant pulse of the whole
// city rather than a number that shrinks as someone narrows their own
// filters below. Scoped to the current Monday-Sunday week rather than just
// today (2026-08-26: too few events land on any single day yet for a
// same-day count to read as a real number — revisit narrowing this back to
// today once daily volume no longer needs the wider window). Real count,
// from real data (byDate + isInDetroitOrbit + getCalendarWeekDates) — never
// fabricated.
function renderHeroToday(){
  const el = document.getElementById('heroToday');
  if(!el) return;
  const weekDates = getCalendarWeekDates();
  const count = weekDates.reduce((total, iso) =>
    total + (byDate[iso]||[]).filter(e=>!isBlockedEvent(e) && isInDetroitOrbit(e)).length
  , 0);

  el.innerHTML = `
    <div class="hero-stat-number">${count}</div>
    <div class="hero-stat-caption">${count === 1 ? 'Thing' : 'Things'} happening this week in the Detroit Orbit.</div>
    <button type="button" class="hero-stat-cta" onclick="viewThisWeek()">View all events &rarr;</button>
    <div class="hero-stat-orbit">Detroit Orbit &middot; up to 75 miles across 2 states &amp; 2 countries</div>
  `;
}

// "View all events" from the hero stat: rather than jumping to a single
// day's panel (the stat itself now spans 7 days), this clears any date/when
// narrowing and drops into List view — the one view that reads several days
// chronologically — so what the user sees lines up with what the number
// just told them, without touching their category/free/search filters.
function viewThisWeek(){
  selectedDate = null;
  whenMode = null;
  const t = new Date(getTodayISO()+"T12:00:00");
  current = new Date(t.getFullYear(), t.getMonth(), 1);
  updateWhenButtons();
  document.getElementById('listViewBtn').onclick();
}

// ---- Homepage sidebar: View Calendar / Near You / Free Today ----
// Approved per-module (see FINAL IMPLEMENTATION DIRECTIVE amendments):
// bookmark/save stayed rejected; these three were explicitly greenlit,
// each backed by real data the same way the hero stat and month grid
// already are — no fabricated counts like the mockup's placeholder figures.

function renderSidebar(){
  renderViewCalendarCard();

  renderFreeTodayCard();
}

const VC_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// A single real week (Mon-Sun, via getCalendarWeekDates()) — not a full
// month grid — per "have it focused on the week that we are on... show the
// same amount of calendar as in the mock." Counts respect the visitor's own
// active filters (category/free/search/location), same as the month grid
// cells they mirror, so this reads as a live mini-nav, not a second static
// stat. Each day links to the dedicated calendar page.
function renderViewCalendarCard(){
  const el = document.getElementById('viewCalendarCard');
  if(!el) return;
  const todayIso = getTodayISO();
  const weekDates = getCalendarWeekDates();
  const cells = weekDates.map(iso=>{
    const d = new Date(iso+"T12:00:00");
    const count = (byDate[iso]||[]).filter(e=>matchesFilters(e)).length;
    const isToday = iso === todayIso;
    return `<a class="vc-day${isToday ? ' today' : ''}" href="calendar.html?date=${iso}" aria-label="${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}, ${count} event${count===1?'':'s'}">
      <span class="vc-dow">${VC_DOW[d.getDay()]}</span>

    </div>
    <p class="side-card-sub">This week</p>
    <div class="vc-week">${cells}</div>
  `;
}

// Defaults to Downtown Detroit + 25mi until the visitor sets a real
// location via the Where control, then switches to whatever they chose
// (their radius, or 75mi if they picked "Detroit Orbit"/left it unset).
function getNearYouOrigin(){
  if(originLocation){
    const miles = (radiusMiles === 'all' || radiusMiles === null) ? 75 : radiusMiles;
    return {name: originLocation.name, lat: originLocation.lat, lng: originLocation.lng, miles};
  }
  const downtown = LOCATIONS.find(l => l.name === 'Downtown');
  return {name: 'Downtown Detroit', lat: downtown.lat, lng: downtown.lng, miles: 25};
}

function renderNearYouCard(){
  const el = document.getElementById('nearYouCard');
  if(!el) return;
  const origin = getNearYouOrigin();
  const todayIso = getTodayISO();
  let count = 0;
  Object.keys(byDate).forEach(iso=>{
    if(iso < todayIso) return;
    count += byDate[iso].filter(e=>!isBlockedEvent(e) && isWithinRadius(e, origin.lat, origin.lng, origin.miles)).length;
  });
  el.innerHTML = `
    <div class="side-card-head"><h2>Near You</h2></div>
    <div class="ny-radar" aria-hidden="true">
      <span class="ny-ring ny-ring-1"></span>
      <span class="ny-ring ny-ring-2"></span>
      <span class="ny-ring ny-ring-3"></span>
      <span class="ny-dot"></span>
    </div>
    <p class="side-card-sub">Within ${origin.miles} mi of ${escapeHtml(origin.name)}</p>
    <div class="side-card-number">${count}</div>
    <p class="side-card-caption">upcoming event${count === 1 ? '' : 's'}</p>
    <button type="button" class="side-card-cta" onclick="viewNearby()">View nearby &rarr;</button>
  `;
}

// Applies the same default (or the visitor's own chosen origin/radius, if
// already set) as a real filter and drops into List view — the card's

}

function renderFreeTodayCard(){
  const el = document.getElementById('freeTodayCard');

  const todayIso = getTodayISO();
  const count = (byDate[todayIso]||[]).filter(e=>!isBlockedEvent(e) && e.free && isInDetroitOrbit(e)).length;
  el.innerHTML = `
    <div class="side-card-head"><h2>Free Today</h2></div>
    <div class="side-card-number">${count}</div>

    <button type="button" class="side-card-cta" onclick="viewFreeToday()">View free events &rarr;</button>
  `;
}

function viewFreeToday(){

}

// Shared empty-state copy for both the list and day-panel views. Per the
// brief: never a dead end — always paired with concrete actions to widen
// the search, not just a flat "nothing here."
function emptyStateMessage(scopeLabel){
  const actions = [];
  if(whenMode) actions.push(`<button type="button" class="es-action" onclick="clearAllFilters()">Clear all filters</button>`);
  if(originLocation && radiusMiles !== 'all' && radiusMiles !== null) actions.push(`<button type="button" class="es-action" onclick="expandRadius()">Expand radius</button>`);
  if(activeCats.size < Object.keys(CATS).length) actions.push(`<button type="button" class="es-action" onclick="activeCats=new Set(Object.keys(CATS));buildFilterBar();render();">Show all categories</button>`);
  if(query) actions.push(`<button type="button" class="es-action" onclick="query='';document.getElementById('search').value='';render();">Clear search</button>`);
  const scope = scopeLabel ? ` in ${escapeHtml(scopeLabel)}` : '';
  return `Nothing on the signal here${scope}.` + (actions.length ? `<div class="es-actions">${actions.join('')}</div>` : '');
}

function render(){

// ---- Discovery bar (time-range shortcuts) ----

function updateWhenButtons(){
  document.querySelectorAll('.when-btn').forEach(btn=>{

function activateWhen(key){
  if(key === 'date'){
    // "Date" isn't a filter of its own — it just clears any active time
    // shortcut and returns to ordinary free browsing of the calendar.
    whenMode = null;
    selectedDate = null;
    updateWhenButtons();
    render();
    closeSheet(); // no-op on desktop / when no sheet is open
    return;
  }

  whenMode = key;
  const todayIso = getTodayISO();

  if(key === 'weekend'){

    selectedDate = todayIso;
  }

  updateWhenButtons();

document.querySelectorAll('.when-btn').forEach(btn=>{

});

// BROWSE (header nav) — the unfiltered, see-everything shortcut: clears
