<style>
  :root{
    /* Detroit Signal V2 — locked color architecture */
    --bg:#0A0A0A;          /* asphalt — primary dark environment */
    --panel:#202020;       /* charcoal — raised surface: cards, panels */
    --panel-alt:#161616;   /* slightly recessed surface: strip headers, muted rows */
    --panel-hover:#272727;
    --ink:#F2F0E8;         /* warm white — primary text */
    --ink-soft:#A9AAA3;    /* concrete — secondary/metadata text */
    --ink-dim:#5c5d58;     /* dim concrete — otherMonth / disabled text */
    --line:#2c2c2c;
    --line-soft:#212121;
    --accent:#D7FF00;      /* signal chartreuse — state only: live, selected, active */
    --on-accent:#0A0A0A;   /* required dark text/icon color on chartreuse fills */
    --today:rgba(215,255,0,.09);
    --today-ring:#D7FF00;
    /* Structural containers use a hard edge (0) rather than a soft rounded
       corner — a direct, deliberately conservative move toward the Detroit
       Signal concept board's rectilinear, editorial-broadcast language.
       Scoped to this single token: every var(--radius) consumer is a
       structural chrome container (.notice, #search, #listView), not an
       interactive pill/chip/badge, so this doesn't touch
       any control's tap-target shape or affordance. */
    --radius:0px;

    /* Event Type palette — "UV signal" set (2026-08-26): Jody asked to keep
       per-category color for scanability, restyled as a cohesive family of
       saturated blacklight-poster neons rather than the old grab-bag of
       hues, so it reads as on-brand next to the chartreuse accent instead of
       competing with it. Kept clear of chartreuse's own yellow-green band. */
    --c-music:#5B3EFF;    /* electric indigo */
    --c-theatre:#FF6A00;  /* neon orange */
    --c-dance:#FF2ECC;    /* neon magenta */
    --c-visual:#00E5FF;   /* electric cyan */
    --c-museum:#00FFA6;   /* UV spring-teal */
    --c-family:#FFC400;   /* neon amber */
    --c-fest:#FF2D55;     /* neon crimson */
    --c-food:#9D00FF;     /* UV violet */
    --c-film:#2979FF;     /* electric blue */
    --c-night:#E100FF;    /* UV fuchsia */
    --c-sports:#FF3B3B;   /* neon scarlet */
    --c-community:#3DFF6E; /* neon green */
    --c-vendor:#39FF14;   /* radioactive lime — vendor & craft markets, flea markets, oddities shows */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button{font-family:inherit;}
  /* Visible keyboard-only focus ring (not shown on mouse click) across every
     interactive control added/converted for the Chunk 4 accessibility pass —
     chartreuse matches the brand's existing "state" usage (today ring,
     live badge), not decoration. */
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.4;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:14px 20px 48px;}

  header.site{
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;flex-wrap:wrap;
    padding-bottom:10px;margin-bottom:10px;border-bottom:2px solid var(--ink);
  }
  /* Primary nav (Tomorrow/This Weekend/Calendar/Browse) — plain uppercase
     text links, not the bordered-chip look .when-btn has elsewhere on the
     page. The class is still .when-btn for the 2 time-range items (so they
     ride the existing activateWhen()/updateWhenButtons() wiring); this
     scoped override just restyles them to match the nav bar visually. */
  .site-nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap;row-gap:8px;}
  .site-nav .when-btn, .site-nav-link{
    border:none;background:none;padding:0 0 4px;border-radius:0;
    font-family:'Inter',-apple-system,sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;color:var(--ink-soft);text-decoration:none;cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  .site-nav .when-btn:hover, .site-nav-link:hover{color:var(--ink);}
  /* 2026-08-28 fix: same nav-highlight bug found and fixed on calendar.html
     — .when-btn.active (below, ~line 3616) sets background/border-color for
     the boxy discovery-bar chip treatment elsewhere on the page. This
     nav-scoped rule only overrode color/border-bottom-color, so a nav item
     (Today/Tomorrow/This Weekend) picked up that chip's cream background
     and full border-color with nothing here to stop it — no specificity
     fight even needed, since whichever rule sets a given property wins by
     default when only one of them sets it. Result: a solid pale box behind
     chartreuse text in the nav, instead of the plain text-link look
     .site-nav-link.current already has correctly. Explicitly resetting
     background/border-color here makes this rule fully self-contained. */
  .site-nav .when-btn.active{background:none;color:var(--accent);border-color:transparent;border-bottom-color:var(--accent);}
  /* Marks whichever nav link is the current page (e.g. Calendar, on
     calendar.html) — same visual treatment as an active time-range chip. */
  .site-nav-link.current{color:var(--accent);border-bottom-color:var(--accent);}
  /* Search icon (mockup parity) — opens/focuses the real search input that
     lives at the end of the When/Where/Category trigger row (moved there
     2026-08-27), rather than duplicating a second search field up here. No
     new search logic, just a shortcut to the existing one. */
  .nav-search-btn{
    border:none;background:none;padding:0;color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;
  }
  .nav-search-btn:hover{color:var(--ink);}
  .nav-search-btn svg{display:block;width:18px;height:18px;}
  @media (max-width:900px){
    .site-nav{gap:14px;order:3;flex-basis:100%;}
  }
  header.site h1{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:30px;margin:0 0 4px;letter-spacing:-0.01em;text-transform:uppercase;
  }
  /* The locked tagline ("THE CITY IS ON.") gets its own oversized display
     treatment — same approved condensed grotesk already used for the
     wordmark/headings, no new font. This is a typographic-hierarchy change
     only: the words are unchanged (previously run into the description
     sentence in lowercase), just presented at the scale/weight the tagline
     is meant to carry as a locked brand asset, per the Detroit Signal
     concept board's typographic energy. */
  /* (No separate brand-dot here — the wordmark SVG itself already has a
     built-in chartreuse dot; adding another produced a visible double-dot.) */

  /* ---- Hero: photography + real TODAY data (replaces the removed
     prototype "What this is" notice — brand + live current-day activity,
     not explanatory copy). ---- */
  .hero{
    display:grid;grid-template-columns:.85fr 1.3fr 1fr;gap:0;
    background:var(--panel);border:1px solid var(--line);margin-bottom:10px;
    min-height:320px;
  }
  /* container-type here (not vw units) is deliberate: .hero-headline is a
     narrow slice (~27% at desktop) of a capped 1180px-max page, not the
     full viewport — sizing off raw viewport width (as the brief's
     "conceptual" clamp(72px,9vw,150px) literally suggests) overflows the
     actual column the moment the viewport is wider than ~1300px, since 9vw
     keeps growing while the column itself is capped. Sizing off the
     column's OWN inline size (cqw) scales the headline as large as the
     brief intends while automatically staying inside whatever width the
     3-col/stacked layout actually gives it at any breakpoint. */
  .hero-headline{padding:22px 20px;display:flex;flex-direction:column;justify-content:center;min-width:0;container-type:inline-size;}
  .hl-line{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:clamp(40px,26cqw,120px);line-height:.82;letter-spacing:-0.03em;
    text-transform:uppercase;color:var(--ink);
  }
  /* Detroit Signal breathing dot (Jody, 2026-08-27) — this IS the period on
     "IS ON" — there is deliberately no separate small static dot alongside
     it (that was tried and explicitly rejected: "no double periods"). This
     large pulse is the only dot in the headline, and it stays distinct from
     any small brand/status dot elsewhere in the header — those stay static.
     This is a deliberate, one-off brand exception representing "the city
     is on/alive/transmitting"
     — DO NOT copy this breathing animation onto category colors, filters,
     CTAs, neighborhood cards, or other small status dots; the site should
     not become full of pulsing chartreuse elements. Sized off the hero
     headline's own container width (cqw), same reasoning as .hl-line's
     font-size above, so it scales with the column rather than the viewport. */
  .hl-line-signal{display:flex;align-items:center;flex-wrap:wrap;gap:clamp(10px,4cqw,22px);}
  .hero-signal{
    --signal-size: clamp(60px, 22cqw, 108px);
    width:var(--signal-size);
    aspect-ratio:1;
    flex:0 0 auto;
    display:inline-block;
    background:var(--accent);
    border-radius:50%;
    transform-origin:center;
    box-shadow:
      0 0 18px rgba(215,255,0,.22),
      0 0 42px rgba(215,255,0,.12);
    animation: detroit-signal-breathe 5.2s cubic-bezier(.45,0,.55,1) infinite;
    will-change: transform, box-shadow;
  }
  /* Slow human breathing, not a notification pulse: ~5.2s cycle, peak just
     past halfway (56%), a slightly slower/asymmetric settle back to rest
     (72% -> 100%) so it doesn't read as a perfectly mechanical loop. Scale
     never exceeds ~1.14 — calm and organic, not a heartbeat or strobe. */
  @keyframes detroit-signal-breathe{
    0%{
      transform:scale(1);
      box-shadow:0 0 18px rgba(215,255,0,.20), 0 0 42px rgba(215,255,0,.10);
    }
    56%{
      transform:scale(1.14);
      box-shadow:0 0 30px rgba(215,255,0,.32), 0 0 72px rgba(215,255,0,.16);
    }
    72%{
      transform:scale(1.10);
    }
    100%{
      transform:scale(1);
      box-shadow:0 0 18px rgba(215,255,0,.20), 0 0 42px rgba(215,255,0,.10);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-signal{
      animation:none;
      transform:none;
      box-shadow:0 0 18px rgba(215,255,0,.20), 0 0 42px rgba(215,255,0,.10);
    }
  }
  .hero-photo{position:relative;overflow:hidden;background:var(--panel-alt);}
  .hero-photo picture, .hero-photo img{display:block;width:100%;height:100%;object-fit:cover;}
  /* Auto-rotating crossfade carousel (2026-08-28, Jody: "anyway to create a
     carousel that auto rotates?") — replaces the old one-random-photo-per-
     load version, which never changed again once a visit had loaded. All 4
     slides are stacked directly on top of each other via position:absolute
     so the fade is a pure opacity cross-dissolve with zero layout shift;
     see the script below the markup for the rotation logic and the
     preload-all-4 / prefers-reduced-motion reasoning. */
  .hero-photo-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;}
  .hero-photo-slide.is-active{opacity:1;z-index:1;}
  .hero-today{padding:20px 20px;display:flex;flex-direction:column;justify-content:center;min-width:0;container-type:inline-size;}
  /* "N things happening today in the Detroit Orbit" stat panel — a constant,
     site-wide pulse number (see isInDetroitOrbit()), distinct from the
     filtered calendar/list below it. Real count, never fabricated. Sized
     off the column's own inline size (cqw), same reasoning as .hl-line
     above — digits are narrower than "CITY" so this column has more
     headroom, but a fixed 4-digit count still needs to fit without
     overflowing the stat column at any breakpoint. */
  .hero-stat-number{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:clamp(48px,30cqw,116px);line-height:.85;color:var(--accent);margin-bottom:2px;
  }
  .hero-stat-caption{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;font-size:16.5px;
    text-transform:uppercase;line-height:1.18;letter-spacing:-.005em;color:var(--ink);margin-bottom:14px;
  }
  .hero-stat-cta{
    display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:none;
    border:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:14px;
  }
  .hero-stat-cta:hover{text-decoration:underline;}
  .hero-stat-orbit{font-size:12px;color:var(--ink-soft);line-height:1.45;}
  @media (max-width:980px){
    .hero{grid-template-columns:1fr 1.2fr;}
    .hero-headline{grid-column:1 / -1;order:1;padding-bottom:6px;}
    .hero-photo{order:2;}
    .hero-today{order:3;}
  }
  @media (max-width:720px){
    .hero{grid-template-columns:1fr;min-height:0;}
    .hero-photo{aspect-ratio:16/9;}
    .hero-headline{padding:18px 18px 4px;}
    .hero-today{padding:14px 18px 20px;}
  }

  /* Search moved into the When/Where/Category trigger row (Jody,
     2026-08-27) — it's the same "narrow the list" family as those three, and
     the separate bordered .controls panel that used to hold it alone was
     just dead vertical space. On desktop/tablet it sits as a 4th item in the
     same flex row with extra grow (it needs more room to type in than a
     fixed-value trigger label does); below 720px, where the three triggers
     are already squeezed to compact pills, it drops to its own full-width
     line via flex-basis:100% instead of getting squeezed into a quarter-width
     sliver too small to comfortably type in on a phone. */
  #search{
    border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-size:13.5px;
    min-width:200px;flex:2 1 220px;
    background:var(--panel-alt);color:var(--ink);
  }
  #search::placeholder{color:var(--ink-dim);}

  /* Discovery bar — time-range shortcuts. Deliberately styled like the
     existing chip controls (ink-on-active, not chartreuse) —
     the brief is explicit that Signal stays scarce and controls need
     conventional usability, not brand theatrics. */
  .discovery-bar{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
  }
  .when-btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    border-radius:var(--radius);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .when-btn:hover{background:var(--panel-hover);}
  .when-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .when-date-picker{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink-soft);border-radius:var(--radius);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .when-date-picker.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .when-date-picker input[type="date"]{
    border:none;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;max-width:130px;
  }
  .when-date-picker input[type="date"]::-webkit-calendar-picker-indicator{
    /* The site is dark-themed throughout with no light mode — the browser's
       default calendar-icon glyph is black and invisible against the dark
       panel background otherwise. */
    filter:invert(1);cursor:pointer;
  }
  /* From/To pair (2026-08-26 [sic 2026-08-27]): two plain .when-date-picker
     boxes side by side on desktop. Both are native <input type="date">
     controls specifically because a touchscreen's own native date wheel/
     calendar is what someone with "stumpy fingers on a handset" already
     knows how to drive — a custom range-calendar widget would need much
     larger deliberately-spaced tap targets to be as usable, for no real
     gain here. */
  .when-date-range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .when-date-optional{color:var(--ink-dim);font-weight:500;text-transform:none;letter-spacing:0;}
  @media (max-width:480px){
    /* Stacked full-width rather than shrinking two side-by-side boxes down
       to where the date text itself gets cramped on a small phone screen. */
    .when-date-range{flex-direction:column;align-items:stretch;}
    .when-date-picker{justify-content:space-between;}
  }

  /* "Showing N events ___" heading above the list — only appears when a
     specific scope (this week, this weekend, a picked date/range, a
     neighborhood, or All Upcoming) is active, per currentListMeta(); the
     plain default view has no heading here — see .list-scope-note below for
     what it gets instead. */
  .list-count-heading{
    font-family:'Inter',-apple-system,sans-serif;font-size:13px;font-weight:700;
    color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;
  }
  /* The plain default view's own boundary disclosure (P0, 2026-08-28
     product audit Gap 2/8: the 30-day rolling window used to be silent —
     nothing told a visitor there even WAS a cutoff, let alone how to see
     past it). Deliberately a plain inline note, not another .es-action
     chip — this isn't an empty-state recovery action, it's a standing,
     always-there disclosure on an otherwise-populated list. */
  .list-scope-note{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .list-scope-note button{
    font:inherit;background:none;border:none;color:var(--accent);font-weight:700;
    cursor:pointer;padding:0;
  }
  .list-scope-note button:hover{text-decoration:underline;}

  /* Active-filter tray — one visible summary of whatever is currently
     narrowing the event universe (time-range shortcut, free-only, search
     text, a narrowed category set), each independently removable, per the
     brief's "filter state must never be invisible" requirement. */
  .active-filters{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;
  }
  .af-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .af-chip{
    display:flex;align-items:center;gap:6px;background:var(--panel-alt);border:1px solid var(--line);
    border-radius:var(--radius);padding:5px 8px 5px 12px;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .af-chip button{
    border:none;background:var(--panel-hover);color:var(--ink-soft);border-radius:50%;
    width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .af-chip button:hover{background:var(--ink);color:var(--bg);}
  .af-clear{
    border:1px solid #4a2a28;background:none;color:#e07a72;border-radius:var(--radius);padding:5px 12px;
    font-size:12.5px;font-weight:600;cursor:pointer;
  }

  .filters{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
  }
  .chip{
    border:1px solid var(--line);background:var(--panel-alt);border-radius:var(--radius);padding:6px 12px;
    font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink-soft);
    user-select:none;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  /* Selected/active state on every chip (Event Type dots included) is Signal
     Chartreuse — the one color that always means "this is on," independent
     of whichever per-category dot color the chip also carries. freeChip
     below keeps its own distinct green for the same reason "Free only"
     already had one before this pass. */
  .chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;}
  .chip.active .dot{outline:1.5px solid var(--on-accent);}
  .chip#freeChip.active{background:#3fbf6a;border-color:#3fbf6a;color:#06210f;}
  .chip#clearChip{color:#e07a72;border-color:#4a2a28;}

  /* Location + radius bar — Phase 1 Chunk 3. Same restrained styling as the
     discovery bar (ink-on-active, chartreuse reserved for state, not chrome). */
  .location-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;
  }
  .loc-control{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .loc-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .loc-combo{position:relative;min-width:200px;}
  #locInput{
    border:1px solid var(--line);border-radius:var(--radius);padding:8px 30px 8px 12px;font-size:13.5px;width:100%;min-width:200px;
    background:var(--panel-alt);color:var(--ink);
  }
  #locInput::placeholder{color:var(--ink-dim);}
  .loc-clear-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:none;background:var(--panel-hover);color:var(--ink-soft);border-radius:50%;
    width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;align-items:center;justify-content:center;display:flex;
  }
  .loc-clear-btn:hover{background:var(--ink);color:var(--bg);}
  .loc-suggestions{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;max-height:280px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .loc-item{
    padding:8px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .loc-item:last-child{border-bottom:none;}
  .loc-item:hover, .loc-item.hl{background:var(--panel-hover);}
  .loc-item-name{color:var(--ink);font-weight:600;}
  .loc-item-type{color:var(--ink-dim);font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
  .loc-empty{padding:10px 12px;font-size:12.5px;color:var(--ink-dim);}
  .loc-geo-btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:var(--radius);
    padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .loc-geo-btn:hover:not(:disabled){background:var(--panel-hover);}
  .loc-geo-btn:disabled{opacity:.6;cursor:default;}
  .radius-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .radius-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-right:2px;}
  .radius-chip{
    border:1px solid var(--line);background:var(--panel-alt);color:var(--ink-soft);border-radius:var(--radius);
    padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .radius-chip:hover{background:var(--panel-hover);}
  .radius-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* Calendar grid */
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
  .cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:0;background:var(--panel-alt);border-bottom:1px solid var(--line);}
  .cal-head div{padding:9px 0;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:0;}
  .day-cell{
    min-height:122px;min-width:0;overflow:hidden;
    border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    padding:6px 6px 8px;position:relative;cursor:pointer;background:var(--panel);
  }
  .day-cell:nth-child(7n){border-right:none;}
  .day-cell.otherMonth{background:var(--panel-alt);color:var(--ink-dim);}
  .day-cell.today{background:var(--today);box-shadow:inset 0 0 0 2px var(--today-ring);}
  .day-cell:hover{background:var(--panel-hover);}
  .day-cell.today:hover{background:var(--today);}
  .daynum{
    font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;margin-bottom:4px;color:var(--ink-soft);
    display:flex;align-items:baseline;gap:6px;
  }
  .day-cell.today .daynum{color:var(--accent);}
  /* Past dates stay fully clickable/legible — only the day number itself
     dims slightly as a temporal cue. Events, pills, and counts stay at full
     opacity so nothing reads as "disabled". Doesn't apply to .today, which
     has its own treatment, or otherMonth cells (already dimmed via panel-alt). */
  .day-cell.past:not(.today):not(.otherMonth) .daynum{opacity:.55;}
  .today-label{
    font-family:'Inter',sans-serif;font-size:9px;font-weight:800;letter-spacing:.05em;
    color:var(--accent);text-transform:uppercase;
  }
  .day-count{
    font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);
    margin-bottom:4px;display:flex;align-items:center;gap:4px;text-transform:uppercase;
  }
  .day-count .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;}

  /* ---- Homepage body layout: calendar/list + right-rail highlights ----
     The sidebar reverses an earlier-session "no right rail" call, but only
     for the three modules explicitly approved per-module (View Calendar,
     Near You, Free Today) — bookmark/save stays out per that same
     decision. Every number in these cards is real, computed the same way
     the month grid / hero stat already compute theirs — never fabricated
     counts like the mockup's placeholder figures. */
  .home-body{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;margin-bottom:10px;}
  .home-main{min-width:0;}
  .home-sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:14px;}
  .side-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .side-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .side-card-head h2{
    font-family:'Inter',-apple-system,sans-serif;font-size:12px;font-weight:800;
    text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:0;
  }
  .side-card-link{font-size:11.5px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;}
  .side-card-link:hover{text-decoration:underline;}
  .side-card-sub{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .side-card-number{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:34px;line-height:1;color:var(--accent);margin-bottom:2px;
  }
  .side-card-caption{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .side-card-cta{
    display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);
    background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  }
  .side-card-cta:hover{text-decoration:underline;}

  /* "On the Radar" sidebar widget (2026-08-28, Jody: "percolate to the user
     events that the press has covered") — reuses the same editorialByEvent
     data the inline "As seen in" links already load (see
     loadEditorialArticles()), no extra request. A plain list rather than
     another number/stat tile like the other three sidebar cards — the
     value here IS the specific events, not a count. Rows bleed to the
     card's own edges (negative margin canceling .side-card's padding) so
     each row's divider/hover state spans the full card width. */
  .radar-list{display:flex;flex-direction:column;margin:0 -16px -16px;}
  .radar-item{
    display:flex;gap:10px;align-items:flex-start;padding:10px 16px;
    text-decoration:none;color:inherit;border-top:1px solid var(--line-soft);
  }
  .radar-item:first-child{border-top:none;}
  .radar-item:hover{background:var(--panel-hover);}
  .radar-thumb{width:52px;height:52px;flex:0 0 auto;object-fit:cover;background:var(--panel-alt);}
  .radar-thumb-fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;font-size:20px;
    color:var(--accent);
  }
  .radar-item-body{min-width:0;}
  .radar-item-title{
    font-size:13px;font-weight:700;line-height:1.3;margin-bottom:2px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .radar-item-meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
  .radar-item-src{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);}

  /* View Calendar card: one real week row, not a full month — see the
     "same amount of calendar as in the mock" spec. Links out to the
     dedicated calendar page rather than duplicating month navigation. */
  .vc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .vc-day{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;
    border-radius:var(--radius);background:var(--panel-alt);text-decoration:none;
    color:var(--ink);border:1px solid transparent;
  }
  .vc-day:hover{background:var(--panel-hover);}
  .vc-day.today{border-color:var(--accent);background:var(--today);}
  .vc-dow{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);}
  .vc-num{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
  .vc-count{font-size:10px;font-weight:700;color:var(--accent);}

  /* "What's in your Detroit Orbit?" card (redesigned from "Near You", Jody
     2026-08-27) — decorative-only radar/orbit graphic: this project has zero
     real per-event coordinates (0% of venues/events have lat/lng), so this
     never plots real event positions. The count above/below it is real,
     city-level radius math (haversineMiles against CITY_LOOKUP), same method
     the Where/radius filter already uses. Rings fade with distance to read
     as orbital paths rather than a plain bullseye — tinted with the signal
     accent at low opacity (rather than the barely-there --line gray tried
     first, which read as too faint against the panel background) since
     these rings represent the live signal's own reach outward, not plain
     structural chrome. The .ny-ping element is a single "you are here"
     location pulse (radiates outward from the dot and fades, like a map pin
     ping) — deliberately a DIFFERENT motion (expand-and-fade-out, not
     scale-in-place) from the hero signal's breathing animation, per that
     animation's own one-off/no-reuse rule. Fixed at aspect-ratio:1 (rather
     than the card's own full width vs a flat fixed height, which is what
     the old "Near You" version did) so the rings render as true circles
     instead of the squashed ellipses that mismatch produced — width % and
     height % need the same base to actually look like circular orbit rings. */
  .ny-radar{position:relative;width:120px;max-width:100%;aspect-ratio:1;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;}
  .ny-ring{position:absolute;border:1.5px solid var(--line);border-radius:50%;}
  .ny-ring-1{width:38%;height:38%;border-color:rgba(215,255,0,.55);}
  .ny-ring-2{width:68%;height:68%;border-color:rgba(215,255,0,.35);}
  .ny-ring-3{width:100%;height:100%;border-color:rgba(215,255,0,.2);}
  .ny-ping{
    position:absolute;width:38%;height:38%;border-radius:50%;
    background:var(--accent);z-index:1;
    animation: ny-orbit-ping 2.8s cubic-bezier(0,0,.2,1) infinite;
  }
  @keyframes ny-orbit-ping{
    0%{transform:scale(.4);opacity:.45;}
    70%{transform:scale(2.6);opacity:0;}
    100%{transform:scale(2.6);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .ny-ping{animation:none;opacity:0;}
  }
  .ny-dot{position:relative;z-index:2;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px rgba(215,255,0,.15);}

  @media (max-width:980px){
    .home-body{grid-template-columns:1fr;}
    .home-sidebar{position:static;}
  }

  /* Explore Neighborhoods — a horizontal, scroll-snapping rail rather than a
     JS carousel: card width is set per breakpoint below and the browser's
     native scroll/snap handles "multiple visible on desktop, 2-3 on tablet,
     partial-next-card peek on mobile" (brief §23/§38) without any extra
     script. No per-neighborhood photography exists yet (checked
     /assets/photography — only 4 hero candidates + 7 general Detroit
     "free-selects", two of which happen to be Eastern Market but nothing
     for the other 40+ neighborhoods) — rather than mismatching a generic
     Detroit photo to the wrong neighborhood, or reusing one photo
     everywhere, these are deliberately photo-less typographic cards for
     now. Real photography can be layered in venue-by-venue later. */
  .neighborhoods-section{margin:18px 0 22px;}
  .neighborhoods-heading{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;font-size:15px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:0 0 10px;
  }
  .neighborhoods-rail{
    display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  }
  .neigh-card{
    flex:0 0 auto;scroll-snap-align:start;width:168px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;text-align:left;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;gap:2px;
  }
  .neigh-card:hover{background:var(--panel-hover);}
  .neigh-card.active{border-color:var(--accent);}
  .neigh-name{
    font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;
    color:var(--ink);line-height:1.25;margin-bottom:8px;
  }
  .neigh-count{
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:28px;line-height:1;color:var(--accent);
  }
  .neigh-count-label{font-size:11px;color:var(--ink-soft);}
  @media (max-width:640px){
    .neigh-card{width:78vw;max-width:280px;}
    .neighborhoods-rail{scroll-snap-type:x mandatory;}
  }

  .pill{
    font-size:10.8px;background:var(--panel-hover);color:var(--ink);border-radius:5px;padding:2px 5px;margin-bottom:3px;
    display:flex;align-items:center;gap:4px;min-width:0;max-width:100%;
  }
  .pill .sw{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .pill .t{min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .more-link{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:1px;}

  /* Event rows — matches the approved mockup's list treatment directly:
     oversized chartreuse time, plain right-aligned category/price column
     (no pill chips here — those stay in the filter bar/calendar dots),
     hairline dividers rather than boxed cards. No bookmark/save icon
     (stays rejected — see FINAL IMPLEMENTATION DIRECTIVE). One real
     deviation from the mock: no street address line under the venue name
     — venue_name_raw/venue_city_raw is all the data model actually has,
     no per-venue street address, so nothing is fabricated to fill that
     line. */
  .evt-row{
    display:grid;grid-template-columns:98px 1fr auto;gap:18px;align-items:start;
    padding:16px 0;border-top:1px solid var(--line-soft);
  }
  .evt-row:first-of-type{border-top:none;}
  /* Chartreuse + oversized, per the mock — a deliberate reversal of this
     project's earlier "accent is state-only" rule, made because Jody asked
     directly to match the mock's row treatment. Plain text rather than a
     split number/AM-PM (the mock's single "5:00 PM"): real event times
     here are often ranges ("11:00 AM–3:00 PM") or non-numeric ("Evening",
     "Varies"), which a stylized split can't safely parse. */
  .evt-time{
    grid-column:1;
    font-family:'Archivo Narrow',-apple-system,sans-serif;font-weight:800;
    font-size:16.5px;line-height:1.3;color:var(--accent);padding-top:1px;
  }
  .evt-time:empty{display:none;}
  /* Explicit grid-column pins on all three children — required because
     .evt-time can be display:none (see :empty rule above) when an event has
     no time_display. CSS Grid auto-placement skips display:none items and
     re-flows the REMAINING items into the earliest open columns, so without
     these pins .evt-main would slide into the 98px time column and .evt-side
     into the 1fr column whenever a time is missing — squeezing the title
     into a ~98px-wide strip (causing severe multi-line wrapping) and
     cramming the actions row too. Pinning columns keeps layout stable
     regardless of which items are present. */
  .evt-main{grid-column:2;min-width:0;}
  .evt-title{font-size:18px;font-weight:800;margin-bottom:4px;line-height:1.25;}
  /* Only wraps the title when the event has a real DB id — see
     editorialLinkHtml()'s comment for why FALLBACK_EVENTS (no id) can't
     link anywhere. Deliberately inherits the surrounding text color rather
     than looking like a conventional blue link — this is a title that
     happens to be clickable, not a navigation link in running text. */
  a.evt-title-link{color:inherit;text-decoration:none;}
  a.evt-title-link:hover{text-decoration:underline;}
  .evt-venue{font-size:13px;color:var(--ink-soft);line-height:1.4;}
  /* Short description excerpt (2026-08-28) — plain secondary text, not a
     link (the title above it is already the click target into event.html).
     line-clamp is a belt-and-suspenders visual safety net; truncateText()
     in JS already caps the string length before it ever reaches here, so
     this never depends on line-clamp support alone. */
  .evt-desc{
    font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .note{font-size:12px;color:#d1b34a;margin-top:6px;font-style:italic;}
  .src{font-size:11px;color:var(--ink-dim);font-style:italic;}
  .evt-link{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;
  }
  .evt-link:hover{text-decoration:underline;}
  .evt-link::after{content:'→';}
  /* "As seen in" press-mention callout (2026-08-27, redesigned 2026-08-28
     per Jody: "you barely notice it is there"). Originally a tiny italic
     link crammed into .evt-actions next to Tickets/Cal/Share — too subtle to
     notice. Now its own full-width line with a tinted background and accent
     left-border so it reads as a distinct piece of content (press coverage)
     rather than a buried secondary action, while still sitting below the
     description/note and above the actions row so it doesn't compete with
     the primary "Tickets & info" CTA for attention. */
  .evt-editorial-mention{
    display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:7px 10px;
    background:rgba(215,255,0,.07);border-left:3px solid var(--accent);
    text-decoration:none;max-width:100%;
  }
  .evt-editorial-mention:hover{background:rgba(215,255,0,.14);}
  .evt-editorial-mention .ei-tag{
    font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--accent);flex-shrink:0;
  }
  .evt-editorial-mention .ei-title{
    color:var(--ink);font-weight:600;font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .evt-editorial-mention .ei-src{
    color:var(--ink-soft);font-weight:600;font-size:12px;flex-shrink:0;
  }
  /* Row of secondary actions under the title/venue block — ticket link (if
     any), Add to Calendar, Share. Wraps on narrow widths rather than
     truncating or overlapping. */
  .evt-actions{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px;column-gap:14px;margin-top:9px;}
  .evt-cal{font-size:12px;font-weight:600;}
  .evt-cal a{color:var(--ink-soft);text-decoration:none;}
  .evt-cal a:hover{color:var(--ink);text-decoration:underline;}
  .evt-cal a + a::before{content:'· ';color:var(--ink-dim);}
  .evt-share{
    border:none;background:none;padding:0;font:inherit;font-size:12px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;
  }
  .evt-share:hover{color:var(--ink);text-decoration:underline;}
  .evt-share:disabled{color:#3fbf6a;cursor:default;}
  /* Right column: category (its own site-wide color, kept from the
     chip/dot system — the mock's plain gray text was tied to its own
     placeholder taxonomy, not this project's locked, color-coded one) and
     price/free stacked underneath, right-aligned. */
  .evt-side{grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;text-align:right;}
  .evt-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .evt-price{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .evt-price.free{color:#3fbf6a;}

  @media (max-width:640px){
    /* Time + category/price move above the title instead of framing it on
       either side — a three-column grid gets cramped fast on a narrow
       phone width. */
    .evt-row{grid-template-columns:1fr;gap:4px;padding:14px 0;}
    /* Reset the desktop grid-column pins back to the single mobile column —
       otherwise grid-column:2/3 would force extra implicit column tracks
       instead of stacking, and the order:* below would have no effect. */
    .evt-time{grid-column:1;order:1;}
    .evt-side{grid-column:1;order:2;flex-direction:row;align-items:baseline;gap:8px;text-align:left;}
    .evt-main{grid-column:1;order:3;}
  }

  /* List view */
  #listView{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px 20px;}
  .list-day-group{padding:14px 0;border-top:1px solid var(--line-soft);}
  .list-day-group:first-child{padding-top:0;border-top:none;}
  .list-day-heading{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .es-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .es-action{
    border:1px solid var(--line);background:var(--panel-alt);color:var(--ink);border-radius:var(--radius);
    padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .es-action:hover{background:var(--panel-hover);}

  footer.site{margin-top:26px;font-size:12px;color:var(--ink-soft);line-height:1.6;}
  footer.site a{color:var(--ink-soft);}
  footer.site p{margin:0 0 6px;}
  footer.site p:last-child{margin-bottom:0;}
  /* Footer + data-transparency amendment: a quiet, editorial link out to the
     full methodology/status page, styled as a small uppercase label rather
     than an inline sentence — the homepage stays slick, sources.html stays
     the transparent one. */
  footer.site .footer-sources a, footer.site .footer-social a{
    text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700;
    color:var(--ink-dim);text-decoration:none;
  }
  footer.site .footer-sources a:hover, footer.site .footer-social a:hover{color:var(--ink-soft);text-decoration:underline;}
  footer.site .footer-credit{font-size:11px;color:var(--ink-dim);}
  footer.site .footer-credit a{color:var(--ink-dim);text-decoration:underline;}

  @media (max-width:720px){
    .day-cell{min-height:78px;}
    .pill{display:none;}
    .more-link{display:none;} /* redundant once .day-count shows the total */
    #monthLabel{min-width:0;}
  }

  /* ---- Unified discovery row (Homepage Redesign pass) ----
     WHEN / WHERE / CATEGORY now render as one compact row of boxed
     triggers at every breakpoint — each shows its current value and, when
     clicked, expands the same underlying bar (same DOM/IDs/JS state that
     powered the old always-open three-row layout) rather than replacing it
     with new controls. Below 720px that expansion is the original fixed
     bottom sheet (unchanged, proven mobile pattern). At 721px+ it expands
     inline, directly under the trigger row, styled like a dropdown panel —
     no new filtering logic anywhere, purely a presentation change. */
  .discovery-shell{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;
  }
  .mobile-triggers{display:flex;gap:8px;flex-wrap:wrap;}
  .mobile-trigger{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-alt);color:var(--ink);
    border-radius:var(--radius);padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  }
  .mobile-trigger:hover{background:var(--panel-hover);}
  .mobile-trigger .mt-label{
    font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-dim);text-transform:uppercase;
  }
  .mobile-trigger .mt-sub{
    font-size:13px;font-weight:700;color:var(--ink-soft);max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .mobile-trigger .mt-sub::after{content:' \25be';font-size:10px;color:var(--ink-dim);} /* ▾ */
  .mobile-trigger.has-value{border-color:var(--accent);}
  .mobile-trigger.has-value .mt-sub{color:var(--ink);}
  .mobile-trigger[aria-expanded="true"]{background:var(--panel-hover);border-color:var(--ink);}

  .sheet-backdrop{display:none;}

  /* Panels are hidden until their trigger opens them, at every breakpoint —
     the always-open three-row layout they used to be is gone for good. */
  .discovery-bar, .location-bar, .filters{display:none;}
  .sheet-header{display:none;}
  .discovery-bar.sheet-active, .location-bar.sheet-active, .filters.sheet-active{
    display:flex;flex-direction:column;flex-wrap:nowrap;
    background:var(--panel-alt);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-top:10px;
  }
  .discovery-bar.sheet-active .sheet-header,
  .location-bar.sheet-active .sheet-header,
  .filters.sheet-active .sheet-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  }
  /* Once inside an open panel, the discovery/location/filter bars go back to
     being a normal wrapping row of chips — same look they always had. */
  .discovery-bar.sheet-active, .filters.sheet-active{flex-direction:row;flex-wrap:wrap;gap:8px;}
  .location-bar.sheet-active{flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center;}
  .sheet-close{
    border:none;background:var(--panel-hover);color:var(--ink);border-radius:50%;
    width:26px;height:26px;font-size:12px;cursor:pointer;line-height:1;
  }
  .sheet-close:hover{background:var(--ink);color:var(--bg);}

  /* Category (What) promoted back to default-visible on desktop — 2026-08-28
     P0 product-audit fix (Gap 1 / Finding 4: a visible filter widget got
     roughly 77% of filtering interactions vs. ~2% for a functionally
     identical hidden one in the cited research; the trigger-button pattern
     below is real, always-visible-labeled progress over a generic buried
     "Advanced Search" link, but it still hides the twelve category chips
     behind a click at every width). When/Where stay trigger-gated — a
     date-range picker and a location autocomplete genuinely need room, and
     reopening the old always-open three-row layout for all three would be a
     real redesign, not this targeted fix. Category is the one compact
     enough (chips only, no text input) to promote outright: it's shown as a
     plain wrapping row, not the boxed/bordered sheet-active panel treatment
     When/Where use, so it reads as "chips that were always there" rather
     than a dropdown left open. The matching Category trigger button is
     hidden in the same breakpoint below, since there's nothing left for it
     to open. Mobile (<=720px) is untouched — the sheet pattern is still
     right where a persistent chip row would cost too much space above the
     fold. */
  @media (min-width:721px){
    .filters{
      display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;
      margin-top:10px;
    }
    #filterTriggerBtn{display:none;}
  }

  @media (max-width:720px){
    .discovery-shell{padding:10px 10px 0;background:none;border:none;}
    .mobile-trigger{align-items:center;text-align:center;}
    .mobile-trigger .mt-label{display:none;} /* label redundant at this width — "Today"/"Detroit Orbit" already reads as the answer */
    #search{flex-basis:100%;min-width:0;}

    .sheet-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;
    }
    .sheet-backdrop.show{display:block;}

    .discovery-bar.sheet-active, .location-bar.sheet-active, .filters.sheet-active{
      flex-direction:column;flex-wrap:nowrap;
      position:fixed;left:0;right:0;bottom:0;z-index:40;
      border-bottom:none;
      border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);
      padding:16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height:75vh;overflow-y:auto;margin:10px 0 0;
    }
    /* Radius/location controls stack full-width inside the sheet rather
       than trying to fit the desktop's side-by-side row. */
    .location-bar.sheet-active .loc-control{flex-direction:column;align-items:stretch;}
    .location-bar.sheet-active .loc-combo{min-width:0;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <div>
      <h1><a href="/" aria-label="313.events — back to today" style="display:flex;align-items:center;text-decoration:none;">
        <img src="/assets/wordmark.svg" alt="313.events" height="26" style="display:block;">
      </a></h1>
    </div>
    <nav class="site-nav" aria-label="Time range and browse">
      <!-- Tomorrow/This Weekend reuse the existing .when-btn/data-when/
           activateWhen() machinery (see the discovery bar's own Tomorrow/
           This Weekend/date-range controls below) — clicking these keeps
           them in sync via the shared updateWhenButtons(), since both sets
           share the .when-btn class.
           "Now" was removed here (2026-08-27, Jody's call) as redundant with
           the page's default today-onward view. "Today" was removed at the
           same time, then explicitly restored (2026-08-27, later same day)
           top-nav-only, deliberately NOT re-added to the When sheet/filter
           section — it's a pure "bring the list into focus" jump-to-list
           shortcut (viewToday(), see script below), not a filter control, so
           it doesn't use the .when-btn/data-when wiring and never shows as
           an active-filter chip.
           "Tonight" was also removed 2026-08-27 (swapped for Tomorrow), then
           restored 2026-08-28 as a P0 product-audit fix — see the
           WHEN_LABELS comment in the script below for the full reasoning. -->
      <button type="button" class="site-nav-link" id="todayNavBtn">Today</button>
      <button type="button" class="when-btn" data-when="tonight">Tonight</button>
      <button type="button" class="when-btn" data-when="tomorrow">Tomorrow</button>
      <button type="button" class="when-btn" data-when="weekend">This Weekend</button>
      <a class="site-nav-link" href="calendar.html">Calendar</a>
      <a class="site-nav-link" href="map.html">Map</a>
      <button type="button" class="site-nav-link" id="browseBtn">Browse</button>
    </nav>
    <div style="display:flex;align-items:center;gap:18px;">
      <button type="button" class="nav-search-btn" id="navSearchBtn" aria-label="Search events and venues">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
      </button>
      <a href="submit.html" style="display:inline-block;background:none;border:1.5px solid var(--accent);color:var(--accent);text-decoration:none;font-family:'Inter',-apple-system,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:8px 16px;border-radius:var(--radius);white-space:nowrap;">Submit Event</a>
    </div>
  </header>

  <section class="hero" id="heroSection">
    <div class="hero-headline">
      <div class="hl-line">THE</div>
      <div class="hl-line">CITY</div>
      <div class="hl-line hl-line-signal"><span class="hl-text">IS ON</span><span class="hero-signal" aria-hidden="true"></span></div>
    </div>
    <div class="hero-photo" id="heroPhoto"><!-- populated by the carousel script below --></div>
    <div class="hero-today" id="heroToday"><!-- populated by renderHeroToday() --></div>
  </section>
  <script>
  (function(){
    // Auto-rotating hero photo carousel (2026-08-28, Jody: "anyway to create
    // a carousel that auto rotates?"). The previous version picked ONE of
    // these four photos at random per page load and left it static for the
    // rest of the visit — this instead rotates through all four on a slow
    // crossfade while the page stays open. Jody's calls: preload all 4 up
    // front (smoother crossfades are worth the extra initial bandwidth vs.
    // lazy-loading each one right before its turn) and an ~8s, slow-fade
    // rotation rather than a hard cut.
    var HERO_PHOTOS = [
      { file:'A', w:2400, h:1350, alt:'A packed outdoor festival crowd at night, with the Detroit skyline and the lit Renaissance Center towers behind the stage.' },
      { file:'B', w:2400, h:1350, alt:'A daytime festival crowd gathered along the Detroit riverfront on a rainy day, with the Renaissance Center towers in the background.' },
      { file:'C', w:2400, h:1350, alt:'A concert crowd at dusk, backlit by stage lights and video screens.' },
      { file:'D', w:1536, h:1024, alt:'A crowd throwing up rock horns as a silhouetted performer faces them under stage lights.' }
    ];
    var ROTATE_MS = 8000;
    var container = document.getElementById('heroPhoto');
    if(!container) return;

    // Random starting photo, same as the old behavior (a different photo
    // greets each fresh visit) — rotation then proceeds through all 4 in
    // order from there.
    var startIndex = Math.floor(Math.random() * HERO_PHOTOS.length);
    var slides = HERO_PHOTOS.map(function(photo, i){
      var picture = document.createElement('picture');
      picture.className = 'hero-photo-slide' + (i === startIndex ? ' is-active' : '');
      // Only the currently-visible slide is exposed to assistive tech —
      // aria-hidden on the rest keeps a screen reader from announcing 4
      // stacked photos as if they were all present at once.
      picture.setAttribute('aria-hidden', i === startIndex ? 'false' : 'true');
      var base = '/assets/photography/hero/313-events-homepage-hero-' + photo.file;
      var source = document.createElement('source');
      source.media = '(max-width:720px)';
      source.srcset = base + '-mobile.webp';
      picture.appendChild(source);
      var img = document.createElement('img');
      img.src = base + '.webp'; // all 4 requested immediately — preload-up-front is deliberate, see header note
      img.width = photo.w;
      img.height = photo.h;
      img.alt = photo.alt;
      img.loading = 'eager';
      if(i === startIndex) img.fetchPriority = 'high'; // only the first-visible slide competes for LCP priority
      picture.appendChild(img);
      container.appendChild(picture);
      return picture;
    });

    // Reduced-motion visitors get the old static-photo behavior (one random
    // photo, never rotating) rather than an auto-playing crossfade — same
    // posture already established for the hero signal dot and the Detroit
    // Orbit ping's own @media (prefers-reduced-motion: reduce) handling.
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var current = startIndex;
    setInterval(function(){
      var next = (current + 1) % slides.length;
      slides[current].classList.remove('is-active');
      slides[current].setAttribute('aria-hidden', 'true');
      slides[next].classList.add('is-active');
      slides[next].setAttribute('aria-hidden', 'false');
      current = next;
    }, ROTATE_MS);
  })();
  </script>

  <!-- Positioned directly under the hero, above the When/Where/Category filter bar. This is a
       discovery/browse aid (a second way in, alongside the hero) rather than a refinement of the
       filters below it — Jody's call, and it matches IA practice for "browse by X" entry points
       (see 2026-08-27 conversation): they read as a peer to the hero's primary path, not as part
       of the filter mechanism that acts on the list. -->
  <section class="neighborhoods-section" id="neighborhoodsSection" style="display:none;" aria-label="Explore by neighborhood">
    <h2 class="neighborhoods-heading">Explore Neighborhoods</h2>
    <div class="neighborhoods-rail" id="neighborhoodsRail"></div>
  </section>

  <div class="discovery-shell" id="discoveryShell">
    <div class="mobile-triggers" id="mobileTriggers">
      <button type="button" class="mobile-trigger" id="whenTriggerBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="discoveryBar">
        <span class="mt-label">When</span><span class="mt-sub" id="whenTriggerSub">Anytime</span>
      </button>
      <button type="button" class="mobile-trigger" id="whereTriggerBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="locationBar">
        <span class="mt-label">Where</span><span class="mt-sub" id="whereTriggerSub">Everywhere</span>
      </button>
      <button type="button" class="mobile-trigger" id="filterTriggerBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="filterBar">
        <span class="mt-label">Category</span><span class="mt-sub" id="filterTriggerSub">All types</span>
      </button>
      <input type="text" id="search" placeholder="Search events, venues, neighborhoods&hellip;">
    </div>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>

    <div class="discovery-bar" id="discoveryBar" role="group" aria-label="Jump to a time range">
      <div class="sheet-header"><span>When</span><button type="button" class="sheet-close" aria-label="Close">&#10005;</button></div>
      <button class="when-btn" data-when="tonight">Tonight</button>
      <button class="when-btn" data-when="tomorrow">Tomorrow</button>
      <button class="when-btn" data-when="weekend">This Weekend</button>
      <!-- All Upcoming (P0, 2026-08-28 product audit Gap 2) — the one
           explicit, one-click way to see the complete unfiltered catalog
           beyond the page's silent 30-day default window; see
           currentDateList()/matchesFilters() for what it actually changes. -->
      <button class="when-btn" data-when="all">All Upcoming</button>
      <!-- Expanded from a single "Pick a date" input into a From/To pair
           (Jody, 2026-08-27) so the same control handles both a single date
           and a date range, without adding a separate mode toggle. "To" is
           genuinely optional — leaving it blank keeps the old single-date
           behavior (whenMode 'date'); filling it in switches to a range
           (whenMode 'range'). Two native <input type="date"> fields stacked
           in a simple row/column (see .when-date-range CSS) rather than a
           custom calendar-range widget, on purpose — native date inputs are
           what a touchscreen keyboard already knows how to drive well, which
           matters given Jody's "stumpy fingers on a handset" requirement. -->
      <div class="when-date-range">
        <label class="when-date-picker" for="whenDateInput">
          <span>From</span>

// Great-circle distance in miles — matches the method used to derive
// SERVICE_AREA.md's own boundary table, so radius math stays consistent
// with the reasoning that document already documents.
function haversineMiles(lat1, lng1, lat2, lng2){
  const R = 3958.8;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}
