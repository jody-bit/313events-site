// Live, mutable working set. Starts as the fallback data; loadSupabaseEvents()
// below replaces its contents with the live database rows once fetched.
let EVENTS = FALLBACK_EVENTS.slice();

// Keyed by event id, populated by loadEditorialArticles() near the bottom of
// this script — declared up here (not next to that function) because the
// very first render() call happens synchronously during initial script
// execution, well before loadEditorialArticles() runs, and renderOnRadarCard()
// (called from every render() via renderSidebar()) reads this variable. A
// `let` declared down near that function would leave it in the temporal
// dead zone for every render() call made before the script reaches that
// line — first-load render() included — which throws, not just "shows an
// empty widget."
let editorialByEvent = {};
// Same TDZ reasoning applies to this constant — renderOnRadarCard() (below)
// reads it on every render() call, so it must exist before the first one.
const ON_RADAR_LIMIT = 5;

// True current+upcoming event total, straight from Supabase's own exact row
// count (see loadOrbitEventTotal() near the bottom of this script) — NOT
// EVENTS.length, which is capped at whatever the main list query's row limit
// happens to be (PostgREST defaults to 1000 rows per request with no
// `limit=` set, so EVENTS.length reads as a suspicious flat "1,000" well
// before the real total is that clean a number). null until that dedicated
// count request resolves; the Detroit Orbit widget falls back to a
// today-onward count of EVENTS in the meantime.
let orbitEventTotal = null;

// index by date
// expandDateRange (2026-09-02 audit fix): a multi-day event needs to appear
// in every day's list it actually spans, not just its start_date — see the
// endDate comment on mapSupabaseRow() for the bug this closes. Capped at
// MAX_SPAN_DAYS as a defensive guard against a garbage/typo end_date (e.g. a
// year pasted into the wrong field) silently exploding this into thousands
// of entries; a same-day event (the overwhelming majority) always takes the
// 1-iteration fast path.
const MAX_EVENT_SPAN_DAYS = 60;
function expandDateRange(startIso, endIso){
  if(!endIso || endIso <= startIso) return [startIso];
  const dates = [];
  let cur = new Date(startIso+"T12:00:00");
  const end = new Date(endIso+"T12:00:00");
  let guard = 0;
  while(cur <= end && guard < MAX_EVENT_SPAN_DAYS){
    const y = cur.getFullYear(), m = String(cur.getMonth()+1).padStart(2,'0'), d = String(cur.getDate()).padStart(2,'0');
    dates.push(`${y}-${m}-${d}`);
    cur.setDate(cur.getDate()+1);
    guard++;
  }
  return dates;
}
function addToByDate(target, e){
  expandDateRange(e.date, e.endDate).forEach(iso => { (target[iso] = target[iso]||[]).push(e); });
}

let byDate = {};
EVENTS.forEach(e=>{ addToByDate(byDate, e); });
Object.values(byDate).forEach(list=>list.sort((a,b)=> timeSortMinutes(a.time) - timeSortMinutes(b.time)));

// Relative to today's real date, not a hardcoded month — stays correct as
// soon as the calendar page turns rather than needing a code change. Uses
// local date components (not toISOString(), which is UTC) for the same
// reason the "today" highlight below does.
const _navToday = new Date();
const _navTodayMonthStart = new Date(_navToday.getFullYear(), _navToday.getMonth(), 1);
// Bounds how far out the When sheet's date-range picker will let someone
// pick (12 months) — see initWhenDatePicker(). The old month-paging system
// (prevBtn/nextBtn/monthLabel, plus a MIN_MONTH lower bound and a `current`
// page cursor) was removed 2026-08-27 — see currentDateList() for what
// replaced it.
const MAX_MONTH = new Date(_navTodayMonthStart.getFullYear(), _navTodayMonthStart.getMonth() + 12, 1);

// Hard content block: events matching any name on this list are excluded
// from every view (calendar, list, Today strip) regardless of source —
// checked against the event title and note/description, case-insensitively.
// This is a manual, always-on suppression list independent of the normal
// category/free/search/when filters. Add additional blocked names as
// simple strings.
const BLOCKED_NAMES = ["Augustus Williams"];
function isBlockedEvent(e){
  return BLOCKED_NAMES.some(name => {
    const n = name.toLowerCase();
    return (e.title && e.title.toLowerCase().includes(n)) ||
           (e.note && e.note.toLowerCase().includes(n));
  });
}

// Secondary "Features" filters (added 2026-08-28, from the Product Strategy
// & UX Audit doc's own data-completeness table in Section 7) — 313.events'
// own scoped, on-brand answer to the kind of Category/Region/Features
// filter set competitors like Metro Times expose. Deliberately NOT a
// wholesale copy of that: the audit's "Things We Should Not Build" section
// warns against a big always-visible filter expansion (Finding 5: most
// visitors touch only one or two filters), and its own Gap 6 reasoning
// gates any new filter on whether the underlying data can actually support
// it honestly. Each of these four maps to a column the audit's Section 7
// table already calls "solid" — ticket_url, image_url, and source are all
// populated reliably today, unlike cancellation status or a recurrence
// field, which the same table flags as incomplete/nonexistent and are
// deliberately left out of this set rather than filtering over mostly-null
// data. 'radar' (On the Radar) doubles as the audit's Gap 5/8 push to make
// the editorial-coverage integration more visible, not just a filter.
const FEATURE_CHIPS = [
  { key: 'tickets', label: 'Tickets available' },
  { key: 'photo', label: 'Has photo' },
  { key: 'submitted', label: 'Community submitted' },
  { key: 'radar', label: 'On the Radar' },
];

let activeCats = new Set(Object.keys(CATS));
let freeOnly = false;
// Zero or more of FEATURE_CHIPS' keys — AND'd together with every other
// filter dimension, same as freeOnly, rather than OR'd against each other:
// at the "one or two filters touched" usage level Finding 5 describes,
// AND-narrowing is simpler to reason about than a mixed AND/OR model and
// matches how freeOnly already behaves.
let activeFeatures = new Set();
let query = "";
// The homepage is List-only (the mockup's primary view) — there is no
// Month grid here at all. The full Month-grid experience lives on the
// separate calendar.html page, which keeps its own independent default.
// Active time-range shortcut from the discovery bar: null | 'tomorrow' |
// 'weekend' | 'date' | 'range' | 'thisweek'. Independent of category/free/
// search filters — see matchesFilters() below, which combines all of them.
//
// null ("no shortcut picked") is the resting state — "Browse" and "Reset
// filters" explicitly return here via clearAllFilters(). It is NOT the same
// as "no restriction at all": matchesFilters() always applies its own
// baseline floor+hour narrowing (today onward, and today's own past hours
// hidden) regardless of whenMode, so the list still "begins with NOW" by
// default without whenMode itself needing to fake-select a shortcut.
let whenMode = null;
// Only meaningful while whenMode === 'date' — the single ISO date chosen
// via the When sheet's date-picker "From" input.
let pickedDate = null;
// Only meaningful while whenMode === 'range' — both set, inclusive, when the
// From/To pair together form a date range rather than a single day. Kept as
// two separate globals (rather than reusing pickedDate for the start) so
// 'date' and 'range' modes can't be confused with each other in
// matchesFilters()/currentDateList().
let rangeStart = null;
let rangeEnd = null;
// Shared between renderActiveFilters() and updateMobileTriggers() — one
// definition so the two labels never drift out of sync with each other.
// 'date' and 'range' aren't listed here since their chip/trigger label is
// built from the actual picked date(s) at display time, not a fixed word.
// 'now'/'today' were removed 2026-08-27 (Jody: redundant once the homepage's
// own default view already opens on today) — 'thisweek' backs the hero's
// "View all events" link (see viewThisWeek()). 'tonight' was ALSO removed
// that same day (replaced with Tomorrow) but restored 2026-08-28 as part of
// the product audit's P0 list (Finding 2/15 — "what's on tonight" is a
// high-intent, time-sensitive question the homepage otherwise couldn't
// answer in one tap; only calendar.html had it). Worth reconsidering now
// specifically because the "hides too soon" bug that made the page's own
// default view unreliable for evening plans (an event vanishing from the
// list the moment its start hour passed, fixed earlier 2026-08-28) is what
// made a dedicated Tonight shortcut feel most redundant with the default
// view in the first place — that's fixed now, so Tonight earns its slot
// back. 'all' is the new P0 "All Upcoming" shortcut (Gap 2) — see
// currentDateList()/matchesFilters() for what it actually does.
const WHEN_LABELS = {tomorrow:'Tomorrow', tonight:'Tonight', weekend:'This Weekend', thisweek:'This Week', all:'All Upcoming'};
// Populated only while whenMode === 'weekend' — the 3 ISO dates (Fri/Sat/Sun)
// currently in scope. Recomputed each time weekend mode is (re)activated,
// not on every render, since "this weekend" only changes at midnight.
let cachedWeekendDates = [];
// originLocation: the chosen search-radius origin — {name, type, region,
// lat, lng} from LOCATIONS, or a geolocation-derived point (type:'here').
// null means no location filter is active at all.
let originLocation = null;
// radiusMiles: 5/10/25/50 (number) or 'all' — labeled "Detroit Orbit" in the
// UI, this is the widest tier and the default. It is NOT narrowed by
// whatever origin the user searched (that's what makes it the widest tier),
// but matchesFilters() still hard-caps it at 75 miles from Detroit's own
// city center specifically — the fixed definition of the Detroit Orbit
// boundary, per SERVICE_AREA.md — so results can never drift outside the
// site's real coverage area regardless of the chosen origin. A separate
// literal "75 mi" option (measured from the user's origin, like the other
// numeric tiers) used to exist alongside it, which was a redundant way of
// saying almost the same boundary twice; removed 2026-08-26 in favor of
// "Detroit Orbit" being the one Detroit-anchored 75-mile option. Only
// meaningful while originLocation is set.
let radiusMiles = null;

// Set by clicking a card in the Explore Neighborhoods rail. Deliberately an
// EXACT match against e.neighborhood (the same venues->neighborhoods lookup
// the rail's own counts are built from) rather than a radius/distance
// filter — so clicking "23 events in Corktown" always lands on exactly the
// 23 events that count came from, never a different number from a fuzzy
// proximity search.
let neighborhoodFilter = null;

function toISO(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

// Uses local date components (not toISOString(), which is UTC) — Detroit is
// UTC-4/-5, so late evening through midnight local time would otherwise
// read as tomorrow.
function getTodayISO(){
  const d = new Date();
  return toISO(d.getFullYear(), d.getMonth(), d.getDate());
}

function getTomorrowISO(){
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return toISO(d.getFullYear(), d.getMonth(), d.getDate());
}

// Best-effort parse of the free-text time_display field ("7:30 PM",
// "12:00–3:00 PM", "Evening", "3:00 & 7:00 PM"...) into a 24h hour number.
// This is a soft convenience signal for the NOW shortcut and the page's own
// baseline hour-narrowing (see matchesFilters()), not
// authoritative scheduling data — see DISCOVERY_PHASE1_AUDIT.md. For a
// range like "12:00–3:00 PM" this returns whichever time the regex finds
// first (often the end of the range, since the start half usually has no
// AM/PM of its own) — good enough to classify "roughly when", not precise
// enough for anything that needs a real start time. Returns null when
// nothing parseable is found; callers decide how to treat that.
// "This weekend" = the Friday/Saturday/Sunday currently in progress or the
// next upcoming one — never a weekend that's already fully over. Returns 3
// ISO date strings.
function getWeekendDates(){
  const d = new Date();
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const deltaToFriday = dow === 0 ? -2 : 5 - dow;
  const fri = new Date(d); fri.setDate(d.getDate() + deltaToFriday);
  return [0,1,2].map(off=>{
    const x = new Date(fri); x.setDate(fri.getDate()+off);
    return toISO(x.getFullYear(), x.getMonth(), x.getDate());
  });
}

// The current Monday-Sunday calendar week (per Jody: the week runs
// Monday-Sunday, not Sun-Sat and not a rolling 7-day-from-today window) —
// backs the hero's "N things happening this week" stat. Widened from a
// single-day count (2026-08-26) because on lighter data days "today" alone
// reads as too thin a number; a full week gives a steadier, still-real count
// while more sources get added. Revisit narrowing this back to today once
// daily volume no longer needs the wider window.
function getCalendarWeekDates(){
  const todayIso = getTodayISO();
  const t = new Date(todayIso+"T12:00:00");
  const dow = t.getDay(); // 0=Sun..6=Sat
  const deltaToMonday = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(t); mon.setDate(t.getDate() + deltaToMonday);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    return toISO(d.getFullYear(), d.getMonth(), d.getDate());
  });
}

// All ISO dates from startIso through endIso, inclusive — backs whenMode
// 'range' (the When sheet's From/To date-range picker).
function datesInRange(startIso, endIso){
  const out = [];
  let d = new Date(startIso+"T12:00:00");
  // Plain string comparison is safe here since every ISO date is the same
  // fixed-width YYYY-MM-DD shape — no need to compare as Date objects.
  // The 3,660-day cap is just a defensive backstop (the date inputs' own
  // max= already keeps a real range well under a year) so a malformed value
  // can never turn this into a runaway loop.
  for(let guard=0; guard<3660; guard++){
    const iso = toISO(d.getFullYear(), d.getMonth(), d.getDate());
    if(iso > endIso) break;
    out.push(iso);
    d.setDate(d.getDate()+1);
  }
  return out;
}

// The homepage's default resting-state window (no When/neighborhood/range
// picked) — the next `days` calendar days starting today. Replaces the old
// "every day in the currently-paged calendar month" behavior (2026-08-27,
// month prev/next removed): a fixed rolling window means the list always
// starts exactly at today, regardless of where in a month today happens to
// fall, and never requires paging to reach next month's events within the
// window.
function rollingWindowDates(days){
  const start = new Date(getTodayISO()+"T12:00:00");
  return Array.from({length: days}, (_,i)=>{
    const d = new Date(start); d.setDate(d.getDate()+i);
    return toISO(d.getFullYear(), d.getMonth(), d.getDate());
  });
}

// Every date (today onward) that actually has at least one event on it —
// deliberately unbounded, not capped to the 30-day default window. Used
// when a neighborhood is selected, so the list can reach every one of that
// neighborhood's upcoming events and its count always matches the
// neighborhood card's own (also-unbounded) count exactly — see
// computeNeighborhoodCounts() and viewNeighborhood().
function upcomingDatesWithEvents(){
  const todayIso = getTodayISO();
  return Object.keys(byDate).filter(iso => iso >= todayIso).sort();
}

// Short "Aug 28" / "Aug 28–Sep 3" label for a single date or a date range —
// used for both the active-filter chip and the list's count heading, so the
// two always read the same range the same way.
function formatDateLabel(iso){
  return new Date(iso+"T12:00:00").toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function formatRangeLabel(startIso, endIso){
  return startIso === endIso ? formatDateLabel(startIso) : `${formatDateLabel(startIso)}–${formatDateLabel(endIso)}`;
}
// Multi-day indicator for an event card (2026-09-02 audit fix) — cards are
// already grouped under a single day heading (see renderList()), so without
// this, a festival or exhibit's card looks identical to a one-day event no
// matter which day of its run you're looking at. Only renders when endDate
// is a real, later date than the card's own day — day 1 of a 3-day event
// shows "Through Aug 24", day 2 shows the same, so it's never ambiguous
// whether an event card belongs to a range still in progress.
function multiDayNoteHtml(e){
  if(!e.endDate || e.endDate <= e.date) return '';
  return `<div class="note">Through ${escapeHtml(formatDateLabel(e.endDate))}</div>`;
}

// The single source of truth for "which dates does the list currently
// show" — every render() call funnels through here instead of each mode
// scattering its own date-list logic. Order matters: a specific When
// shortcut/range takes priority over the neighborhood's unbounded window,
// which in turn takes priority over the plain rolling-window default.
function currentDateList(){
  if(whenMode === 'weekend') return cachedWeekendDates;
  if(whenMode === 'thisweek') return getCalendarWeekDates();
  if(whenMode === 'range' && rangeStart && rangeEnd) return datesInRange(rangeStart, rangeEnd);
  if(whenMode === 'date' && pickedDate) return [pickedDate];
  if(whenMode === 'tomorrow') return [getTomorrowISO()];
  if(whenMode === 'tonight') return [getTodayISO()];
  // "All Upcoming" (P0, 2026-08-28 product audit Gap 2) — the same
  // deliberately-unbounded "every date that actually has an event" function
  // the neighborhood rail already relies on, reused rather than duplicated.
  // This is what makes "show me everything" a real, one-click, zero-query
  // answer instead of the silent 30-day default below.
  if(whenMode === 'all') return upcomingDatesWithEvents();
  if(neighborhoodFilter) return upcomingDatesWithEvents();
  return rollingWindowDates(30);
}

// Paired with currentDateList() — the human-readable scope behind whatever
// it just returned, fed to renderList() for the "Showing N events ___"
// heading and the empty-state copy. null means "the plain default view",
// which gets neither a count heading nor an "in ___" empty-state suffix.
function currentListMeta(){
  if(whenMode === 'thisweek') return {scopeLabel: 'this week', countLabel: 'this week'};
  if(whenMode === 'weekend') return {scopeLabel: 'this weekend', countLabel: 'this weekend'};
  if(whenMode === 'range' && rangeStart && rangeEnd){
    const label = formatRangeLabel(rangeStart, rangeEnd);
    return {scopeLabel: label, countLabel: label};
  }
  if(whenMode === 'date' && pickedDate){
    const label = new Date(pickedDate+"T12:00:00").toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    return {scopeLabel: label, countLabel: label};
  }
  if(whenMode === 'tomorrow') return {scopeLabel: 'tomorrow', countLabel: 'tomorrow'};
  if(whenMode === 'tonight') return {scopeLabel: 'tonight', countLabel: 'tonight'};
  if(whenMode === 'all') return {scopeLabel: 'upcoming events', countLabel: 'upcoming — every date'};
  if(neighborhoodFilter) return {scopeLabel: neighborhoodFilter, countLabel: `in ${neighborhoodFilter}`};
  return {scopeLabel: null, countLabel: null};
}

// Every "narrow the list" filter EXCEPT date-scoping: category, free-only,
// neighborhood, search, and location/radius. Split out from matchesFilters()
// (2026-08-27) because a widget that shows several distinct dates at once —
// the View Calendar sidebar's Mon-Sun week strip — needs to count each of
// its own days on its own terms, not through the single-current-scope date
// logic below. Before this split, that strip called the full matchesFilters()
// per day and got zeroed out for every already-passed day in the week (today
// floor) and for every day but one whenever a When shortcut like Tomorrow was
// active (its date-equality checks) — a real regression Jody caught: past
// days in "This week" should still show their real counts, always.
function matchesNonDateFilters(e){
  if(isBlockedEvent(e)) return false;
  if(!activeCats.has(e.cat)) return false;
  if(freeOnly && !e.free) return false;
  // FEATURE_CHIPS filters (see their declaration above for the reasoning).
  // 'radar' reads editorialByEvent directly, the same lookup
  // editorialLinkHtml()/renderOnRadarCard() already use, rather than a
  // second copy of "is this event on the radar" logic.
  if(activeFeatures.has('tickets') && !e.ticketUrl) return false;
  if(activeFeatures.has('photo') && !e.imageUrl) return false;
  if(activeFeatures.has('submitted') && e.source !== 'Venue Submission') return false;
  if(activeFeatures.has('radar') && !(e.id != null && editorialByEvent[e.id])) return false;
  if(neighborhoodFilter && e.neighborhood !== neighborhoodFilter) return false;
  if(query){
    // Search matches everywhere in the event's metadata, not just title/venue —
    // Jody: "search should search for anything in the metadata" (2026-08-27).
    // Covers every text field already loaded client-side: title, venue, city,
    // category label, neighborhood, source, and any editorial note. Does NOT
    // reach the events.description column, since that's not fetched by
    // loadSupabaseEvents() today — adding it would mean pulling extra text for
    // every one of the (1,275+ and growing) approved rows just for search, so
    // it's left out until that's worth the payload cost.
    const q = query.toLowerCase();
    const haystack = [
      e.title, e.venue, e.city, CATS[e.cat] ? CATS[e.cat].label : '',
      e.neighborhood, e.source, e.note
    ].filter(Boolean).join(' ').toLowerCase();
    if(!haystack.includes(q)) return false;
  }
  if(originLocation && radiusMiles !== null){
    const loc = CITY_LOOKUP.get((e.city || "Detroit").toLowerCase());
    // An event whose city isn't in the reference table has no resolvable
    // distance from the chosen origin — excluded rather than guessed at
    // (this is an active, opt-in radius filter, not a safety net like NOW).
    if(!loc) return false;
    if(radiusMiles === 'all'){
      // Detroit Orbit: not narrowed by the chosen origin location itself
      // (that's what makes it the widest tier), but still hard-capped at 75
      // miles from Detroit's own city center — the fixed definition of the
      // Detroit Orbit boundary — so results never drift outside the site's
      // real coverage area no matter where the user searched from.
      const detroit = CITY_LOOKUP.get('detroit');
      if(haversineMiles(detroit.lat, detroit.lng, loc.lat, loc.lng) > 75) return false;
    } else if(haversineMiles(originLocation.lat, originLocation.lng, loc.lat, loc.lng) > radiusMiles){
      return false;
    }
  }
  return true;
}

// Evening classifier for the Tonight quick filter (restored 2026-08-28 —
// see WHEN_LABELS above for why). A bare "Evening" string in time_display
// counts directly, same vocabulary calendar.html's own time parsing already
// treats as evening; otherwise the event needs a parseable start time of
// 5pm or later. Unparseable/blank times are excluded — TONIGHT is a
// deliberate narrowing (unlike the default view's "still happening" safety
// net below), so an unknown time shouldn't silently qualify.
function isEveningTime(timeStr){
  if(!timeStr) return false;
  if(/evening/i.test(timeStr)) return true;
  const range = parseTimeRange(timeStr);
  return !!(range && range.start.h >= 17);
}

function matchesFilters(e){
  if(!matchesNonDateFilters(e)) return false;
  const todayIso = getTodayISO();
  // Baseline floor: the homepage list never shows a date before today, no
  // matter which month is being paged through or which time-range shortcut
  // (if any) is active — Jody: "I don't want events in the past to show up
  // as the first thing you see... those should only be available if a user
  // needs to go back in time," which is exactly what the dedicated
  // calendar.html page is for (it keeps its own independent month-browsing
  // and doesn't share this restriction).
  if(e.date < todayIso) return false;
  // 'all' (All Upcoming, P0 2026-08-28) deliberately has NO branch of its
  // own here — currentDateList() already scopes it to every date with an
  // event, unbounded, so nothing here needs to narrow by date again. It
  // still falls through to the today-only "hide once ended" block below
  // (grouped with the plain default state, not the whenMode chain), so
  // "show me everything" doesn't include a today event that's already
  // completely over — same "still happening or midnight" rule as the
  // default view, just without the 30-day ceiling.
  if(whenMode && whenMode !== 'all'){
    if(whenMode === 'weekend'){
      if(!cachedWeekendDates.includes(e.date)) return false;
    } else if(whenMode === 'thisweek'){
      // Backs the hero stat's "View all events" link (viewThisWeek()) — the
      // exact same Monday-Sunday window renderHeroToday() counted, so the
      // list a visitor lands on always shows precisely the number the hero
      // just told them, never a different (e.g. 30-day-window) count.
      if(!getCalendarWeekDates().includes(e.date)) return false;
    } else if(whenMode === 'range'){
      // A user-picked From/To range (see the When sheet's date-range
      // picker) — both ends inclusive, both always today or later since the
      // inputs' own min= floors match the restriction above.
      if(e.date < rangeStart || e.date > rangeEnd) return false;
    } else if(whenMode === 'date'){
      // A single arbitrary user-picked date (the When sheet's "From" input
      // with no "To") — always today or later, same reasoning as above.
      if(e.date !== pickedDate) return false;
    } else if(whenMode === 'tomorrow'){
      if(e.date !== getTomorrowISO()) return false;
    } else if(whenMode === 'tonight'){
      if(e.date !== todayIso || !isEveningTime(e.time)) return false;
    }
  } else if((!whenMode || whenMode === 'all') && e.date === todayIso){
    // No explicit time-range shortcut active (the page's own default
    // state), OR "All Upcoming" — both share this same today-only
    // narrowing. Previously hid a today event the moment its START hour
    // passed — Jody, 2026-08-28: "just because it began already doesn't
    // mean the user cannot still go or be interested," which is exactly
    // right: that rule dropped an event from the list while it was still
    // actively happening (a 6pm show vanished at 7pm). Now it only hides
    // once the event's own parsed END time has passed — "still happening
    // or midnight, whichever happens first." An event with no parseable
    // end time (a bare start time with no range, or a vague string like
    // "Evening") has no early cutoff at all and stays visible the rest of
    // the day; the date-floor check above is what drops it once the
    // calendar date itself rolls over to tomorrow — that's the "midnight"
    // half of the rule.
    const range = parseTimeRange(e.time);
    if(range && range.end && range.end.h >= range.start.h){
      // The >= guard skips a range that crosses midnight (e.g. 10pm-2am):
      // it's still legitimately "today" all the way through, so there's
      // nothing to cut off early — the date-floor check handles it
      // naturally once the date itself moves to tomorrow.
      const nowHour = new Date().getHours() + new Date().getMinutes()/60;
      const endHour = range.end.h + range.end.m/60;
      if(endHour < nowHour) return false;
    }
  }
  return true;
}

// Is this event within 75 miles of Detroit's own center — the fixed
// definition of "the Detroit Orbit"? Unlike the Detroit-Orbit branch inside
// matchesFilters() above, this is NOT gated on the visitor having picked an
// origin location or radius; it backs the homepage hero's "N things
// happening today in the Detroit Orbit" stat, which is meant to be a
// constant, site-wide count, not something that changes as someone filters
// the calendar below it.
function isInDetroitOrbit(e){
  const loc = CITY_LOOKUP.get((e.city || "Detroit").toLowerCase());
  if(!loc) return false;
  const detroit = CITY_LOOKUP.get('detroit');
  return haversineMiles(detroit.lat, detroit.lng, loc.lat, loc.lng) <= 75;
}

// Generic version of the above, parameterized on an arbitrary origin/radius
// — backs the "Near You" sidebar card, which needs the user's own chosen
// location (once set) rather than the fixed Detroit-center/75mi orbit.
function isWithinRadius(e, lat, lng, miles){
  const loc = CITY_LOOKUP.get((e.city || "Detroit").toLowerCase());
  if(!loc) return false;
  return haversineMiles(lat, lng, loc.lat, loc.lng) <= miles;
}

function buildFilterBar(){
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';

  // #filterBar doubles as the mobile FILTER sheet's content (see Chunk 4's
  // .sheet-active rules) — its innerHTML is fully rebuilt on every call, so
  // the sheet header has to be re-added here rather than living statically
  // in the HTML the way discoveryBar/locationBar's headers do.
  const header = document.createElement('div');
  header.className = 'sheet-header';
  const headerLabel = document.createElement('span');
  headerLabel.textContent = 'Filter';
  const headerClose = document.createElement('button');
  headerClose.type = 'button';
  headerClose.className = 'sheet-close';
  headerClose.setAttribute('aria-label', 'Close');
  headerClose.innerHTML = '&#10005;';
  header.appendChild(headerLabel);
  header.appendChild(headerClose);
  bar.appendChild(header);

  // "All types" — a single, explicit way back to the unfiltered Event Type
  // state, distinct from "Reset filters" below (which also clears When,
  // Where, and search). Active whenever every category is currently
  // selected, i.e. nothing has actually been narrowed yet.
  const allChip = document.createElement('button');
  allChip.type = 'button';
  const allActive = activeCats.size === Object.keys(CATS).length;
  allChip.className = 'chip' + (allActive ? ' active' : '');
  allChip.id = 'allTypesChip';
  allChip.setAttribute('aria-pressed', allActive ? 'true' : 'false');
  // Taxonomy-lock amendment (2026-08-26 clarification): the preserved list is
  // "All types" (sentence case) plus the 11 categories below, unchanged and
  // unreordered. The amendment is explicit that it locks the taxonomy only,
  // not presentation — so this text can still be restyled, just not renamed.
  allChip.textContent = 'All types';
  allChip.onclick = ()=>{
    activeCats = new Set(Object.keys(CATS));
    buildFilterBar();
    render();
  };
  bar.appendChild(allChip);

  Object.entries(CATS).forEach(([key,c])=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    // Reflects actual activeCats state (not hardcoded active) — matters once
    // state can also arrive from the URL or a "Clear All" that only clears
    // some dimensions, not just from clicking chips one at a time.
    chip.className = 'chip' + (activeCats.has(key) ? ' active' : '');
    chip.dataset.cat = key;
    chip.setAttribute('aria-pressed', activeCats.has(key) ? 'true' : 'false');
    // Per-category dot restored per Jody's 2026-08-26 note: keep the color
    // variety for scanability, just made cohesive (see the --c-* "UV signal"
    // palette above). Active/selected state is still Signal Chartreuse only.
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = ()=>{
      if(activeCats.has(key)){ activeCats.delete(key); chip.classList.remove('active'); }
      else { activeCats.add(key); chip.classList.add('active'); }
      chip.setAttribute('aria-pressed', activeCats.has(key) ? 'true' : 'false');
      render();
    };
    bar.appendChild(chip);
  });
  const freeChip = document.createElement('button');
  freeChip.type = 'button';
  freeChip.className = 'chip' + (freeOnly ? ' active' : '');
  freeChip.id = 'freeChip';
  freeChip.setAttribute('aria-pressed', freeOnly ? 'true' : 'false');
  freeChip.innerHTML = `<span class="dot" style="background:#16713a"></span>Free only`;
  freeChip.onclick = ()=>{
    freeOnly = !freeOnly;
    freeChip.classList.toggle('active');
    freeChip.setAttribute('aria-pressed', freeOnly ? 'true' : 'false');
    render();
  };
  bar.appendChild(freeChip);

  // FEATURE_CHIPS row — plain text chips (no color dot), same treatment as
  // allChip/clearChip below rather than the category dots, since these
  // aren't part of the locked category palette.
  FEATURE_CHIPS.forEach(({key, label})=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (activeFeatures.has(key) ? ' active' : '');
    chip.dataset.feature = key;
    chip.setAttribute('aria-pressed', activeFeatures.has(key) ? 'true' : 'false');
    chip.textContent = label;
    chip.onclick = ()=>{
      if(activeFeatures.has(key)){ activeFeatures.delete(key); chip.classList.remove('active'); }
      else { activeFeatures.add(key); chip.classList.add('active'); }
      chip.setAttribute('aria-pressed', activeFeatures.has(key) ? 'true' : 'false');
      render();
    };
    bar.appendChild(chip);
  });

  const clearChip = document.createElement('button');
  clearChip.type = 'button';
  clearChip.className = 'chip';
  clearChip.id = 'clearChip';
  clearChip.textContent = 'Reset filters';
  clearChip.onclick = ()=>{ clearAllFilters(); };
  bar.appendChild(clearChip);
}

// Resets every discovery dimension at once: categories, free-only, search
// text, and the when-shortcut — deliberately to null/Anytime, which is also
// what BROWSE means ("clear every narrowing dimension, see everything").
// Used by the category bar's "Reset filters" chip, the active-filter tray's
// "Clear All", AND the header's Browse button, so there's exactly one reset
// behavior instead of several subtly different ones. Since the resting
// (whenMode null) state's own currentDateList() is a rolling window from
// today, a reset also naturally lands back on today onward — no separate
// "jump back to this month" step needed the way the old month-paging system
// required.
function clearAllFilters(){
  activeCats = new Set(Object.keys(CATS));
  freeOnly = false;
  activeFeatures = new Set();
  document.getElementById('search').value = '';
  query = '';
  whenMode = null;
  pickedDate = null;
  rangeStart = null;
  rangeEnd = null;
  document.getElementById('whenDateInput').value = getTodayISO(); // Anytime's baseline "From" default (Jody, 2026-08-27) — see initWhenDatePicker()
  document.getElementById('whenDateEndInput').value = '';
  clearLocation({skipRender: true});
  neighborhoodFilter = null;
  buildFilterBar();
  render();
  renderNeighborhoodsRail();
}

// Renders the "what am I looking at" summary tray above the calendar/list —
// each active dimension shown as its own removable chip, per the brief's
// "filter state must be visible" requirement. Categories only show up here
// when narrowed below the full set (showing all 11 active chips twice, once
// in the category bar and again here, would just be noise).
function renderActiveFilters(){
  const tray = document.getElementById('activeFilters');
  const chips = [];

  if(whenMode === 'date' && pickedDate){
    const label = new Date(pickedDate+"T12:00:00").toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    chips.push({label, onRemove: ()=>{ whenMode = null; pickedDate = null; document.getElementById('whenDateInput').value = getTodayISO(); updateWhenButtons(); render(); }});
  } else if(whenMode === 'range' && rangeStart && rangeEnd){
    chips.push({label: formatRangeLabel(rangeStart, rangeEnd), onRemove: ()=>{
      whenMode = null; rangeStart = null; rangeEnd = null;
      document.getElementById('whenDateInput').value = getTodayISO();
      document.getElementById('whenDateEndInput').value = '';
      updateWhenButtons(); render();
    }});
  } else if(whenMode && WHEN_LABELS[whenMode]){
    chips.push({label: WHEN_LABELS[whenMode], onRemove: ()=>{ whenMode = null; document.getElementById('whenDateInput').value = getTodayISO(); updateWhenButtons(); render(); }});
  }
  if(freeOnly){
    chips.push({label: 'Free only', onRemove: ()=>{
      freeOnly = false;
      document.getElementById('freeChip').classList.remove('active');
      render();
    }});
  }
  FEATURE_CHIPS.forEach(({key, label})=>{
    if(!activeFeatures.has(key)) return;
    chips.push({label, onRemove: ()=>{
      activeFeatures.delete(key);
      buildFilterBar();
      render();
    }});
  });
  if(query){
    chips.push({label: `"${query}"`, onRemove: ()=>{
      query = '';
      document.getElementById('search').value = '';
      render();
    }});
  }
  if(activeCats.size < Object.keys(CATS).length){
    chips.push({label: `${activeCats.size} of ${Object.keys(CATS).length} categories`, onRemove: ()=>{
      activeCats = new Set(Object.keys(CATS));
      buildFilterBar();
      render();
    }});
  }
  if(originLocation){
    const radiusLabel = (radiusMiles === 'all' || radiusMiles === null) ? 'Detroit Orbit' : `${radiusMiles} mi`;
    chips.push({label: `${radiusLabel} · ${originLocation.name}`, onRemove: ()=> clearLocation()});
  }
  if(neighborhoodFilter){
    chips.push({label: neighborhoodFilter, onRemove: ()=>{ neighborhoodFilter = null; renderNeighborhoodsRail(); render(); }});
  }

  if(!chips.length){ tray.style.display = 'none'; tray.innerHTML = ''; return; }

  tray.style.display = 'flex';
  tray.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'af-label';
  label.textContent = 'Showing:';
  tray.appendChild(label);
  chips.forEach(({label: text, onRemove})=>{
    const chip = document.createElement('div');
    chip.className = 'af-chip';
    const span = document.createElement('span');
    span.textContent = text;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', `Remove ${text} filter`);
    btn.textContent = '✕';
    btn.onclick = onRemove;
    chip.appendChild(span);
    chip.appendChild(btn);
    tray.appendChild(chip);
  });
  const clearAll = document.createElement('button');
  clearAll.type = 'button';
  clearAll.className = 'af-clear';
  clearAll.textContent = 'Clear all';
  clearAll.onclick = ()=>{ clearAllFilters(); };
  tray.appendChild(clearAll);
}


// Escapes text before it's interpolated into innerHTML. Needed because some
// event fields (title, venue, city, note, source, ticketUrl) can originate
// from venue/organizer submissions via submit.html — untrusted input that
// reaches this page after admin approval. Without this, a submitted title
// like "<img src=x onerror=alert(1)>" would execute in every visitor's
// browser once approved. Same pattern already used in admin.html.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Short list-view excerpt of a longer description — collapses newlines
// (the full text's paragraph breaks matter on event.html, not squeezed into
// a 2-line list row) and cuts at a word boundary near maxLen rather than
// mid-word, then adds an ellipsis so it visibly reads as "more below."
function truncateText(str, maxLen){
  if(!str) return '';
  const flat = str.replace(/\s+/g, ' ').trim();
  if(flat.length <= maxLen) return flat;
  const cut = flat.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > maxLen * 0.6 ? cut.slice(0, lastSpace) : cut).trim() + '…';
}

// Canonical per-event permalink — undefined when the event has no real DB
// id (FALLBACK_EVENTS), same guard editorialLinkHtml() uses.
function eventUrl(e){
  return e.id != null ? `event.html?id=${encodeURIComponent(e.id)}` : null;
}

// Some submitted/imported rows have `source` set to a placeholder ("Manual")
// or literally repeat the venue name (e.g. a venue's own listing page —
// venue_name_raw "Trinosophes", source "Trinosophes"), which renders as a
// useless "via Trinosophes" right next to "Trinosophes" itself. Suppress the
// "via ..." label in both places it's shown (the visible venue line and the
// Add-to-Calendar description) whenever it wouldn't tell the reader anything
// the venue name hasn't already.
function shouldShowSource(e){
  if(!e.source) return false;
  const norm = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const src = norm(e.source);
  if(!src || src === 'manual') return false;
  if(e.venue && norm(e.venue) === src) return false;
  return true;
}

// Only allow http(s) links into href attributes. Blocks javascript: URLs and
// similar schemes that would otherwise let a submitted "ticket link" execute
// code on click instead of just navigating.
function safeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(url, window.location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  } catch {
    return '';
  }
}

// Real pricing only — never fabricated or inferred (approved: existing
// price_from data may now be surfaced). FREE keeps rendering exactly as
// before, from the database's own is_free flag. A price only renders when
// the event isn't free AND price_from is a genuine positive number —
// null/undefined/zero-with-not-free is treated as unavailable or
// ambiguous and simply omitted, never shown as "$0".
function fmtPrice(n){
  const rounded = Math.round(n*100)/100;
  const str = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2);
  return `$${str}+`;
}
// Plain right-aligned label (not a colored pill) — matches the mockup's
// clean category/price column. Category keeps its own site-wide color
// (see CATS), price/free stays plain ink so it doesn't visually compete.
function priceTag(e){
  if(e.free) return '<div class="evt-price free">Free</div>';
  if(typeof e.priceFrom === 'number' && isFinite(e.priceFrom) && e.priceFrom > 0){
    return `<div class="evt-price">${escapeHtml(fmtPrice(e.priceFrom))}</div>`;
  }
  return '';
}

// ---- Add to Calendar ----
// Builds a Google Calendar "quick add" link and a downloadable .ics file for
// one event, entirely client-side — there's no backend endpoint or build
// step to generate these ahead of time. The only time data the site has is
// the free-text time_display string (e.g. "11:00 AM–3:00 PM", "7:00 PM", or
// a vague "Evening"/"Varies") — parseTimeRange() below pulls a start (and
// end, if it's a range) out of whatever's actually parseable; an event with
// no parseable time at all becomes an all-day calendar entry rather than
// guessing a time. Times are treated as floating/local (America/Detroit,
// the site's only service area): the .ics intentionally omits any TZID/Z
// suffix, so every calendar app reads it in the viewer's own local clock —
// the overwhelming majority of this site's visitors are already in that
// timezone. Google's link gets an explicit ctz param for the same reason.
function parseTimeRange(timeStr){
  if(!timeStr) return null;
  const re = /(\d{1,2}):(\d{2})\s*(AM|PM)/gi;
  const matches = [...timeStr.matchAll(re)];
  if(!matches.length) return null;
  const to24 = (h,m,ap) => { let hh = parseInt(h,10)%12; if(/PM/i.test(ap)) hh += 12; return {h:hh, m:parseInt(m,10)}; };
  const start = to24(matches[0][1], matches[0][2], matches[0][3]);
  const end = matches.length > 1 ? to24(matches[1][1], matches[1][2], matches[1][3]) : null;
  return {start, end};
}

// Sortable minutes-since-midnight for a time_display string, via
// parseTimeRange() above — the same "what time does this start" parsing
// used everywhere else on the site, not a second definition that could
// drift from it. Added 2026-08-28: the byDate sort below used to compare
// e.time as plain text (localeCompare), which sorts "10:00 PM" before
// "3:00 PM" because the character '1' is less than '3' — a 10pm event was
// landing at the top of today's list, ahead of everything from noon
// through 9pm. Events with no parseable start time ("Evening", "Varies",
// blank) sort to the end of the day rather than colliding at position 0.
function timeSortMinutes(timeStr){
  const range = parseTimeRange(timeStr);
  return range ? range.start.h*60 + range.start.m : Infinity;
}

function pad2(n){ return String(n).padStart(2,'0'); }

// Returns {allDay:true, startDate, endDate} (endDate exclusive, per the
// iCalendar all-day convention) when no time is parseable at all, or
// {allDay:false, startDate, startTime, endDate, endTime} (YYYYMMDD /
// HHMMSS, local) otherwise.
function eventDateTimeParts(e){
  const [y,m,d] = e.date.split('-').map(Number);
  const range = parseTimeRange(e.time);
  const dateStr = `${y}${pad2(m)}${pad2(d)}`;
  if(!range){
    const next = new Date(y, m-1, d+1);
    const nextStr = `${next.getFullYear()}${pad2(next.getMonth()+1)}${pad2(next.getDate())}`;
    return { allDay:true, startDate:dateStr, endDate:nextStr };
  }
  const startTime = `${pad2(range.start.h)}${pad2(range.start.m)}00`;
  let endDateStr = dateStr;
  let endTime;
  if(range.end){
    endTime = `${pad2(range.end.h)}${pad2(range.end.m)}00`;
    // An end clock-time earlier than the start (e.g. "10:00 PM–2:00 AM")
    // means the event actually runs past midnight — roll DTEND to the next
    // calendar day rather than encoding an end before its own start.
    if(range.end.h < range.start.h || (range.end.h === range.start.h && range.end.m < range.start.m)){
      const next = new Date(y, m-1, d+1);
      endDateStr = `${next.getFullYear()}${pad2(next.getMonth()+1)}${pad2(next.getDate())}`;
    }
  } else {
    // No explicit end in the source data — default to a 2-hour block, a
    // reasonable middle ground for the kinds of events this site lists
    // (gallery hours, sets, screenings) without ever calling it "all day."
    const endDt = new Date(y, m-1, d, range.start.h, range.start.m + 120);
    endDateStr = `${endDt.getFullYear()}${pad2(endDt.getMonth()+1)}${pad2(endDt.getDate())}`;
    endTime = `${pad2(endDt.getHours())}${pad2(endDt.getMinutes())}00`;
  }
  return { allDay:false, startDate:dateStr, startTime, endDate:endDateStr, endTime };
}

function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

// Folds a single logical iCalendar line at 75 octets, per RFC 5545 §3.1 —
// long SUMMARY/DESCRIPTION/LOCATION values would otherwise produce an
// invalid file that some calendar apps silently truncate or reject.
function foldICSLine(line){
  if(line.length <= 75) return line;
  let out = line.slice(0,75);
  let rest = line.slice(75);
  while(rest.length){
    out += '\r\n ' + rest.slice(0,74);
    rest = rest.slice(74);
  }
  return out;
}

function buildEventDescription(e){
  const parts = [];
  if(e.description) parts.push(truncateText(e.description, 300));
  if(e.note) parts.push(e.note);
  if(shouldShowSource(e)) parts.push(`Via ${e.source}`);
  if(e.ticketUrl && safeUrl(e.ticketUrl)) parts.push(safeUrl(e.ticketUrl));
  const permalink = eventUrl(e);
  parts.push(`Details: ${permalink ? 'https://313.events/'+permalink : 'https://313.events/'}`);
  return parts.join('\n');
}

function buildEventLocation(e){
  return e.city ? `${e.venue}, ${e.city}` : e.venue;
}

function buildICS(e){
  const parts = eventDateTimeParts(e);
  const uid = `${e.date}-${e.title}-${e.venue}`.replace(/[^a-zA-Z0-9]+/g,'-').slice(0,150) + '@313.events';
  const now = new Date();
  const dtstamp = `${now.getUTCFullYear()}${pad2(now.getUTCMonth()+1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
  const dtstart = parts.allDay ? `DTSTART;VALUE=DATE:${parts.startDate}` : `DTSTART:${parts.startDate}T${parts.startTime}`;
  const dtend = parts.allDay ? `DTEND;VALUE=DATE:${parts.endDate}` : `DTEND:${parts.endDate}T${parts.endTime}`;
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//313.events//Add to Calendar//EN',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    dtstart,
    dtend,
    `SUMMARY:${icsEscape(e.title)}`,
    `LOCATION:${icsEscape(buildEventLocation(e))}`,
    `DESCRIPTION:${icsEscape(buildEventDescription(e))}`,
    'END:VEVENT',
    'END:VCALENDAR',
  ];
  return lines.map(foldICSLine).join('\r\n');
}

function buildGoogleCalUrl(e){
  const parts = eventDateTimeParts(e);
  const dates = parts.allDay
    ? `${parts.startDate}/${parts.endDate}`
    : `${parts.startDate}T${parts.startTime}/${parts.endDate}T${parts.endTime}`;
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: e.title,
    dates,
    details: buildEventDescription(e),
    location: buildEventLocation(e),
    ctz: 'America/Detroit',
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

// Rendered inline per event — a plain data: URI .ics link with no
// `download` attribute, so a tap on mobile opens the OS's native "Add to
// Calendar" sheet directly (a `download` attribute forces a generic file
// save instead on iOS in particular). Google Calendar is offered as a
// second, explicit option since not every visitor's default calendar app
// picks up a tapped .ics link that way.
function addToCalendarHtml(e){
  const icsHref = `data:text/calendar;charset=utf-8,${encodeURIComponent(buildICS(e))}`;
  const gcalHref = buildGoogleCalUrl(e);
  return `<span class="evt-cal">
    <a href="${escapeHtml(gcalHref)}" target="_blank" rel="noopener noreferrer">Google Cal</a><a href="${escapeHtml(icsHref)}">Apple/Outlook</a>
  </span>`;
}

// ---- Share ----
// 2026-08-28: now that event.html exists, sharing hands off a real deep
// link that reopens this exact event (falls back to the homepage only for
// FALLBACK_EVENTS, which have no DB id to link to — see eventUrl()).
function shareEvent(btn){
  const {title, venue, date, time, url: permalink} = btn.dataset;
  const bits = [title, venue].filter(Boolean).join(' — ');
  const when = [date, time].filter(Boolean).join(' ');
  const text = when ? `${bits} (${when})` : bits;
  const url = permalink || 'https://313.events/';
  if(navigator.share){
    navigator.share({title, text, url}).catch(()=>{}); // user cancel throws — nothing to do
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(`${text}\n${url}`).then(()=>{
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.disabled = true;
      setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 1600);
    }).catch(()=>{}); // no clipboard permission — nothing else to fall back to
  }
}

function shareButtonHtml(e){
  const dateLabel = new Date(e.date+"T12:00:00").toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const permalink = eventUrl(e);
  return `<button type="button" class="evt-share" onclick="shareEvent(this)"
    data-title="${escapeHtml(e.title)}" data-venue="${escapeHtml(e.venue)}"
    data-date="${escapeHtml(dateLabel)}" data-time="${escapeHtml(e.time||'')}"
    ${permalink?`data-url="https://313.events/${escapeHtml(permalink)}"`:''}>Share</button>`;
}

// "As seen in: [Article title]" — only renders when loadEditorialArticles()
// has already resolved a match for this specific event (keyed by e.id, see
// that function). Renders nothing (not a placeholder/skeleton) for every
// event without a match, which is the large majority — press coverage is
// the exception, not the norm, for any single listing.
function editorialLinkHtml(e){
  const article = e.id != null ? editorialByEvent[e.id] : null;
  if(!article || !safeUrl(article.url)) return '';
  return `<a class="evt-editorial-mention" href="${escapeHtml(safeUrl(article.url))}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(article.title)}${article.source?` — ${escapeHtml(article.source)}`:''}"><span class="ei-tag">As seen in</span><span class="ei-title">${escapeHtml(article.title)}</span>${article.source?`<span class="ei-src">— ${escapeHtml(article.source)}</span>`:''}</a>`;
}

// dateList is always an explicit array of ISO date strings to render — see
// currentDateList() for how it's built for each mode (rolling 30-day
// default, a single day, a weekend, a this-week window, a user-picked
// range, or every upcoming date when a neighborhood is selected). Month
// paging was removed (2026-08-27), so there's no "every day in current's
// month" fallback left to fall back to.
// meta (optional) — {scopeLabel, countLabel} from currentListMeta(): when
// set, a "Showing N events ___" heading is rendered above the list (Jody:
// clicking "View all events" or a neighborhood card should show a count
// that visibly matches what the user was just told), and scopeLabel feeds
// the empty-state copy ("Nothing on the signal here in ___").
function renderList(dateList, meta){
  meta = meta || {};
  const el = document.getElementById('listView');
  const isos = dateList;
  let html = '';
  let any = false;
  let matchCount = 0;
  for(const iso of isos){
    const events = (byDate[iso]||[]).filter(e=>matchesFilters(e));
    if(!events.length) continue;
    any = true;
    matchCount += events.length;
    const label = new Date(iso+"T12:00:00").toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    html += `<div class="list-day-group"><div class="list-day-heading">${label}</div>` +
      events.map(e=>`
        <div class="evt-row">
          <div class="evt-time">${escapeHtml(e.time)||''}</div>
          <div class="evt-main">
            <div class="evt-title">${eventUrl(e)?`<a class="evt-title-link" href="${escapeHtml(eventUrl(e))}">${escapeHtml(e.title)}</a>`:escapeHtml(e.title)}</div>
            <div class="evt-venue">${escapeHtml(e.venue)}${e.city?` — ${escapeHtml(e.city)}`:''}${shouldShowSource(e)?` <span class="src">via ${escapeHtml(e.source)}</span>`:''}</div>
            ${e.description?`<div class="evt-desc">${escapeHtml(truncateText(e.description, 140))}</div>`:''}
            ${e.note?`<div class="note">${escapeHtml(e.note)}</div>`:''}
            ${multiDayNoteHtml(e)}
            ${editorialLinkHtml(e)}
            <div class="evt-actions">
              ${e.ticketUrl && safeUrl(e.ticketUrl)?`<a class="evt-link" href="${escapeHtml(safeUrl(e.ticketUrl))}" target="_blank" rel="noopener noreferrer">${e.free?'More info':'Tickets &amp; info'}</a>`:''}
              ${addToCalendarHtml(e)}
              ${shareButtonHtml(e)}
            </div>
          </div>
          <div class="evt-side">
            <div class="evt-cat" style="color:${CATS[e.cat].color}">${CATS[e.cat].label}</div>
            ${priceTag(e)}
          </div>
        </div>
      `).join('') + `</div>`;
  }
  // The true default view (no When shortcut, no neighborhood) gets its own
  // boundary disclosure instead of a count heading — see .list-scope-note
  // above and Gap 2/8 in the 2026-08-28 product audit. Every other scope
  // (including "All Upcoming" itself, and the neighborhood rail) already
  // states its own scope via meta.countLabel, so this only applies to the
  // one silent case.
  const scopeNote = (any && !whenMode && !neighborhoodFilter)
    ? `<div class="list-scope-note">Showing the next 30 days — <button type="button" onclick="activateWhen('all')">see everything &rarr;</button></div>`
    : '';
  const countHeading = (any && meta.countLabel)
    ? `<div class="list-count-heading">Showing ${matchCount} event${matchCount===1?'':'s'} ${meta.countLabel}</div>`
    : '';
  el.innerHTML = any ? (scopeNote + countHeading + html) : `<div class="empty-state">${emptyStateMessage(meta.scopeLabel || null)}</div>`;
}

// The homepage's real, always-on stat (approved: homepage defaults to
// TODAY). Per the mockup, this is a fixed "N things happening this week in
// the Detroit Orbit" count rather than an inline preview of individual
// events — deliberately independent of whenMode AND of
// activeCats/freeOnly/query, so it reads as a constant pulse of the whole
// city rather than a number that shrinks as someone narrows their own
// filters below. Scoped to the current Monday-Sunday week rather than just
// today (2026-08-26: too few events land on any single day yet for a
// same-day count to read as a real number — revisit narrowing this back to
// today once daily volume no longer needs the wider window). Real count,
// from real data (byDate + isInDetroitOrbit + getCalendarWeekDates) — never
// fabricated.
function renderHeroToday(){
  const el = document.getElementById('heroToday');
  if(!el) return;
  const weekDates = getCalendarWeekDates();
  const todayIso = getTodayISO();
  // Excludes any day of this Mon-Sun week that's already past (2026-08-27
  // fix) — without this, the count could include Monday/Tuesday/etc. events
  // that already happened by the time someone's looking at this on, say, a
  // Thursday, which both overstates "happening this week" and used to
  // silently disagree with what clicking "View all events" (viewThisWeek(),
  // via the same today-onward floor in matchesFilters()) actually showed.
  const count = weekDates.reduce((total, iso) =>
    total + (iso < todayIso ? 0 : (byDate[iso]||[]).filter(e=>!isBlockedEvent(e) && isInDetroitOrbit(e)).length)
  , 0);

  el.innerHTML = `
    <div class="hero-stat-number">${count}</div>
    <div class="hero-stat-caption">${count === 1 ? 'Thing' : 'Things'} happening this week in the Detroit Orbit.</div>
    <button type="button" class="hero-stat-cta" onclick="viewThisWeek()">View all events &rarr;</button>
    <div class="hero-stat-orbit">Detroit Orbit &middot; up to 75 miles across 2 states &amp; 2 countries</div>
  `;
}

// "What's in your Detroit Orbit?" (redesigned from "Near You", Jody
// 2026-08-27) — the old version silently defaulted to Downtown Detroit +
// 25mi without ever asking the visitor anything. This version has exactly
// two states: no origin yet -> a real "Use my location" CTA (never guesses
// a location on its own); origin already known (from geolocation here, or
// picked manually via the Where sheet) -> the real Detroit Orbit radius
// (75mi, matching the "Detroit Orbit" radius chip everywhere else on the
// site) around that real point, with a live count.
const DETROIT_ORBIT_MILES = 75;

function renderNearYouCard(){
  const el = document.getElementById('nearYouCard');
  if(!el) return;

  if(!originLocation){
    // Teaser number before the visitor has a location set (Jody, 2026-08-27:
    // "the total number of current and upcoming events... communicates the
    // value of this site to users, partners, and advertisers") — not a
    // personalized "near you" figure, that's what the CTA below is for.
    // Prefers orbitEventTotal, Postgres's own exact count of current+upcoming
    // approved rows (see loadOrbitEventTotal()) — it's the real site-wide
    // total. Falls back to counting today-onward EVENTS client-side only
    // until that dedicated request resolves (or if it fails); EVENTS.length
    // alone is never used here since it's capped by the main list query's
    // own row budget, not a real total.
    const todayIso = getTodayISO();
    const fallbackCount = EVENTS.filter(e=>!isBlockedEvent(e) && e.date >= todayIso).length;
    const totalLoaded = orbitEventTotal !== null ? orbitEventTotal : fallbackCount;
    el.innerHTML = `
      <div class="side-card-head"><h2>What's in your Detroit Orbit?</h2></div>
      <div class="ny-radar" aria-hidden="true">
        <span class="ny-ring ny-ring-1"></span>

        <span class="ny-ring ny-ring-3"></span>
        <span class="ny-ping"></span>
        <span class="ny-dot"></span>
      </div>
      <div class="side-card-number">${totalLoaded.toLocaleString()}</div>
      <p class="side-card-caption">events loaded across the Detroit Orbit</p>
      <p class="side-card-sub">See what's on up to 75 miles out — Detroit, Ann Arbor, Windsor &amp; beyond.</p>
      <button type="button" class="side-card-cta" onclick="viewMyOrbit()">Use my location &rarr;</button>
    `;
    return;
  }

  const todayIso = getTodayISO();
  let count = 0;
  Object.keys(byDate).forEach(iso=>{
    if(iso < todayIso) return;
    count += byDate[iso].filter(e=>!isBlockedEvent(e) && isWithinRadius(e, originLocation.lat, originLocation.lng, DETROIT_ORBIT_MILES)).length;
  });
  el.innerHTML = `
    <div class="side-card-head"><h2>What's in your Detroit Orbit?</h2></div>
    <div class="ny-radar" aria-hidden="true">
      <span class="ny-ring ny-ring-1"></span>
      <span class="ny-ring ny-ring-2"></span>
      <span class="ny-ring ny-ring-3"></span>
      <span class="ny-ping"></span>
      <span class="ny-dot"></span>
    </div>
    <p class="side-card-sub">Within ${DETROIT_ORBIT_MILES} mi of ${escapeHtml(originLocation.name)}</p>
    <div class="side-card-number">${count}</div>
    <p class="side-card-caption">upcoming event${count === 1 ? '' : 's'}</p>
    <button type="button" class="side-card-cta" onclick="viewMyOrbit()">View what's nearby you &rarr;</button>
  `;
}

// The card's one and only interaction. No origin yet: request geolocation
// (same explicit-click-only pattern as the Where sheet's "Use my location"
// button — never on page load) and, on success, set the real Detroit Orbit
// radius around it. Origin already known: just (re)apply the 75mi Detroit
// Orbit radius at that origin, in case a narrower radius was set elsewhere.
// Either way this ends by dropping the visitor straight into the filtered
// list, scrolled into view — the CTA IS the whole interaction, no separate
// second "now view it" step.
function viewMyOrbit(){
  if(originLocation){
    radiusMiles = 'all';
    updateLocationControlUI();
    render(); // render() -> renderSidebar() -> renderNearYouCard(), so the card refreshes as part of this same call
    document.getElementById('listView').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }

  const card = document.getElementById('nearYouCard');
  const btn = card ? card.querySelector('.side-card-cta') : null;
  const original = btn ? btn.textContent : '';

  if(!navigator.geolocation){
    if(btn){
      btn.textContent = 'Not supported';
      setTimeout(()=>{ btn.textContent = original; }, 2500);
    }
    return;
  }
  if(btn){ btn.textContent = 'Locating…'; btn.disabled = true; }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      originLocation = {name: 'Your location', type: 'here', region: '', lat: pos.coords.latitude, lng: pos.coords.longitude};
      radiusMiles = 'all';
      updateLocationControlUI();
      render(); // render() -> renderSidebar() -> renderNearYouCard(), so the card refreshes as part of this same call
      document.getElementById('listView').scrollIntoView({behavior:'smooth', block:'start'});
    },
    ()=>{
      if(btn){
        btn.textContent = 'Location unavailable';
        btn.disabled = false;
        setTimeout(()=>{ btn.textContent = original; }, 2500);
      }
    },
    {timeout: 8000}
  );
}

// Explore Neighborhoods rail — real per-neighborhood counts only. Built from
// VENUE_NEIGHBORHOOD_MAP (venues.neighborhood_id, resolved via the
// venues/neighborhoods review — see supabase/migration_010), NOT a
// lat/lng-radius guess: a venue with no confirmed neighborhood contributes
// to no card here, rather than being force-assigned to the nearest point on
// a map. Counts are a constant discovery signal like the hero stat / Near
// You / Free Today — independent of activeCats/freeOnly/query/whenMode —
// but DO respect neighborhoodFilter's own "today or later" floor, same as
// everywhere else on the homepage.
const NEIGHBORHOOD_RAIL_LIMIT = 10;

function computeNeighborhoodCounts(){
  const todayIso = getTodayISO();
  const counts = new Map();
  Object.keys(byDate).forEach(iso=>{
    if(iso < todayIso) return;
    (byDate[iso]||[]).forEach(e=>{
      if(isBlockedEvent(e)) return;
      if(!e.neighborhood) return;
      counts.set(e.neighborhood, (counts.get(e.neighborhood)||0) + 1);
    });
  });
  return [...counts.entries()].sort((a,b)=> b[1]-a[1]);
}

function renderNeighborhoodsRail(){
  const section = document.getElementById('neighborhoodsSection');
  const rail = document.getElementById('neighborhoodsRail');
  if(!section || !rail) return;
  const counts = computeNeighborhoodCounts().slice(0, NEIGHBORHOOD_RAIL_LIMIT);
  if(!counts.length){ section.style.display = 'none'; rail.innerHTML = ''; return; }
  section.style.display = '';
  rail.innerHTML = counts.map(([name, count])=>`
    <button type="button" class="neigh-card${neighborhoodFilter===name?' active':''}" data-neighborhood="${escapeHtml(name)}">
      <span class="neigh-name">${escapeHtml(name)}</span>
      <span class="neigh-count">${count}</span>
      <span class="neigh-count-label">event${count===1?'':'s'}</span>
    </button>
  `).join('');
  rail.querySelectorAll('.neigh-card').forEach(btn=>{
    btn.addEventListener('click', ()=> viewNeighborhood(btn.dataset.neighborhood));
  });
}

// Toggle: clicking the already-active neighborhood clears it, same pattern

    // selecting a fresh neighborhood resets every other narrowing dimension
    // to match it exactly, rather than silently showing fewer than the tile
    // promised because some other filter was still active from before. The
    // user can narrow further from that full baseline afterward.
    activeCats = new Set(Object.keys(CATS));
    freeOnly = false;
    activeFeatures = new Set();
    document.getElementById('search').value = '';
    query = '';
    whenMode = null;
    pickedDate = null;
    rangeStart = null;
    rangeEnd = null;
    document.getElementById('whenDateInput').value = getTodayISO();
    document.getElementById('whenDateEndInput').value = '';
    clearLocation({skipRender: true});

  render();
  document.getElementById('listView').scrollIntoView({behavior:'smooth', block:'start'});

// Shared empty-state copy for the list view. Per the brief: never a dead
// end — always paired with concrete actions to widen the search, not just
// a flat "nothing here."
function emptyStateMessage(scopeLabel){
  const actions = [];
  if(whenMode || neighborhoodFilter) actions.push(`<button type="button" class="es-action" onclick="clearAllFilters()">Clear all filters</button>`);
  // Nothing in the next 30 days doesn't mean nothing at all — offer the
  // same All Upcoming escape hatch here as the populated default view gets
  // (see .list-scope-note / renderList()) rather than leaving an empty
  // 30-day window looking like a dead end (P0, 2026-08-28 product audit
  // Gap 2/8).
  if(!whenMode && !neighborhoodFilter) actions.push(`<button type="button" class="es-action" onclick="activateWhen('all')">See all upcoming events</button>`);
  if(originLocation && radiusMiles !== 'all' && radiusMiles !== null) actions.push(`<button type="button" class="es-action" onclick="expandRadius()">Expand radius</button>`);
  if(activeCats.size < Object.keys(CATS).length) actions.push(`<button type="button" class="es-action" onclick="activeCats=new Set(Object.keys(CATS));buildFilterBar();render();">Show all categories</button>`);
  if(query) actions.push(`<button type="button" class="es-action" onclick="query='';document.getElementById('search').value='';render();">Clear search</button>`);
  const scope = scopeLabel ? ` in ${escapeHtml(scopeLabel)}` : '';
  return `Nothing on the signal here${scope}.` + (actions.length ? `<div class="es-actions">${actions.join('')}</div>` : '');
}

// ---- Discovery bar (time-range shortcuts) ----

function updateWhenButtons(){

  });

function activateWhen(key){

  pickedDate = null;
  rangeStart = null;
  rangeEnd = null;
  document.getElementById('whenDateInput').value = '';
  document.getElementById('whenDateEndInput').value = '';

  if(key === 'weekend'){
    cachedWeekendDates = getWeekendDates();
  }

  closeSheet(); // each WHEN option is a single, complete choice — dismiss the mobile sheet after picking one, unlike WHERE/FILTER which stay open for further adjustment.
  // Jody (2026-08-27): picking a When shortcut — whether from the top-nav
  // (Tomorrow/This Weekend) or from inside the When sheet itself, since both
  // share this one handler — should bring the results in front of the
  // visitor's eyes immediately, same as Today/viewThisWeek/viewNeighborhood

  // down the page on their own.

document.querySelectorAll('.when-btn').forEach(btn=>{

// The When sheet's From/To date pair (Jody, 2026-08-27 — expanded from a
// single "pick a date" input to also support a range, while staying two
// plain native <input type="date"> fields rather than a custom calendar
// widget, per her "keep it simple, has to work with stumpy fingers on a
// handset" requirement).
//
// "From" alone (no "To") is a single-day pick — whenMode 'date', unchanged
// from the original single-input behavior. Filling in "To" as well switches
// to whenMode 'range'. Clearing "To" reverts to the single-day behavior
// rather than clearing "From" too, since "From" is still a complete,
// meaningful choice on its own.
function activateDateFrom(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
  const endInput = document.getElementById('whenDateEndInput');
  endInput.min = iso; // "To" can never be before "From"
  const endVal = endInput.value;
  if(endVal && endVal >= iso){
    whenMode = 'range';
    rangeStart = iso;
    rangeEnd = endVal;
  } else {
    // No "To" set, or it's now before the new "From" — a stale "To" from a
    // previous pick would silently build an invalid/backwards range, so
    // it's cleared rather than left to produce confusing results.
    if(endVal && endVal < iso) endInput.value = '';
    whenMode = 'date';
    pickedDate = iso;
    rangeStart = null;
    rangeEnd = null;
  }
  updateWhenButtons();
  render();
  closeSheet();
}

function activateDateTo(iso){
  const fromInput = document.getElementById('whenDateInput');
  const fromVal = fromInput.value;
  if(!iso){
    // "To" cleared — fall back to whatever "From" alone means.
    if(fromVal){ whenMode = 'date'; pickedDate = fromVal; }
    else { whenMode = null; pickedDate = null; }
    rangeStart = null;
    rangeEnd = null;
  } else if(fromVal && iso >= fromVal){
    whenMode = 'range';
    rangeStart = fromVal;
    rangeEnd = iso;
  } else {
    return; // "To" before "From" (shouldn't happen given min=, but don't apply an invalid range if it does)
  }
  updateWhenButtons();
  render();
  closeSheet();
}

function initWhenDatePicker(){
  const fromInput = document.getElementById('whenDateInput');
  const toInput = document.getElementById('whenDateEndInput');
  const todayIso = getTodayISO();
  // toISO() is a pure formatter, not a date normalizer — day 0 has to be
  // resolved to "the last day of the previous month" via a real Date first,
  // then formatted, rather than handed to toISO() directly (that would
  // format literally as "-00" instead of rolling back a month).
  const lastDayOfMax = new Date(MAX_MONTH.getFullYear(), MAX_MONTH.getMonth()+1, 0);
  const maxIso = toISO(lastDayOfMax.getFullYear(), lastDayOfMax.getMonth(), lastDayOfMax.getDate());
  fromInput.min = todayIso;
  fromInput.max = maxIso;
  toInput.min = todayIso;
  toInput.max = maxIso;
  // Jody (2026-08-27): the "Anytime" baseline state should default the
  // "From" field to today's date rather than leaving it blank — so opening
  // the native date picker starts on today (the same day the default
  // rolling-window list already opens on) instead of an empty field with no
  // starting point. This is a DISPLAY default only: it does not set whenMode
  // or pickedDate (that still requires an actual change event, i.e. the user
  // confirming a date), and readStateFromURL() below still overwrites it
  // whenever a shared link actually specifies a date/range/tomorrow/weekend.
  fromInput.value = todayIso;
  fromInput.addEventListener('change', (e)=> activateDateFrom(e.target.value));
  toInput.addEventListener('change', (e)=> activateDateTo(e.target.value));
}

// Tracks which suggestion (if any) is currently arrow-key-highlighted —
// part of the Chunk 4 accessibility pass so this combobox is fully
// keyboard-operable, not just clickable.
let locHighlightIndex = -1;

function renderLocationSuggestions(q){
  const box = document.getElementById('locSuggestions');
  const input = document.getElementById('locInput');
  box.innerHTML = '';
  locHighlightIndex = -1;
  input.removeAttribute('aria-activedescendant');
  if(!q || !q.trim()){
    box.style.display = 'none';
    input.setAttribute('aria-expanded', 'false');
    return;
  }
  const ql = q.trim().toLowerCase();
  const matches = LOCATIONS.filter(l => l.name.toLowerCase().includes(ql)).slice(0, 8);
  if(!matches.length){
    box.innerHTML = `<div class="loc-empty">No matches in the service area</div>`;
  } else {
    matches.forEach((loc, i)=>{
      const item = document.createElement('div');
      item.className = 'loc-item';
      item.id = `locItem${i}`;
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', 'false');
      item.tabIndex = -1;
      const nameEl = document.createElement('span');
      nameEl.className = 'loc-item-name';
      nameEl.textContent = loc.name;
      const typeEl = document.createElement('span');
      typeEl.className = 'loc-item-type';
      typeEl.textContent = `${loc.type.toUpperCase()} · ${loc.region.toUpperCase()}`;
      item.appendChild(nameEl);
      item.appendChild(typeEl);
      item.onclick = ()=> selectLocation(loc);
      item.onmouseenter = ()=> setLocHighlight(i);
      box.appendChild(item);
    });
  }
  box.style.display = 'block';
  input.setAttribute('aria-expanded', 'true');
}

// Moves the arrow-key highlight to suggestion index i (or clears it for -1),
// keeping the visible .hl style, aria-selected, and aria-activedescendant
// all in sync with each other.
function setLocHighlight(i){
  const items = document.querySelectorAll('#locSuggestions .loc-item');
  const input = document.getElementById('locInput');
  items.forEach(el => { el.classList.remove('hl'); el.setAttribute('aria-selected', 'false'); });
  if(i >= 0 && i < items.length){
    items[i].classList.add('hl');
    items[i].setAttribute('aria-selected', 'true');
    items[i].scrollIntoView({block: 'nearest'});
    input.setAttribute('aria-activedescendant', items[i].id);
    locHighlightIndex = i;
  } else {
    input.removeAttribute('aria-activedescendant');
    locHighlightIndex = -1;
  }
}

// Sets the active search-radius origin, defaulting radius to 'all' (visible,
// non-narrowing) so choosing a location alone never silently hides events —
// the user has to deliberately pick a mile ring to actually narrow anything.
function selectLocation(loc){
  originLocation = loc;
  if(radiusMiles === null) radiusMiles = 'all';
  document.getElementById('locSuggestions').style.display = 'none';
  document.getElementById('locSuggestions').innerHTML = '';
  updateLocationControlUI();
  render();
}

// opts.skipRender lets clearAllFilters() reset location state without
// triggering a second render() right before its own render() call.
function clearLocation(opts){
  originLocation = null;
  radiusMiles = null;
  document.getElementById('locInput').value = '';
  document.getElementById('locSuggestions').style.display = 'none';
  updateLocationControlUI();
  if(!(opts && opts.skipRender)) render();
}

function expandRadius(){
  const steps = [5, 10, 25, 50, 'all'];
  const idx = steps.indexOf(radiusMiles);
  radiusMiles = steps[idx === -1 ? steps.length - 1 : Math.min(idx + 1, steps.length - 1)];
  updateRadiusButtons();

}

// Requests the browser's geolocation only on this explicit click — never on
// page load — per the brief's requirement to ask before using device
// location. Fails soft on denial/timeout: the text search box stays usable
// either way, nothing else on the page depends on this succeeding.
function useMyLocation(){
  const btn = document.getElementById('useMyLocationBtn');
  const original = btn.textContent;
  if(!navigator.geolocation){
    btn.textContent = 'Not supported';
    setTimeout(()=>{ btn.textContent = original; }, 2500);
    return;
  }
  btn.textContent = 'Locating…';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      selectLocation({name: 'Your location', type: 'here', region: '', lat: pos.coords.latitude, lng: pos.coords.longitude});
      btn.textContent = original;
      btn.disabled = false;
    },
    ()=>{
      btn.textContent = 'Location unavailable';
      btn.disabled = false;
      setTimeout(()=>{ btn.textContent = original; }, 2500);
    },
    {timeout: 8000}
  );
}

  } else if(e.key === 'Enter'){
    e.preventDefault();
    const target = items[locHighlightIndex] || items[0];
    if(target) target.click();
  }
});
